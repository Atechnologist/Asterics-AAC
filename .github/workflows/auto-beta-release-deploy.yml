name: Beta release - Deploy

on:
  workflow_run:
    workflows: ["Beta release - Build"]
    types: [completed]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact from Workflow 1
        uses: actions/download-artifact@v4
        with:
          name: beta-deployment-bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./deploy-bundle

      - name: Read and validate metadata
        id: meta
        run: |
          if [[ ! -f ./deploy-bundle/.deploy-metadata.env ]]; then
            echo "Error: .deploy-metadata.env not found in artifact!"
            exit 1
          fi

          REMOTE_PATH=$(grep '^REMOTE_PATH=' ./deploy-bundle/.deploy-metadata.env | cut -d'=' -f2-)
          PREVIEW_URL=$(grep '^PREVIEW_URL=' ./deploy-bundle/.deploy-metadata.env | cut -d'=' -f2-)
          PR_NUMBER=$(grep '^PR_NUMBER=' ./deploy-bundle/.deploy-metadata.env | cut -d'=' -f2-)

          if [[ -z "$REMOTE_PATH" || "$REMOTE_PATH" == *".."* || "$REMOTE_PATH" == /* ]]; then
            echo "Error: Invalid REMOTE_PATH ($REMOTE_PATH)"
            exit 1
          fi

          rm -f ./deploy-bundle/.deploy-metadata.env

          echo "remote_path=$REMOTE_PATH" >> "$GITHUB_OUTPUT"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Deployment preview URL: $PREVIEW_URL"

      - name: Deploy and Sync via SFTP (lftp)
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          PASS: ${{ secrets.IONOS_SFTP_PASS }}
          REMOTE_PATH: ${{ steps.meta.outputs.remote_path }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp

          lftp -u "$USER","$PASS" sftp://$HOST <<EOF
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no"
          mkdir -fp "$REMOTE_PATH"
          cd "$REMOTE_PATH"
          mirror -R --delete -v ./deploy-bundle/ .
          bye
          EOF

      - name: Replace old PR comment with new preview URL
        if: success() && steps.meta.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number("${{ steps.meta.outputs.pr_number }}");
            const previewUrl = "${{ steps.meta.outputs.preview_url }}";
            const commentMarker = "<!-- beta-preview-comment -->";
            const message = `${commentMarker}\n🎉 **Beta deployment successful!**: view the changes in live preview environment: ${previewUrl}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });

            for (const comment of comments) {
              const isBot = comment.user && comment.user.type === 'Bot';
              const hasMarker = comment.body && (
                comment.body.includes(commentMarker) ||
                comment.body.includes('Beta deployment successful!')
              );
              if (isBot && hasMarker) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: message
            });