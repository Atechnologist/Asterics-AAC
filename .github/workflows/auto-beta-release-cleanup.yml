name: Beta release - Cleanup

on:
  pull_request_target:
    types: [closed]

concurrency:
  group: deploy-${{ github.event.pull_request.head.repo.full_name }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

permissions:
  issues: write
  pull-requests: write

jobs:
  cleanup:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Calculate remote SFTP path
        id: prepare_path
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          SANITIZED_BRANCH=$(echo "$PR_HEAD_REF" | tr -cs '[:alnum:]' '-' | tr '[:upper:]' '[:lower:]' | sed 's/^-//;s/-$//')
          SANITIZED_USER=$(echo "$PR_USER" | tr -cd '[:alnum:]-_')
          FULL_REMOTE_PATH="${SANITIZED_USER}/${SANITIZED_BRANCH}/pr"

          if [[ -z "$SANITIZED_USER" ]]; then
            echo "Error: SANITIZED_USER is empty"
            exit 1
          fi

          if [[ -z "$SANITIZED_BRANCH" ]]; then
            echo "Error: SANITIZED_BRANCH is empty"
            exit 1
          fi

          case "$FULL_REMOTE_PATH" in
            *..* | /*)
              echo "Error: Invalid FULL_REMOTE_PATH ($FULL_REMOTE_PATH)"
              exit 1
              ;;
          esac

          echo "remote_path=$FULL_REMOTE_PATH" >> "$GITHUB_OUTPUT"
          echo "Target path for deletion: $FULL_REMOTE_PATH"

      - name: Delete preview folder via SFTP (lftp)
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          PASS: ${{ secrets.IONOS_SFTP_PASS }}
          REMOTE_PATH: ${{ steps.prepare_path.outputs.remote_path }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp

          # set cmd:fail-exit no ensures the step succeeds even if the folder was already deleted
          lftp -u "$USER","$PASS" sftp://$HOST <<EOF
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no"
          set cmd:fail-exit no
          rm -rf "$REMOTE_PATH"
          bye
          EOF

      - name: Remove active preview comment from PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const commentMarker = "<!-- beta-preview-comment -->";

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });

            for (const comment of comments) {
              const isBot = comment.user && comment.user.type === 'Bot';
              const hasMarker = comment.body && (
                comment.body.includes(commentMarker) ||
                comment.body.includes('Beta deployment successful!')
              );
              if (isBot && hasMarker) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id
                });
              }
            }