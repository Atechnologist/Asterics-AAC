<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Webgazer.js + D3.js collision demo</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
    </style>
</head>
<body>
  <!-- D3.js v3 required for the collision layout -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
  <!-- LocalForage for WebGazer session data storage -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.8.1/localforage.js"></script>
  <!-- WebGazer script -->
  <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
  <!-- Your collision script -->
  <script src="collision.js"></script>
</body>
</html>
