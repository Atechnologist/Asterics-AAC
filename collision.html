<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Mode Gaze Engine with Self-Learning ML Calibration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0a; font-family: 'Inter', system-ui, sans-serif; color: #fff; user-select: none; }
        
        /* Layout Header & Nav */
        #top-bar {
            position: fixed; top: 0; left: 0; width: 100vw; height: 75px;
            background: rgba(15, 15, 15, 0.95); border-bottom: 2px solid #00ffcc;
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            z-index: 10000; box-sizing: border-box;
        }
        #output-bar {
            flex-grow: 1; height: 45px; background: rgba(5, 5, 5, 0.9);
            border: 2px solid #00ffcc; border-radius: 6px; color: #00ffcc;
            font-size: 20px; display: flex; align-items: center; padding: 0 15px;
            margin-right: 20px; overflow: hidden; white-space: nowrap; font-family: monospace;
        }
        .control-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .mode-btn {
            background: #1e1e1e; color: #00ffcc; border: 1px solid #00ffcc; padding: 6px 10px;
            border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s; font-size: 12px;
        }
        .mode-btn.active { background: #00ffcc; color: #000; box-shadow: 0 0 12px rgba(0,255,204,0.5); }
        .action-btn {
            background: #222; color: #fff; border: 1px solid #555; padding: 6px 10px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; transition: all 0.2s;
        }
        .action-btn:hover { background: #333; }
        .action-btn.danger { border-color: #ff4444; color: #ff4444; }
        .action-btn.primary { border-color: #00ffcc; color: #00ffcc; }
        .action-btn.ml { border-color: #ff00ff; color: #ff00ff; }
        .action-btn.ml:hover { background: rgba(255,0,255,0.2); }

        /* Secondary Toolbar */
        #sub-bar {
            position: fixed; top: 75px; left: 0; width: 100vw; height: 45px;
            background: rgba(25, 25, 25, 0.9); border-bottom: 1px solid #333;
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            z-index: 9999; font-size: 13px; color: #aaa; box-sizing: border-box;
        }
        .slider-container { display: flex; align-items: center; gap: 8px; }
        input[type=range] { accent-color: #00ffcc; cursor: pointer; }

        /* Calibration Overlay Modal */
        #calibration-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 10, 10, 0.9); z-index: 30000;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 100px; text-align: center; pointer-events: none; display: none;
        }
        #calib-dot {
            width: 55px; height: 55px; background: #ff0055; border-radius: 50%;
            position: absolute; transform: translate(-50%, -50%); cursor: pointer;
            box-shadow: 0 0 35px #ff0055; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; color: #fff; border: 3px solid #fff;
            pointer-events: auto; z-index: 35000; transition: transform 0.1s;
        }
        #calib-dot:active { transform: translate(-50%, -50%) scale(0.9); }

        /* Decremental Iris Shutter Ring */
        #iris-shutter {
            position: absolute; border: 3px dashed #ff0055; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
            box-shadow: 0 0 25px rgba(255,0,85,0.4); background: rgba(255,0,85,0.05);
            z-index: 15000; display: none; transition: width 0.3s ease-out, height 0.3s ease-out;
        }

        .key-box { rx: 8; transition: fill 0.15s, stroke 0.15s; }
        .letter-circle { stroke: #00ffcc; stroke-width: 2px; fill: #1e1e1e; transition: fill 0.15s, stroke 0.15s; }
        .letter-node { font-weight: bold; cursor: pointer; user-select: none; }
        
        #virtual-cursor {
            position: absolute; width: 20px; height: 20px; border: 2px solid #00ffcc;
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
            box-shadow: 0 0 10px #00ffcc; z-index: 20000; display: none;
        }

        /* Raw vs Corrected Cursor Indicators */
        #raw-cursor {
            position: absolute; width: 14px; height: 14px; border: 2px solid #ff0055;
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
            z-index: 19999; display: none; opacity: 0.75;
        }

        /* ML Training Status Glow Header */
        .training-active {
            animation: pulse-border 1.5s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: #ff00ff; box-shadow: 0 0 10px rgba(255,0,255,0.5); }
            50% { border-color: #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.8); }
            100% { border-color: #ff00ff; box-shadow: 0 0 10px rgba(255,0,255,0.5); }
        }
    </style>
</head>
<body>

  <!-- Cursor Reticles -->
  <div id="virtual-cursor"></div>
  <div id="raw-cursor"></div>
  <div id="iris-shutter"></div>

  <!-- Top Navigation & Controls Bar -->
  <div id="top-bar">
      <div id="output-bar">Type here...</div>
      <div class="control-group">
          <button class="mode-btn active" onclick="switchMode('magnetic')">Magnetic</button>
          <button class="mode-btn" onclick="switchMode('iris')">Iris Zoom</button>
          <button class="mode-btn" onclick="switchMode('swipe')">Swipe</button>
          <button class="mode-btn" onclick="switchMode('floating')">Floating</button>
      </div>
      <div class="control-group" style="margin-left: 10px;">
          <button class="action-btn ml" onclick="start9ZoneTraining()">🎯 9-Zone Grid</button>
          <button class="action-btn ml" onclick="startPerKeySweep()">⌨️ Per-Key Sweep</button>
          <button class="action-btn primary" onclick="speakText()">🔊 Speak</button>
          <button class="action-btn danger" onclick="clearText()">Delete</button>
      </div>
  </div>

  <!-- Secondary Bar for Tuning Sliders & ML Indicators -->
  <div id="sub-bar">
      <span style="color: #00ffcc;" id="status-msg">🌀 System Ready. Select Mode or Run ML Training.</span>
      <div style="display: flex; gap: 15px; align-items: center;">
          <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; color: #ff00ff;">
              <input type="checkbox" id="vector-toggle" onchange="toggleVectorViz(this.checked)" checked>
              Show Offset Vectors
          </label>
          <div class="slider-container">
              <label>Dwell: <span id="dwell-val">1.2</span>s</label>
              <input type="range" id="dwell-slider" min="0.4" max="3.0" step="0.1" value="1.2" oninput="updateDwell(this.value)">
          </div>
          <div class="slider-container">
              <label>Smooth: <span id="smooth-val">0.5</span></label>
              <input type="range" id="smooth-slider" min="0.1" max="0.9" step="0.05" value="0.5" oninput="updateSmooth(this.value)">
          </div>
          <button class="action-btn danger" style="padding: 2px 6px; font-size: 11px;" onclick="resetMLData()">Reset Weights</button>
      </div>
  </div>

  <!-- Calibration / Training Overlay Modal -->
  <div id="calibration-overlay">
      <h2 id="calib-title" style="color: #00ffcc; font-size: 22px; font-weight: bold; margin-bottom: 6px;">Supervised ML Training Mode</h2>
      <p id="calib-text" style="color: #bbb; max-width: 500px; line-height: 1.4; margin-bottom: 20px; font-size: 14px;">
          Stare directly at the glowing dot and click it to record true optical offsets.
      </p>
      <div id="calib-dot">1</div>
  </div>

  <!-- Core Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.8.1/localforage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/webgazer@3.3.0/dist/webgazer.js"></script>

  <script>
    // Polyfill canvas contexts for WebGazer performance
    const originalGetContext = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function(type, attributes) {
        if (type === '2d') {
            attributes = attributes || {};
            attributes.willReadFrequently = true;
        }
        return originalGetContext.call(this, type, attributes);
    };

    window.saveDataAcrossSessions = true;
    var force, nodes = [];
    var smoothedGazeX = null, smoothedGazeY = null;
    var rawGazeX = 0, rawGazeY = 0;
    let smoothingFactor = 0.5;
    let currentMode = "magnetic"; 

    // Calibration & ML State Management
    let isCalibrating = false;
    let trainingType = null; // '9zone' or 'perkey'
    let calibStep = 0;
    let calibClicks = 0;
    let keySweepIndex = 0;
    let showVectorViz = true;

    // ML Data Models
    // 1) 9-Zone Anchor Grid offsets (bilinear spatial warping matrix)
    let zoneMatrix = [
        { id: 0, xRatio: 0.15, yRatio: 0.25, dx: 0, dy: 0, samples: 0 }, // Top-Left
        { id: 1, xRatio: 0.50, yRatio: 0.25, dx: 0, dy: 0, samples: 0 }, // Top-Center
        { id: 2, xRatio: 0.85, yRatio: 0.25, dx: 0, dy: 0, samples: 0 }, // Top-Right
        { id: 3, xRatio: 0.15, yRatio: 0.55, dx: 0, dy: 0, samples: 0 }, // Mid-Left
        { id: 4, xRatio: 0.50, yRatio: 0.55, dx: 0, dy: 0, samples: 0 }, // Center
        { id: 5, xRatio: 0.85, yRatio: 0.55, dx: 0, dy: 0, samples: 0 }, // Mid-Right
        { id: 6, xRatio: 0.15, yRatio: 0.85, dx: 0, dy: 0, samples: 0 }, // Bottom-Left
        { id: 7, xRatio: 0.50, yRatio: 0.85, dx: 0, dy: 0, samples: 0 }, // Bottom-Center
        { id: 8, xRatio: 0.85, yRatio: 0.85, dx: 0, dy: 0, samples: 0 }  // Bottom-Right
    ];

    // 2) Per-Key Ground-Truth Offset Vectors Map
    let perKeyOffsetMap = {}; // { 'A': { dx, dy, count }, ... }

    let currentCollidingKey = null;
    let dwellTimer = null;
    let DWELL_TIME_MS = 1200; 
    let svg, keyGroups, swipePolyline;
    let homeBaseTimer = null;

    // Iris Shutter Parameters
    let irisRadius = 260; 
    let irisTargetKey = null;
    let irisStartTime = null;

    // Load persisted ML model parameters on boot
    async function loadPersistedMLModels() {
        try {
            const savedZone = await localforage.getItem('gaze_9zone_matrix');
            if (savedZone) zoneMatrix = savedZone;

            const savedPerKey = await localforage.getItem('gaze_perkey_map');
            if (savedPerKey) perKeyOffsetMap = savedPerKey;

            updateStatusMsg("✨ Persisted ML Accuracy Models Loaded Successfully.");
        } catch(e) {
            console.warn("Could not load persisted gaze ML matrices", e);
        }
    }

    async function persistMLModels() {
        try {
            await localforage.setItem('gaze_9zone_matrix', zoneMatrix);
            await localforage.setItem('gaze_perkey_map', perKeyOffsetMap);
        } catch(e) {
            console.error("Error saving ML models", e);
        }
    }

    async function resetMLData() {
        zoneMatrix.forEach(z => { z.dx = 0; z.dy = 0; z.samples = 0; });
        perKeyOffsetMap = {};
        await localforage.removeItem('gaze_9zone_matrix');
        await localforage.removeItem('gaze_perkey_map');
        updateStatusMsg("🧹 ML Models and Weights Reset to Zero.");
    }

    // Bilinear Spatial Interpolation Engine for 9-Zone Grid Warping
    function computeBilinearOffset(gx, gy) {
        let w = window.innerWidth;
        let h = window.innerHeight;
        let normX = Math.max(0, Math.min(1, gx / w));
        let normY = Math.max(0, Math.min(1, gy / h));

        // Find surrounding 4 grid points
        let cols = [0.15, 0.50, 0.85];
        let rows = [0.25, 0.55, 0.85];

        let colIdx = normX < cols[1] ? 0 : 1;
        let rowIdx = normY < rows[1] ? 0 : 1;

        let zTL = zoneMatrix[rowIdx * 3 + colIdx];
        let zTR = zoneMatrix[rowIdx * 3 + (colIdx + 1)];
        let zBL = zoneMatrix[(rowIdx + 1) * 3 + colIdx];
        let zBR = zoneMatrix[(rowIdx + 1) * 3 + (colIdx + 1)];

        let u = (normX - cols[colIdx]) / (cols[colIdx + 1] - cols[colIdx]);
        let v = (normY - rows[rowIdx]) / (rows[rowIdx + 1] - rows[rowIdx]);
        u = Math.max(0, Math.min(1, u));
        v = Math.max(0, Math.min(1, v));

        // Interpolate dx and dy offset vectors
        let dx = (1 - u) * (1 - v) * zTL.dx + u * (1 - v) * zTR.dx + (1 - u) * v * zBL.dx + u * v * zBR.dx;
        let dy = (1 - u) * (1 - v) * zTL.dy + u * (1 - v) * zTR.dy + (1 - u) * v * zBL.dy + u * v * zBR.dy;

        return { dx, dy };
    }

    // Combined ML Spatial Correction Pipeline
    function applyMLGazeCorrections(rawX, rawY, closestChar) {
        let finalX = rawX;
        let finalY = rawY;

        // 1. Apply Bilinear 9-Zone Grid Correction
        let gridCorrection = computeBilinearOffset(rawX, rawY);
        finalX += gridCorrection.dx;
        finalY += gridCorrection.dy;

        // 2. Apply Specific Per-Key Error Vector Correction if key learned
        if (closestChar && perKeyOffsetMap[closestChar]) {
            let keyML = perKeyOffsetMap[closestChar];
            finalX += keyML.dx * 0.65; // Blend weight
            finalY += keyML.dy * 0.65;
        }

        return { x: finalX, y: finalY };
    }

    window.onload = async function() {
        await loadPersistedMLModels();
        setupEngine();

        const webgazerInstance = await webgazer.setRegression('ridge')
            .setTracker('TFFacemesh')
            .begin();
        
        webgazerInstance.showVideoPreview(true)
            .showPredictionPoints(false)
            .applyKalmanFilter(true);

        webgazer.setGazeListener(gazeTickListener);
    };

    function setupEngine() {
        var width = window.innerWidth;
        var height = window.innerHeight;
        nodes = [];

        if (currentMode === "floating") {
            var letters = ["Q", "W", "E", "R", "T", "Z", "U", "I", "O", "P", "A", "S", "D", "F", "G", "H", "J", "K", "L", "Y", "X", "C", "V", "B", "N", "M", "⌫", "SP"];
            nodes = letters.map(function(char) {
                return {
                    char: char, radius: 30, x0: width * 0.5, y0: height * 0.5,
                    x: width * 0.25 + Math.random() * (width * 0.5),
                    y: height * 0.3 + Math.random() * (height * 0.5),
                    vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2
                };
            });
        } else {
            var rows = [
                ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
                ["A", "S", "D", "F", "G", "H", "J", "K", "L"],
                ["Z", "X", "C", "V", "B", "N", "M", "⌫", "SP"]
            ];
            let startY = height * 0.45;
            rows.forEach((row, rowIndex) => {
                let startX = (width - (row.length * 75)) / 2;
                row.forEach((char, colIndex) => {
                    let kx = startX + (colIndex * 75) + 35;
                    let ky = startY + (rowIndex * 80);
                    nodes.push({ char: char, radius: 30, x0: kx, y0: ky, x: kx, y: ky, vx: 0, vy: 0 });
                });
            });
        }

        nodes.unshift({ radius: 0, fixed: true, x: width/2, y: height/2 });

        force = d3.layout.force()
            .gravity(currentMode === "floating" ? 0.06 : 0)
            .charge(function(d, i) { return i ? (currentMode === "floating" ? -30 : 0) : -1500; })
            .nodes(nodes)
            .size([width, height])
            .start();

        if (svg) svg.remove();

        svg = d3.select("body").append("svg")
            .attr("width", width).attr("height", height)
            .style("position", "absolute").style("top", "0").style("left", "0").style("z-index", "10");

        keyGroups = svg.selectAll(".key-group").data(nodes.slice(1)).enter().append("g").attr("class", "key-group");

        if (currentMode === "floating") {
            keyGroups.append("circle").attr("class", "letter-circle").attr("r", function(d) { return d.radius; });
            keyGroups.append("text").attr("class", "letter-node").attr("dy", ".35em").attr("text-anchor", "middle").attr("font-size", "22px").attr("fill", "#00ffcc").text(function(d) { return d.char; });
        } else {
            keyGroups.append("rect").attr("class", "key-box").attr("width", 64).attr("height", 64).attr("x", function(d) { return d.x0 - 32; }).attr("y", function(d) { return d.y0 - 32; }).attr("rx", 8).attr("fill", "#1e1e1e").attr("stroke", "#00ffcc").attr("stroke-width", 2);
            keyGroups.append("text").attr("class", "key-node").attr("x", function(d) { return d.x0; }).attr("y", function(d) { return d.y0; }).attr("dy", ".35em").attr("text-anchor", "middle").attr("font-size", "22px").attr("fill", "#00ffcc").text(function(d) { return d.char; });
        }

        swipePolyline = svg.append("polyline").attr("fill", "none").attr("stroke", "#ff0055").attr("stroke-width", 4).attr("stroke-linecap", "round").style("opacity", 0);

        // Vector Viz Line between raw gaze and corrected gaze
        svg.append("line").attr("id", "ml-vector-line").attr("stroke-width", 3).attr("stroke", "#ff00ff").attr("stroke-dasharray", "4,4");

        svg.append("line").attr("id", "eyeline1").attr("stroke-width", 2).attr("stroke", "rgba(255,0,85,0.7)");
        svg.append("line").attr("id", "eyeline2").attr("stroke-width", 2).attr("stroke", "rgba(255,0,85,0.7)");

        force.on("tick", function(e) {
            var q = d3.geom.quadtree(nodes), i = 0, n = nodes.length;
            while (++i < n) q.visit(collide(nodes[i]));

            let eyeNode = nodes[0];
            let closestKey = null;
            let minDistance = 9999;
            let snapRadius = currentMode === "iris" ? 160 : 65;

            for (let j = 1; j < nodes.length; j++) {
                let d = nodes[j];
                let targetX = currentMode === "floating" ? d.x : d.x0;
                let targetY = currentMode === "floating" ? d.y : d.y0;

                let dx = eyeNode.x - targetX;
                let dy = eyeNode.y - targetY;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < snapRadius && dist < minDistance) {
                    minDistance = dist;
                    closestKey = d;
                }

                if (currentMode === "floating") {
                    if (dist < 180 && d.char === currentCollidingKey) {
                        d.x += dx * 0.1; d.y += dy * 0.1;
                    }
                    if (d.x < 50) { d.x = 50; d.vx *= -1; }
                    if (d.x > width - 50) { d.x = width - 50; d.vx *= -1; }
                    if (d.y < 120) { d.y = 120; d.vy *= -1; }
                    if (d.y > height - 50) { d.y = height - 50; d.vy *= -1; }
                } else {
                    let pull = currentMode === "magnetic" ? 0.25 : 0.15;
                    d.x += (d.x0 - d.x) * pull;
                    d.y += (d.y0 - d.y) * pull;
                }
            }

            // Iris Shutter Decremental Shrinking Logic
            let iris = document.getElementById("iris-shutter");
            if (currentMode === "iris") {
                iris.style.display = isCalibrating ? "none" : "block";
                iris.style.left = eyeNode.x + "px";
                iris.style.top = eyeNode.y + "px";

                if (closestKey) {
                    if (irisTargetKey !== closestKey) {
                        irisTargetKey = closestKey;
                        irisStartTime = performance.now();
                    }

                    let elapsed = performance.now() - irisStartTime;
                    let progress = Math.min(elapsed / DWELL_TIME_MS, 1.0);
                    irisRadius = 240 - (195 * progress);

                    let tx = currentMode === "floating" ? closestKey.x : closestKey.x0;
                    let ty = currentMode === "floating" ? closestKey.y : closestKey.y0;
                    eyeNode.x += (tx - eyeNode.x) * 0.1;
                    eyeNode.y += (ty - eyeNode.y) * 0.1;

                    handleInteractions(eyeNode.x, eyeNode.y, closestKey);
                } else {
                    irisTargetKey = null;
                    irisStartTime = null;
                    irisRadius = 260;
                }
                iris.style.width = (irisRadius * 2) + "px";
                iris.style.height = (irisRadius * 2) + "px";
            } else {
                iris.style.display = "none";
            }

            if (closestKey && currentMode !== "iris" && !isCalibrating) {
                let tx = currentMode === "floating" ? closestKey.x : closestKey.x0;
                let ty = currentMode === "floating" ? closestKey.y : closestKey.y0;
                eyeNode.x += (tx - eyeNode.x) * 0.2; 
                eyeNode.y += (ty - eyeNode.y) * 0.2;
                handleInteractions(eyeNode.x, eyeNode.y, closestKey);
            }

            // Update Cursors and Vector Visualization
            let vCursor = document.getElementById("virtual-cursor");
            let rCursor = document.getElementById("raw-cursor");

            vCursor.style.left = eyeNode.x + "px";
            vCursor.style.top = eyeNode.y + "px";
            vCursor.style.display = isCalibrating ? "none" : "block";

            rCursor.style.left = rawGazeX + "px";
            rCursor.style.top = rawGazeY + "px";
            rCursor.style.display = (isCalibrating || !showVectorViz) ? "none" : "block";

            if (showVectorViz && !isCalibrating) {
                d3.select('#ml-vector-line')
                    .attr("x1", rawGazeX).attr("y1", rawGazeY)
                    .attr("x2", eyeNode.x).attr("y2", eyeNode.y)
                    .style("opacity", 1);
            } else {
                d3.select('#ml-vector-line').style("opacity", 0);
            }

            if (currentMode === "floating") {
                keyGroups.attr("transform", function(d) { return "translate(" + d.x + "," + d.y + ")"; });
            } else {
                keyGroups.select("rect").attr("x", function(d) { return d.x - 32; }).attr("y", function(d) { return d.y - 32; });
                keyGroups.select("text").attr("x", function(d) { return d.x; }).attr("y", function(d) { return d.y; });
            }
        });

        svg.on("mousemove", function() {
            if (isCalibrating) return;
            var p1 = d3.mouse(this);
            rawGazeX = p1[0];
            rawGazeY = p1[1];
            
            let corrected = applyMLGazeCorrections(rawGazeX, rawGazeY, currentCollidingKey);
            nodes[0].x = nodes[0].px = corrected.x;
            nodes[0].y = nodes[0].py = corrected.y;
            force.resume();
        });
    }

    function switchMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        swipePolyline.style("opacity", mode === "swipe" ? 1 : 0);
        setupEngine();
        force.resume();
    }

    // ------------------- ML SUPERVISED TRAINING MODES ------------------- //

    // Mode 1: Fast 9-Zone Bounding Grid Calibration Pass
    function start9ZoneTraining() {
        trainingType = '9zone';
        isCalibrating = true;
        calibStep = 0;
        calibClicks = 0;
        document.getElementById("calibration-overlay").style.display = "flex";
        document.getElementById("top-bar").classList.add("training-active");
        document.getElementById("calib-title").innerText = "🎯 9-Zone Grid ML Training";
        update9ZoneTarget();
    }

    function update9ZoneTarget() {
        if (calibStep >= zoneMatrix.length) {
            finishMLTraining();
            return;
        }
        let targetZone = zoneMatrix[calibStep];
        let targetX = window.innerWidth * targetZone.xRatio;
        let targetY = window.innerHeight * targetZone.yRatio;

        let dot = document.getElementById("calib-dot");
        dot.style.left = targetX + "px";
        dot.style.top = targetY + "px";
        dot.innerText = calibStep + 1;

        document.getElementById("calib-text").innerHTML = 
            `Calibrating Anchor Zone <strong>${calibStep + 1} of 9</strong>.<br>Look directly at the red dot and click it <strong>3 times</strong> (${calibClicks}/3).`;
        window.currentCalibrationTargetCoords = { x: targetX, y: targetY, zoneIndex: calibStep };
    }

    // Mode 2: Full Per-Key Sweep Calibration Pass
    function startPerKeySweep() {
        trainingType = 'perkey';
        isCalibrating = true;
        keySweepIndex = 0;
        calibClicks = 0;
        document.getElementById("calibration-overlay").style.display = "flex";
        document.getElementById("top-bar").classList.add("training-active");
        document.getElementById("calib-title").innerText = "⌨️ Full Per-Key Sweep ML Training";
        updatePerKeyTarget();
    }

    function updatePerKeyTarget() {
        let keyNodes = nodes.slice(1);
        if (keySweepIndex >= keyNodes.length) {
            finishMLTraining();
            return;
        }
        let keyData = keyNodes[keySweepIndex];
        let targetX = currentMode === "floating" ? keyData.x : keyData.x0;
        let targetY = currentMode === "floating" ? keyData.y : keyData.y0;

        let dot = document.getElementById("calib-dot");
        dot.style.left = targetX + "px";
        dot.style.top = targetY + "px";
        dot.innerText = keyData.char;

        // Highlight key on background canvas
        keyGroups.select("rect").attr("fill", "#1e1e1e");
        keyGroups.filter(d => d.char === keyData.char).select("rect").attr("fill", "#ff00ff");

        document.getElementById("calib-text").innerHTML = 
            `Target Key: <strong style="color:#00ffcc; font-size: 18px;">[ ${keyData.char} ]</strong> (${keySweepIndex + 1}/${keyNodes.length})<br>Stare at the glowing key dot and click it to train its offset vector (${calibClicks}/2).`;
        window.currentCalibrationTargetCoords = { x: targetX, y: targetY, keyChar: keyData.char };
    }

    // Unified Ground-Truth Click Handler
    document.getElementById("calib-dot").addEventListener("click", function() {
        if (!isCalibrating) return;
        let coords = window.currentCalibrationTargetCoords;

        // Sample WebGazer prediction ground truth
        webgazer.recordScreenPosition(coords.x, coords.y, 'click');

        if (trainingType === '9zone') {
            let zone = zoneMatrix[coords.zoneIndex];
            // Calculate spatial error vector (ground truth minus raw gaze)
            let errorX = coords.x - rawGazeX;
            let errorY = coords.y - rawGazeY;

            // Running average update of offset vectors
            zone.dx = (zone.dx * zone.samples + errorX) / (zone.samples + 1);
            zone.dy = (zone.dy * zone.samples + errorY) / (zone.samples + 1);
            zone.samples++;

            calibClicks++;
            if (calibClicks >= 3) { calibClicks = 0; calibStep++; }
            update9ZoneTarget();

        } else if (trainingType === 'perkey') {
            let char = coords.keyChar;
            let errorX = coords.x - rawGazeX;
            let errorY = coords.y - rawGazeY;

            if (!perKeyOffsetMap[char]) {
                perKeyOffsetMap[char] = { dx: errorX, dy: errorY, count: 1 };
            } else {
                let existing = perKeyOffsetMap[char];
                existing.dx = (existing.dx * existing.count + errorX) / (existing.count + 1);
                existing.dy = (existing.dy * existing.count + errorY) / (existing.count + 1);
                existing.count++;
            }

            calibClicks++;
            if (calibClicks >= 2) { calibClicks = 0; keySweepIndex++; }
            updatePerKeyTarget();
        }
    });

    async function finishMLTraining() {
        isCalibrating = false;
        document.getElementById("calibration-overlay").style.display = "none";
        document.getElementById("top-bar").classList.remove("training-active");
        keyGroups.select("rect").attr("fill", "#1e1e1e");
        await persistMLModels();
        updateStatusMsg("✅ ML Training Complete! Spatial offset matrices saved to LocalForage.");
    }

    function collide(node) {
        var r = node.radius + 15, nx1 = node.x - r, nx2 = node.x + r, ny1 = node.y - r, ny2 = node.y + r;
        return function(quad, x1, y1, x2, y2) {
            if (quad.point && (quad.point !== node)) {
                var x = node.x - quad.point.x, y = node.y - quad.point.y, l = Math.sqrt(x * x + y * y), r = node.radius + quad.point.radius;
                if (l < r) {
                    l = (l - r) / l * .5;
                    node.x -= x *= l; node.y -= y *= l;
                    quad.point.x += x; quad.point.y += y;
                }
            }
            return x1 > nx2 || x2 < nx1 || y1 > ny2 || y2 < ny1;
        };
    }

    function handleInteractions(gazeX, gazeY, keyNode) {
        if (isCalibrating) return;

        if (gazeX < 320 && gazeY < 300) {
            if (!homeBaseTimer) {
                homeBaseTimer = setTimeout(() => { start9ZoneTraining(); homeBaseTimer = null; }, 2500);
            }
            return;
        } else {
            clearTimeout(homeBaseTimer);
            homeBaseTimer = null;
        }

        if (keyNode) {
            if (currentCollidingKey !== keyNode.char) {
                currentCollidingKey = keyNode.char;
                clearTimeout(dwellTimer);

                if (currentMode === "floating") {
                    keyGroups.select("circle").attr("fill", "#1e1e1e").attr("stroke", "#00ffcc");
                    keyGroups.select("text").attr("fill", "#00ffcc");
                    let activeGroup = keyGroups.filter(d => d.char === currentCollidingKey);
                    activeGroup.select("circle").attr("fill", "#00ffcc").attr("stroke", "#ff0055");
                    activeGroup.select("text").attr("fill", "#000");
                } else {
                    keyGroups.select("rect").attr("fill", "#1e1e1e");
                    keyGroups.filter(d => d.char === currentCollidingKey).select("rect").attr("fill", "#00ffcc");
                }

                dwellTimer = setTimeout(() => {
                    appendCharacter(currentCollidingKey);
                    
                    if (currentMode === "floating") {
                        keyGroups.select("circle").attr("fill", "#1e1e1e").attr("stroke", "#00ffcc");
                        keyGroups.select("text").attr("fill", "#00ffcc");
                    } else {
                        keyGroups.select("rect").attr("fill", "#1e1e1e");
                    }
                    currentCollidingKey = null;
                    irisTargetKey = null;
                    irisStartTime = null;
                }, DWELL_TIME_MS);
            }
        }
    }

    function appendCharacter(char) {
        const outputBar = document.getElementById("output-bar");
        let txt = outputBar.innerText === "Type here..." ? "" : outputBar.innerText;
        if (char === "⌫") txt = txt.slice(0, -1);
        else if (char === "SP") txt += " ";
        else txt += char;
        outputBar.innerText = txt || "Type here...";
    }

    function clearText() {
        const outputBar = document.getElementById("output-bar");
        let txt = outputBar.innerText;
        outputBar.innerText = txt.length > 1 ? txt.slice(0, -1) : "Type here...";
    }

    function speakText() {
        const text = document.getElementById("output-bar").innerText;
        if (text && text !== "Type here...") {
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }
    }

    function updateDwell(val) {
        DWELL_TIME_MS = parseFloat(val) * 1000;
        document.getElementById("dwell-val").innerText = val;
    }

    function updateSmooth(val) {
        smoothingFactor = parseFloat(val);
        document.getElementById("smooth-val").innerText = val;
    }

    function toggleVectorViz(enabled) {
        showVectorViz = enabled;
    }

    function updateStatusMsg(msg) {
        document.getElementById("status-msg").innerText = msg;
    }

    var gazeTickListener = async function(data, clock) {
        if (!data) return;

        rawGazeX = data.x;
        rawGazeY = data.y;

        if (smoothedGazeX === null || smoothedGazeY === null) {
            smoothedGazeX = rawGazeX;
            smoothedGazeY = rawGazeY;
        } else {
            smoothedGazeX += (rawGazeX - smoothedGazeX) * smoothingFactor;
            smoothedGazeY += (rawGazeY - smoothedGazeY) * smoothingFactor;
        }

        let corrected = applyMLGazeCorrections(smoothedGazeX, smoothedGazeY, currentCollidingKey);

        nodes[0].x = nodes[0].px = corrected.x;
        nodes[0].y = nodes[0].py = corrected.y;
        force.resume();

        var tracker = webgazer.getTracker();
        var fmPositions = tracker && tracker.getPositions ? await tracker.getPositions() : null;
        var previewWidth = webgazer.params.videoViewerWidth || 320;
        var whr = webgazer.getVideoPreviewToCameraResolutionRatio() || [1, 1];

        if (fmPositions && fmPositions[145] && fmPositions[374]) {
            d3.select('#eyeline1').attr("x1", corrected.x).attr("y1", corrected.y).attr("x2", previewWidth - fmPositions[145][0] * whr[0]).attr("y2", fmPositions[145][1] * whr[1]);
            d3.select("#eyeline2").attr("x1", corrected.x).attr("y1", corrected.y).attr("x2", previewWidth - fmPositions[374][0] * whr[0]).attr("y2", fmPositions[374][1] * whr[1]);
        }
    };
  </script>
