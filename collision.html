<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grouped Gaze Keyboard</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: rgba(15,15,15,0.95);
      --cyan: #00ffcc;
      --magenta: #ff0055;
      --text: #ffffff;
    }

    html, body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      user-select: none;
    }

    #top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 75px;
      background: var(--panel);
      border-bottom: 2px solid var(--cyan);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      box-sizing: border-box;
      z-index: 10000;
    }

    #output-bar {
      flex: 1;
      height: 45px;
      background: rgba(5,5,5,0.9);
      border: 2px solid var(--cyan);
      border-radius: 6px;
      color: var(--cyan);
      font-size: 20px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      margin-right: 15px;
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .action-btn {
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      border: 1px solid var(--cyan);
      background: #1e1e1e;
      color: var(--cyan);
      padding: 6px 10px;
    }

    .action-btn.primary { color: var(--cyan); }
    .action-btn.danger {
      border-color: #ff4444;
      color: #ff4444;
    }

    #sub-bar {
      position: fixed;
      top: 75px; left: 0; right: 0;
      height: 45px;
      background: rgba(25,25,25,0.9);
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 9999;
      font-size: 13px;
      color: #aaa;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type=range] { accent-color: var(--cyan); cursor: pointer; }

    #raw-gaze-dot {
      position: absolute;
      width: 12px;
      height: 12px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 15000;
      pointer-events: none;
      display: none;
    }

    #virtual-cursor {
      position: absolute;
      width: 18px; height: 18px;
      border: 2px solid var(--cyan);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 10px rgba(0,255,204,0.9);
      z-index: 20000;
      display: none;
    }

    #keyboard-layer {
      position: absolute;
      left: 50%;
      top: 58%;
      transform: translate(-50%, -50%);
      width: min(90vw, 1000px);
      display: flex;
      flex-direction: column;
      gap: 18px;
      z-index: 150;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 18px;
    }

    .group-key, .letter-key {
      border: 3px solid var(--cyan);
      background: rgba(15,15,15,0.9);
      color: var(--cyan);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 0 12px rgba(0,255,204,0.18);
    }

    .group-key {
      min-width: 170px;
      height: 90px;
      font-size: 26px;
    }

    .letter-key {
      width: 110px;
      height: 110px;
      font-size: 30px;
    }

    .group-key.active, .letter-key.active {
      background: var(--cyan);
      color: #000;
      box-shadow: 0 0 18px rgba(0,255,204,0.7);
    }

    #calibration-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10,10,10,0.92);
      z-index: 30000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 100px;
      text-align: center;
      pointer-events: none;
    }

    #calib-dot {
      position: absolute;
      width: 52px; height: 52px;
      background: var(--magenta);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      box-shadow: 0 0 35px rgba(255,0,85,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: #fff;
      border: 3px solid #fff;
      pointer-events: auto;
      z-index: 35000;
    }
  </style>
</head>
<body>

  <div id="raw-gaze-dot"></div>
  <div id="virtual-cursor"></div>

  <div id="top-bar">
    <div id="output-bar">Type here...</div>

    <div class="control-group">
      <button class="action-btn primary" onclick="startCalibration('9zone')">🎯 9-Zone Grid</button>
      <button class="action-btn primary" onclick="startCalibration('perkey')">⌨️ Per-Key Sweep</button>
      <button class="action-btn danger" onclick="clearText()">Delete</button>
    </div>
  </div>

  <div id="sub-bar">
    <span style="color: #ff0055;" id="status-msg">🎓 Grouped gaze keyboard active</span>
    <div style="display: flex; gap: 20px;">
      <div class="slider-container">
        <label>Dwell: <span id="dwell-val">2.2</span>s</label>
        <input type="range" id="dwell-slider" min="0.5" max="3.0" step="0.1" value="2.2" oninput="updateDwell(this.value)">
      </div>
      <div class="slider-container">
        <label>Smooth: <span id="smooth-val">0.2</span></label>
        <input type="range" id="smooth-slider" min="0.1" max="0.9" step="0.05" value="0.2" oninput="updateSmooth(this.value)">
      </div>
    </div>
  </div>

  <div id="keyboard-layer">
    <div class="row" id="group-row-1"></div>
    <div class="row" id="group-row-2"></div>
  </div>

  <div id="calibration-overlay">
    <h2 style="color: #00ffcc; margin-bottom: 10px;" id="calib-title">Gaze Calibration Required</h2>
    <p id="calib-text" style="color: #bbb; max-width: 500px; line-height: 1.5; margin-bottom: 25px;">
      Stare directly at the glowing circle and click it <strong>3 times</strong> with your mouse.
    </p>
    <div id="calib-dot">1</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.8.1/localforage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/webgazer@3.3.0/dist/webgazer.js"></script>

  <script>
    const GROUPS = [
      { label: "QWERTY", keys: ["Q","W","E","R","T","Y"] },
      { label: "ASDFGH", keys: ["A","S","D","F","G","H"] },
      { label: "ZXCVBN", keys: ["Z","X","C","V","B","N"] },
      { label: "IOPLM", keys: ["I","O","P","L","M"] },
      { label: "SPACE", keys: ["SP"] },
      { label: "DEL", keys: ["⌫"] }
    ];

    let saccadeFreezeTimer = null;
    let isSaccadeLocked = false;

    let phase = "group";
    let selectedGroup = null;
    let selectedKey = null;

    let rawGazeX = null;
    let rawGazeY = null;
    let smoothedGazeX = null;
    let smoothedGazeY = null;
    let correctedGaze = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

    let isCalibrating = true;
    let calibModeType = "9zone";
    let calibStep = 0;
    let calibClicks = 0;
    let calibSequence = [];

    const zone9Sequence = [
      { name: "Top-Left", x: 0.1, y: 0.2 },
      { name: "Top-Center", x: 0.5, y: 0.2 },
      { name: "Top-Right", x: 0.9, y: 0.2 },
      { name: "Mid-Left", x: 0.1, y: 0.5 },
      { name: "Center Screen", x: 0.5, y: 0.5 },
      { name: "Mid-Right", x: 0.9, y: 0.5 },
      { name: "Bottom-Left", x: 0.1, y: 0.8 },
      { name: "Bottom-Center", x: 0.5, y: 0.8 },
      { name: "Bottom-Right", x: 0.9, y: 0.8 }
    ];

    let smoothingFactor = 0.2;
    let DWELL_TIME_MS = 2200;

    const calibrationMap = [];
    const spikeGuard = { lastX: null, lastY: null, freezeUntil: 0 };

    let activeTarget = null;
    let hoverStartedAt = 0;

    function clearTargetHighlights() {
      document.querySelectorAll(".group-key, .letter-key").forEach(btn => {
        btn.classList.remove("active");
      });
    }

    function setStatus(message, color) {
      const status = document.getElementById("status-msg");
      status.innerText = message;
      if (color) status.style.color = color;
    }

    function learnKeyOffset(rawX, rawY, key) {
      if (!key) return;
      calibrationMap.push({ rawX, rawY, targetX: key.x, targetY: key.y });
      if (calibrationMap.length > 500) calibrationMap.shift();
    }

    function correctRawGaze(rawX, rawY) {
      if (!calibrationMap.length) return { x: rawX, y: rawY };

      let totalWeight = 0;
      let offsetX = 0;
      let offsetY = 0;

      for (const sample of calibrationMap) {
        const dist = Math.hypot(rawX - sample.rawX, rawY - sample.rawY);
        if (dist > 300) continue;

        const weight = 1 / (dist + 1);
        offsetX += (sample.targetX - sample.rawX) * weight;
        offsetY += (sample.targetY - sample.rawY) * weight;
        totalWeight += weight;
      }

      if (totalWeight === 0) return { x: rawX, y: rawY };
      return { x: rawX + (offsetX / totalWeight), y: rawY + (offsetY / totalWeight) };
    }

    function updateCalibrationTarget() {
      if (calibStep >= calibSequence.length) {
        isCalibrating = false;
        document.getElementById("calibration-overlay").style.display = "none";
        return;
      }

      const target = calibSequence[calibStep];
      const targetX = target.x0 !== undefined ? target.x0 : window.innerWidth * target.x;
      const targetY = target.y0 !== undefined ? target.y0 : window.innerHeight * target.y;

      const dot = document.getElementById("calib-dot");
      dot.style.left = targetX + "px";
      dot.style.top = targetY + "px";
      dot.innerText = target.key || (calibStep + 1);

      document.getElementById("calib-text").innerHTML =
        `Step ${calibStep + 1} of ${calibSequence.length} (${target.name})<br>Stare directly at the red dot and click it 3 times (${calibClicks}/3).`;

      window.currentCalibrationTargetCoords = { x: targetX, y: targetY };
    }

    function startCalibration(type) {
      isCalibrating = true;
      calibModeType = type;
      calibStep = 0;
      calibClicks = 0;

      if (calibModeType === "perkey") {
        calibSequence = GROUPS.flatMap((group, groupIndex) => group.keys.map((k, keyIndex) => ({
          name: `${group.label} / ${k}`,
          x0: (window.innerWidth * 0.5) - 300 + (keyIndex * 110),
          y0: (window.innerHeight * 0.55) + (groupIndex * 100),
          key: k
        })));
        document.getElementById("calib-title").innerText = "⌨️ Per-Key Sweep Calibration";
      } else {
        calibSequence = zone9Sequence;
        document.getElementById("calib-title").innerText = "🎯 9-Zone Grid Calibration";
      }

      document.getElementById("calibration-overlay").style.display = "flex";
      updateCalibrationTarget();
    }

    document.getElementById("calib-dot").addEventListener("click", function() {
      if (!isCalibrating) return;
      if (!window.currentCalibrationTargetCoords) return;

      const coords = window.currentCalibrationTargetCoords;
      webgazer.recordScreenPosition(coords.x, coords.y, "click");
      calibClicks++;

      if (calibClicks >= 3) {
        calibClicks = 0;
        calibStep++;
      }

      updateCalibrationTarget();
    });

    function clearText() {
      const outputBar = document.getElementById("output-bar");
      const txt = outputBar.innerText;
      outputBar.innerText = txt.length > 1 ? txt.slice(0, -1) : "Type here...";
    }

    function updateDwell(v) {
      DWELL_TIME_MS = parseFloat(v) * 1000;
      document.getElementById("dwell-val").innerText = v;
    }

    function updateSmooth(v) {
      smoothingFactor = parseFloat(v);
      document.getElementById("smooth-val").innerText = v;
    }

    function renderGroupSelection() {
      const row1 = document.getElementById("group-row-1");
      const row2 = document.getElementById("group-row-2");
      row1.innerHTML = "";
      row2.innerHTML = "";

      const groups1 = GROUPS.slice(0, 3);
      const groups2 = GROUPS.slice(3);

      groups1.forEach((group) => {
        const btn = document.createElement("button");
        btn.className = "group-key";
        btn.innerText = group.label;
        btn.dataset.group = group.label;
        btn.style.width = "180px";
        btn.style.height = "90px";
        btn.style.fontSize = "26px";
        btn.onclick = () => selectGroup(group);
        row1.appendChild(btn);
      });

      groups2.forEach((group) => {
        const btn = document.createElement("button");
        btn.className = "group-key";
        btn.innerText = group.label;
        btn.dataset.group = group.label;
        btn.style.width = "180px";
        btn.style.height = "90px";
        btn.style.fontSize = "26px";
        btn.onclick = () => selectGroup(group);
        row2.appendChild(btn);
      });
    }

    function renderLetterSelection(group) {
      const row = document.getElementById("group-row-1");
      const row2 = document.getElementById("group-row-2");
      row.innerHTML = "";
      row2.innerHTML = "";

      group.keys.forEach((key, index) => {
        const btn = document.createElement("button");
        btn.className = "letter-key";
        btn.innerText = key;
        btn.dataset.key = key;
        btn.style.width = "110px";
        btn.style.height = "110px";
        btn.style.fontSize = "32px";
        btn.onclick = () => chooseLetter(key);

        if (index < 3) row.appendChild(btn);
        else row2.appendChild(btn);
      });
    }

    function selectGroup(group) {
      selectedGroup = group;
      phase = "letter";
      selectedKey = null;
      activeTarget = null;
      hoverStartedAt = 0;
      clearTargetHighlights();
      renderLetterSelection(group);
    }

    function chooseLetter(value) {
      if (value === "⌫") {
        const outputBar = document.getElementById("output-bar");
        let txt = outputBar.innerText === "Type here..." ? "" : outputBar.innerText;
        txt = txt.slice(0, -1);
        outputBar.innerText = txt || "Type here...";
      } else if (value === "SP") {
        const outputBar = document.getElementById("output-bar");
        let txt = outputBar.innerText === "Type here..." ? "" : outputBar.innerText;
        outputBar.innerText = (txt + " ").trim() || "Type here...";
      } else {
        const outputBar = document.getElementById("output-bar");
        let txt = outputBar.innerText === "Type here..." ? "" : outputBar.innerText;
        outputBar.innerText = txt + value;
      }

      if (rawGazeX !== null && rawGazeY !== null) {
        const keyObj = { x: correctedGaze.x, y: correctedGaze.y, char: value };
        learnKeyOffset(rawGazeX, rawGazeY, keyObj);
      }

      phase = "group";
      selectedGroup = null;
      selectedKey = null;
      activeTarget = null;
      hoverStartedAt = 0;
      clearTargetHighlights();
      renderGroupSelection();
    }

    function setSpikeGuard(x, y) {
      const now = performance.now();

      if (spikeGuard.lastX !== null && spikeGuard.lastY !== null) {
        const velocity = Math.hypot(x - spikeGuard.lastX, y - spikeGuard.lastY);

        if (velocity > 90 && now < spikeGuard.freezeUntil) {
          return true;
        }

        if (velocity > 90) {
          spikeGuard.freezeUntil = now + 220;
          return true;
        }
      }

      spikeGuard.lastX = x;
      spikeGuard.lastY = y;
      return false;
    }

    function beginTargetSelection(target, type) {
      const now = performance.now();

      if (!target) return;

      clearTargetHighlights();
      target.classList.add("active");

      if (activeTarget !== target) {
        activeTarget = target;
        hoverStartedAt = now;
        return;
      }

      if (now - hoverStartedAt >= DWELL_TIME_MS) {
        if (type === "group") {
          const label = target.dataset.group;
          const group = GROUPS.find(g => g.label === label);
          if (group) {
            selectedGroup = group;
            phase = "letter";
            activeTarget = null;
            hoverStartedAt = 0;
            renderLetterSelection(group);
          }
        } else if (type === "letter") {
          chooseLetter(target.dataset.key);
          activeTarget = null;
          hoverStartedAt = 0;
          clearTargetHighlights();
        }
      }
    }

    function findNearestTarget(selector, maxDist) {
      const buttons = document.querySelectorAll(selector);
      let best = null;
      let bestDist = Infinity;

      for (const btn of buttons) {
        const rect = btn.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dist = Math.hypot(correctedGaze.x - cx, correctedGaze.y - cy);

        if (dist < maxDist && dist < bestDist) {
          best = btn;
          bestDist = dist;
        }
      }

      return best;
    }

    function updateSelectionState(gx, gy) {
      if (isCalibrating) return;

      if (setSpikeGuard(gx, gy)) return;

      if (phase === "group") {
        const best = findNearestTarget(".group-key", 140);
        if (!best) {
          activeTarget = null;
          clearTargetHighlights();
          return;
        }
        beginTargetSelection(best, "group");
      } else if (phase === "letter") {
        const best = findNearestTarget(".letter-key", 120);
        if (!best) {
          activeTarget = null;
          clearTargetHighlights();
          return;
        }
        beginTargetSelection(best, "letter");
      }
    }

    function renderVisuals() {
      const rawDot = document.getElementById("raw-gaze-dot");
      const vCursor = document.getElementById("virtual-cursor");

      if (rawGazeX !== null && rawGazeY !== null) {
        rawDot.style.left = rawGazeX + "px";
        rawDot.style.top = rawGazeY + "px";
        rawDot.style.display = "block";
      }

      vCursor.style.left = correctedGaze.x + "px";
      vCursor.style.top = correctedGaze.y + "px";
      vCursor.style.display = "block";
    }

    function processGaze(data) {
      if (!data) return;

      const rawX = data.x;
      const rawY = data.y;
      rawGazeX = rawX;
      rawGazeY = rawY;

      if (smoothedGazeX !== null && smoothedGazeY !== null) {
        const instVelocity = Math.hypot(rawX - smoothedGazeX, rawY - smoothedGazeY);

        if (instVelocity > 180 && !isSaccadeLocked) {
          isSaccadeLocked = true;
          smoothedGazeX = rawX;
          smoothedGazeY = rawY;
          clearTimeout(saccadeFreezeTimer);
          saccadeFreezeTimer = setTimeout(() => {
            isSaccadeLocked = false;
          }, 350);
        } else if (!isSaccadeLocked) {
          smoothedGazeX += (rawX - smoothedGazeX) * smoothingFactor;
          smoothedGazeY += (rawY - smoothedGazeY) * smoothingFactor;
        }
      } else {
        smoothedGazeX = rawX;
        smoothedGazeY = rawY;
      }

      const corrected = correctRawGaze(smoothedGazeX, smoothedGazeY);
      correctedGaze = corrected;

      if (!isCalibrating) {
        updateSelectionState(correctedGaze.x, correctedGaze.y);
      }

      renderVisuals();
    }

    function gazeTickListener(data) {
      processGaze(data);
    }

    window.onload = async function() {
      if (!window.saveDataAcrossSessions) {
        localforage.setItem("webgazerGlobalData", null);
        localforage.setItem("webgazerGlobalSettings", null);
      }

      renderGroupSelection();

      const webgazerInstance = await webgazer.setRegression("ridge")
        .setTracker("TFFacemesh")
        .begin();

      webgazerInstance.showVideoPreview(false)
        .showPredictionPoints(false)
        .applyKalmanFilter(true);

      webgazer.setGazeListener(gazeTickListener);
      startCalibration("9zone");
    };

    const style = document.createElement("style");
    style.textContent = `
      .webgazer-video-container,
      .webgazer-face-overlay,
      .webgazer-prediction-point {
        display: none !important;
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
