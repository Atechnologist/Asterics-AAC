<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>WebGazer D3 Quantum Circular Alphabet Collision Keyboard</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; color: #fff; user-select: none; }
        
        /* Top Control Bar */
        #top-bar {
            position: fixed; top: 0; left: 0; width: 100vw; height: 65px;
            background: rgba(15, 15, 15, 0.95); border-bottom: 2px solid #00ffcc;
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            z-index: 10000; box-sizing: border-box;
        }
        #output-bar {
            flex-grow: 1; height: 40px; background: rgba(5, 5, 5, 0.9);
            border: 2px solid #00ffcc; border-radius: 6px; color: #00ffcc;
            font-size: 18px; display: flex; align-items: center; padding: 0 15px;
            margin-right: 20px; overflow: hidden; white-space: nowrap;
        }
        .control-group { display: flex; align-items: center; gap: 10px; }
        .action-btn {
            background: #222; color: #fff; border: 1px solid #555; padding: 7px 12px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px;
        }
        .action-btn.danger { border-color: #ff4444; color: #ff4444; }
        .action-btn.primary { border-color: #00ffcc; color: #00ffcc; }

        /* Sub Toolbar for Settings */
        #sub-bar {
            position: fixed; top: 65px; left: 0; width: 100vw; height: 38px;
            background: rgba(25, 25, 25, 0.9); border-bottom: 1px solid #333;
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            z-index: 9999; font-size: 13px; color: #aaa; box-sizing: border-box;
        }
        .slider-container { display: flex; align-items: center; gap: 8px; }
        input[type=range] { accent-color: #00ffcc; cursor: pointer; }

        /* Calibration Overlay */
        #calibration-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 10, 10, 0.88); z-index: 30000;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 130px; text-align: center; pointer-events: none;
        }
        #calib-dot {
            width: 50px; height: 50px; background: #ff0055; border-radius: 50%;
            position: absolute; transform: translate(-50%, -50%); cursor: pointer;
            box-shadow: 0 0 35px #ff0055; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; color: #fff; border: 3px solid #fff;
            pointer-events: auto; z-index: 35000;
        }

        .letter-node { font-weight: bold; cursor: pointer; user-select: none; }
        .letter-circle { stroke: #00ffcc; stroke-width: 2px; fill: #1e1e1e; transition: fill 0.15s, stroke 0.15s; }
    </style>
</head>
<body>

  <!-- Top Control Bar -->
  <div id="top-bar">
      <div id="output-bar">Type here...</div>
      <div class="control-group">
          <button class="action-btn primary" onclick="speakText()">🔊 Speak</button>
          <button class="action-btn danger" onclick="clearText()">Delete</button>
          <button class="action-btn" onclick="clearAllText()">Clear</button>
          <button class="action-btn primary" onclick="startCalibration()">Recalibrate</button>
      </div>
  </div>

  <!-- Sub Toolbar for Settings -->
  <div id="sub-bar">
      <span style="color: #00ffcc;">💡 Stare at Camera Preview (Top-Left) for <strong>2.5s</strong> to Recalibrate</span>
      <div style="display: flex; gap: 20px;">
          <div class="slider-container">
              <label>Dwell: <span id="dwell-val">0.8</span>s</label>
              <input type="range" id="dwell-slider" min="0.3" max="2.0" step="0.1" value="0.8" oninput="updateDwell(this.value)">
          </div>
          <div class="slider-container">
              <label>Smooth: <span id="smooth-val">0.4</span></label>
              <input type="range" id="smooth-slider" min="0.1" max="0.9" step="0.05" value="0.4" oninput="updateSmooth(this.value)">
          </div>
      </div>
  </div>

  <!-- Calibration Overlay Modal -->
  <div id="calibration-overlay">
      <h2 style="color: #00ffcc; margin-bottom: 10px;">Quantum Circular Collision Calibration</h2>
      <p id="calib-text" style="color: #bbb; max-width: 450px; line-height: 1.5; margin-bottom: 30px;">
          Stare directly at the red glowing circle and click it <strong>3 times</strong> with your mouse.
      </p>
      <div id="calib-dot">1</div>
  </div>

  <!-- Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.8.1/localforage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/webgazer@3.3.0/dist/webgazer.js"></script>

  <script>
    const originalGetContext = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function(type, attributes) {
        if (type === '2d') {
            attributes = attributes || {};
            attributes.willReadFrequently = true;
        }
        return originalGetContext.call(this, type, attributes);
    };

    window.saveDataAcrossSessions = false;
    var force, nodes = [];
    var smoothedGazeX = null, smoothedGazeY = null;
    let smoothingFactor = 0.4;

    let isCalibrating = true;
    let calibStep = 0;
    let calibClicks = 0;
    
    const calibSequence = [
        {name: "Top-Left Zone", x: 0.15, y: 0.3},
        {name: "Top-Right Zone", x: 0.85, y: 0.3},
        {name: "Center Zone", x: 0.5, y: 0.5},
        {name: "Bottom-Left Zone", x: 0.15, y: 0.8},
        {name: "Bottom-Right Zone", x: 0.85, y: 0.8}
    ];

    let currentCollidingKey = null;
    let dwellTimer = null;
    let DWELL_TIME_MS = 800;
    let svg, nodeGroups;
    let homeBaseTimer = null;

    let lastGazeSamples = [];
    const VARIANCE_THRESHOLD = 500;

    window.onload = async function() {
        if (!window.saveDataAcrossSessions) {
            localforage.setItem('webgazerGlobalData', null);
            localforage.setItem('webgazerGlobalSettings', null);
        }

        setupAlphabetCollisionSystem();

        const webgazerInstance = await webgazer.setRegression('ridge')
            .setTracker('TFFacemesh')
            .begin();
        
        webgazerInstance.showVideoPreview(true)
            .showPredictionPoints(false)
            .applyKalmanFilter(true);

        webgazer.setGazeListener(collisionEyeListener);
        startCalibration();
    };

    function setupAlphabetCollisionSystem() {
        var width = window.innerWidth;
        var height = window.innerHeight;

        var letters = ["Q", "W", "E", "R", "T", "Z", "U", "I", "O", "P", "A", "S", "D", "F", "G", "H", "J", "K", "L", "Y", "X", "C", "V", "B", "N", "M", "⌫", "SP"];
        
        nodes = letters.map(function(char) {
            return {
                char: char,
                radius: 32,
                x: width * 0.25 + Math.random() * (width * 0.5),
                y: height * 0.3 + Math.random() * (height * 0.5),
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2
            };
        });

        // Index 0 is the eye/gaze anchor node
        nodes.unshift({ radius: 0, fixed: true, x: width/2, y: height/2 });

        force = d3.layout.force()
            .gravity(0.06)
            .charge(function(d, i) { return i ? -30 : -2500; })
            .nodes(nodes)
            .size([width, height])
            .start();

        if (svg) svg.remove();

        svg = d3.select("body").append("svg")
            .attr("width", width)
            .attr("height", height)
            .style("position", "absolute")
            .style("top", "0")
            .style("left", "0");

        // Render circular node containers holding both background circle and text
        nodeGroups = svg.selectAll(".node-group")
            .data(nodes.slice(1))
            .enter().append("g")
            .attr("class", "node-group");

        nodeGroups.append("circle")
            .attr("class", "letter-circle")
            .attr("r", function(d) { return d.radius; });

        nodeGroups.append("text")
            .attr("class", "letter-node")
            .attr("dy", ".35em")
            .attr("text-anchor", "middle")
            .attr("font-size", "22px")
            .attr("fill", "#00ffcc")
            .text(function(d) { return d.char; });

        svg.append("line").attr("id", "eyeline1").attr("stroke-width", 2).attr("stroke", "rgba(255,0,85,0.7)");
        svg.append("line").attr("id", "eyeline2").attr("stroke-width", 2).attr("stroke", "rgba(255,0,85,0.7)");

        force.on("tick", function(e) {
            var q = d3.geom.quadtree(nodes),
                i = 0,
                n = nodes.length;

            while (++i < n) q.visit(collide(nodes[i]));

            // Dual Quantum Attraction/Repulsion Physics & Strict Containment Walls
            let eyeNode = nodes[0];
            for (let j = 1; j < nodes.length; j++) {
                let d = nodes[j];

                // Quantum Attraction: Gently pull the letter closest to the eye directly toward gaze center
                let dx = eyeNode.x - d.x;
                let dy = eyeNode.y - d.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 180 && d.char === currentCollidingKey) {
                    d.x += dx * 0.1;
                    d.y += dy * 0.1;
                }

                // Strict Boundary Walls (Keep letters locked safely inside usable screen)
                if (d.x < 50) { d.x = 50; d.vx *= -1; }
                if (d.x > width - 50) { d.x = width - 50; d.vx *= -1; }
                if (d.y < 120) { d.y = 120; d.vy *= -1; }
                if (d.y > height - 50) { d.y = height - 50; d.vy *= -1; }
            }

            nodeGroups.attr("transform", function(d) {
                return "translate(" + d.x + "," + d.y + ")";
            });
        });

        // Mouse fallback for testing
        svg.on("mousemove", function() {
            if (isCalibrating) return;
            var p1 = d3.mouse(this);
            nodes[0].x = nodes[0].px = p1[0];
            nodes[0].y = nodes[0].py = p1[1];
            force.resume();
            handleInteractions(p1[0], p1[1], null);
        });
    }

    function startCalibration() {
        isCalibrating = true;
        calibStep = 0;
        calibClicks = 0;
        document.getElementById("calibration-overlay").style.display = "flex";
        updateCalibrationTarget();
    }

    function updateCalibrationTarget() {
        if (calibStep >= calibSequence.length) {
            isCalibrating = false;
            document.getElementById("calibration-overlay").style.display = "none";
            return;
        }
        let target = calibSequence[calibStep];
        let targetX = window.innerWidth * target.x;
        let targetY = window.innerHeight * target.y;

        let dot = document.getElementById("calib-dot");
        dot.style.left = targetX + "px";
        dot.style.top = targetY + "px";
        dot.innerText = (calibStep + 1);

        document.getElementById("calib-text").innerHTML = 
            `Calibration Step ${calibStep + 1} of ${calibSequence.length} (${target.name})<br>Stare at the red dot and click it 3 times (${calibClicks}/3).`;
            
        window.currentCalibrationTargetCoords = {x: targetX, y: targetY};
    }

    document.getElementById("calib-dot").addEventListener("click", function() {
        if (!isCalibrating) return;
        let coords = window.currentCalibrationTargetCoords;

        webgazer.recordScreenPosition(coords.x, coords.y, 'click');
        calibClicks++;

        if (calibClicks >= 3) {
            calibClicks = 0;
            calibStep++;
        }
        updateCalibrationTarget();
    });

    function collide(node) {
        var r = node.radius + 16,
            nx1 = node.x - r, nx2 = node.x + r,
            ny1 = node.y - r, ny2 = node.y + r;
        return function(quad, x1, y1, x2, y2) {
            if (quad.point && (quad.point !== node)) {
                var x = node.x - quad.point.x,
                    y = node.y - quad.point.y,
                    l = Math.sqrt(x * x + y * y),
                    r = node.radius + quad.point.radius;
                if (l < r) {
                    l = (l - r) / l * .5;
                    node.x -= x *= l;
                    node.y -= y *= l;
                    quad.point.x += x;
                    quad.point.y += y;

                    if (!isCalibrating && (node === nodes[0] || quad.point === nodes[0])) {
                        let hitKey = node === nodes[0] ? quad.point : node;
                        handleInteractions(nodes[0].x, nodes[0].y, hitKey);
                    }
                }
            }
            return x1 > nx2 || x2 < nx1 || y1 > ny2 || y2 < ny1;
        };
    }

    function handleInteractions(gazeX, gazeY, keyNode) {
        if (isCalibrating) return;

        // HOME BASE CHECK: Stare at top-left camera preview box (X < 320, Y < 300) for 2.5s to trigger Recalibration
        if (gazeX < 320 && gazeY < 300) {
            if (!homeBaseTimer) {
                homeBaseTimer = setTimeout(() => {
                    startCalibration();
                    homeBaseTimer = null;
                }, 2500);
            }
            return;
        } else {
            clearTimeout(homeBaseTimer);
            homeBaseTimer = null;
        }

        // Check gaze variance
        lastGazeSamples.push({x: gazeX, y: gazeY});
        if (lastGazeSamples.length > 5) lastGazeSamples.shift();

        if (lastGazeSamples.length === 5) {
            let meanX = lastGazeSamples.reduce((sum, p) => sum + p.x, 0) / 5;
            let meanY = lastGazeSamples.reduce((sum, p) => sum + p.y, 0) / 5;
            let variance = lastGazeSamples.reduce((sum, p) => sum + Math.pow(p.x - meanX, 2) + Math.pow(p.y - meanY, 2), 0) / 5;
            if (variance > VARIANCE_THRESHOLD) return;
        }

        if (keyNode) {
            if (currentCollidingKey !== keyNode.char) {
                currentCollidingKey = keyNode.char;
                clearTimeout(dwellTimer);

                nodeGroups.select("circle").attr("fill", "#1e1e1e").attr("stroke", "#00ffcc");
                nodeGroups.select("text").attr("fill", "#00ffcc");

                let activeGroup = nodeGroups.filter(d => d.char === currentCollidingKey);
                activeGroup.select("circle").attr("fill", "#00ffcc").attr("stroke", "#ff0055");
                activeGroup.select("text").attr("fill", "#000");

                dwellTimer = setTimeout(() => {
                    appendCharacter(currentCollidingKey);
                    nodeGroups.select("circle").attr("fill", "#1e1e1e").attr("stroke", "#00ffcc");
                    nodeGroups.select("text").attr("fill", "#00ffcc");
                    currentCollidingKey = null;
                }, DWELL_TIME_MS);
            }
        }
    }

    function appendCharacter(char) {
        const outputBar = document.getElementById("output-bar");
        let txt = outputBar.innerText === "Type here..." ? "" : outputBar.innerText;
        if (char === "⌫") txt = txt.slice(0, -1);
        else if (char === "SP") txt += " ";
        else txt += char;
        outputBar.innerText = txt || "Type here...";
    }

    function clearText() {
        const outputBar = document.getElementById("output-bar");
        let txt = outputBar.innerText;
        outputBar.innerText = txt.length > 1 ? txt.slice(0, -1) : "Type here...";
    }

    function clearAllText() {
        document.getElementById("output-bar").innerText = "Type here...";
    }

    function speakText() {
        const text = document.getElementById("output-bar").innerText;
        if (text && text !== "Type here...") {
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }
    }

    function updateDwell(val) {
        DWELL_TIME_MS = parseFloat(val) * 1000;
        document.getElementById("dwell-val").innerText = val;
    }

    function updateSmooth(val) {
        smoothingFactor = parseFloat(val);
        document.getElementById("smooth-val").innerText = val;
    }

    var collisionEyeListener = async function(data, clock) {
        if (!data) return;

        if (smoothedGazeX === null || smoothedGazeY === null) {
            smoothedGazeX = data.x;
            smoothedGazeY = data.y;
        } else {
            smoothedGazeX += (data.x - smoothedGazeX) * smoothingFactor;
            smoothedGazeY += (data.y - smoothedGazeY) * smoothingFactor;
        }

        nodes[0].x = nodes[0].px = smoothedGazeX;
        nodes[0].y = nodes[0].py = smoothedGazeY;
        force.resume();

        handleInteractions(smoothedGazeX, smoothedGazeY, null);

        var tracker = webgazer.getTracker();
        var fmPositions = tracker && tracker.getPositions ? await tracker.getPositions() : null;
        var previewWidth = webgazer.params.videoViewerWidth || 320;
        var whr = webgazer.getVideoPreviewToCameraResolutionRatio() || [1, 1];

        if (fmPositions && fmPositions[145] && fmPositions[374]) {
            d3.select('#eyeline1')
                .attr("x1", smoothedGazeX).attr("y1", smoothedGazeY)
                .attr("x2", previewWidth - fmPositions[145][0] * whr[0])
                .attr("y2", fmPositions[145][1] * whr[1]);

            d3.select("#eyeline2")
                .attr("x1", smoothedGazeX).attr("y1", smoothedGazeY)
                .attr("x2", previewWidth - fmPositions[374][0] * whr[0])
                .attr("y2", fmPositions[374][1] * whr[1]);
        }
    };
  </script>
</body>
</html>
