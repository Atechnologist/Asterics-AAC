<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gaze Keyboard with Learned Corrections</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: rgba(15,15,15,0.95);
      --cyan: #00ffcc;
      --magenta: #ff0055;
      --text: #ffffff;
      --muted: #bbbbbb;
      --key: #1e1e1e;
      --key-border: #00ffcc;
    }

    html, body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      user-select: none;
    }

    #top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 75px;
      background: var(--panel);
      border-bottom: 2px solid var(--cyan);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      box-sizing: border-box;
      z-index: 10000;
    }

    #output-bar {
      flex: 1;
      height: 45px;
      background: rgba(5,5,5,0.9);
      border: 2px solid var(--cyan);
      border-radius: 6px;
      color: var(--cyan);
      font-size: 20px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      margin-right: 15px;
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mode-btn, .action-btn {
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.18s ease;
      border: 1px solid var(--cyan);
      background: #1e1e1e;
      color: var(--cyan);
      padding: 6px 10px;
    }

    .mode-btn.active {
      background: var(--cyan);
      color: #000;
      box-shadow: 0 0 12px rgba(0,255,204,0.5);
    }

    .action-btn.primary { color: var(--cyan); }
    .action-btn.danger {
      border-color: #ff4444;
      color: #ff4444;
    }
    .action-btn.training {
      background: var(--magenta);
      border-color: var(--magenta);
      color: #fff;
      box-shadow: 0 0 10px rgba(255,0,85,0.7);
    }

    #sub-bar {
      position: fixed;
      top: 75px; left: 0; right: 0;
      height: 45px;
      background: rgba(25,25,25,0.9);
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 9999;
      font-size: 13px;
      color: #aaa;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type=range] { accent-color: var(--cyan); cursor: pointer; }

    #calibration-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10,10,10,0.92);
      z-index: 30000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 100px;
      text-align: center;
      pointer-events: none;
    }

    #calib-dot {
      position: absolute;
      width: 52px; height: 52px;
      background: var(--magenta);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      box-shadow: 0 0 35px rgba(255,0,85,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: #fff;
      border: 3px solid #fff;
      pointer-events: auto;
      z-index: 35000;
    }

    #iris-shutter {
      position: absolute;
      border: 3px dashed var(--magenta);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 25px rgba(255,0,85,0.4);
      background: rgba(255,0,85,0.05);
      z-index: 15000;
      display: none;
      transition: width 0.35s ease-out, height 0.35s ease-out;
    }

    #virtual-cursor {
      position: absolute;
      width: 18px; height: 18px;
      border: 2px solid var(--cyan);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 10px rgba(0,255,204,0.9);
      z-index: 20000;
      display: none;
    }

    #raw-gaze-dot {
      position: absolute;
      width: 12px;
      height: 12px;
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 19990;
      display: none;
    }

    svg {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
    }

    .key-box {
      fill: #1e1e1e;
      stroke: #00ffcc;
      stroke-width: 2;
      transition: fill 0.12s ease, stroke 0.12s ease;
    }

    .key-text {
      fill: #00ffcc;
      font-size: 22px;
      text-anchor: middle;
      dominant-baseline: middle;
      font-weight: bold;
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="raw-gaze-dot"></div>
  <div id="virtual-cursor"></div>
  <div id="iris-shutter"></div>

  <div id="top-bar">
    <div id="output-bar">Type here...</div>

    <div class="control-group">
      <button class="mode-btn active" onclick="switchMode('magnetic')">Magnetic QWERTY</button>
      <button class="mode-btn" onclick="switchMode('iris')">Iris Shutter Zoom</button>
      <button class="mode-btn" onclick="switchMode('swipe')">Gaze Swipe</button>
      <button class="mode-btn" onclick="switchMode('floating')">Floating Letters</button>
    </div>

    <div class="control-group" style="margin-left: 10px;">
      <button id="train-toggle-btn" class="action-btn training" onclick="toggleSupervisedTraining()">🎓 Training Mode: ON</button>
      <button id="diag-toggle-btn" class="action-btn primary" onclick="toggleDiagnostics()">📊 Diag Overlay: OFF</button>
      <button class="action-btn primary" onclick="startCalibration('9zone')">🎯 9-Zone Grid</button>
      <button class="action-btn primary" onclick="startCalibration('perkey')">⌨️ Per-Key Sweep</button>
      <button class="action-btn danger" onclick="clearText()">Delete</button>
    </div>
  </div>

  <div id="sub-bar">
    <span style="color: #ff0055;" id="status-msg">🎓 Supervised Training Active: Hover mouse over key and click/look to record ground-truth</span>
    <div style="display: flex; gap: 20px;">
      <div class="slider-container">
        <label>Dwell: <span id="dwell-val">1.2</span>s</label>
        <input type="range" id="dwell-slider" min="0.5" max="3.0" step="0.1" value="1.2" oninput="updateDwell(this.value)">
      </div>
      <div class="slider-container">
        <label>Smooth: <span id="smooth-val">0.2</span></label>
        <input type="range" id="smooth-slider" min="0.1" max="0.9" step="0.05" value="0.2" oninput="updateSmooth(this.value)">
      </div>
    </div>
  </div>

  <div id="calibration-overlay">
    <h2 style="color: #00ffcc; margin-bottom: 10px;" id="calib-title">Gaze Calibration Required</h2>
    <p id="calib-text" style="color: #bbb; max-width: 500px; line-height: 1.5; margin-bottom: 25px;">
      Stare directly at the glowing circle and click it <strong>3 times</strong> with your mouse.
    </p>
    <div id="calib-dot">1</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.8.1/localforage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/webgazer@3.3.0/dist/webgazer.js"></script>

  <script>
    const originalGetContext = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function(type, attributes) {
      if (type === '2d') {
        attributes = attributes || {};
        attributes.willReadFrequently = true;
      }
      return originalGetContext.call(this, type, attributes);
    };

    let currentMode = "magnetic";
    let isCalibrating = true;
    let calibModeType = "9zone";
    let calibStep = 0;
    let calibClicks = 0;
    let calibSequence = [];
    const zone9Sequence = [
      { name: "Top-Left", x: 0.1, y: 0.2 },
      { name: "Top-Center", x: 0.5, y: 0.2 },
      { name: "Top-Right", x: 0.9, y: 0.2 },
      { name: "Mid-Left", x: 0.1, y: 0.5 },
      { name: "Center Screen", x: 0.5, y: 0.5 },
      { name: "Mid-Right", x: 0.9, y: 0.5 },
      { name: "Bottom-Left", x: 0.1, y: 0.8 },
      { name: "Bottom-Center", x: 0.5, y: 0.8 },
      { name: "Bottom-Right", x: 0.9, y: 0.8 }
    ];

    let DWELL_TIME_MS = 1200;
    let smoothingFactor = 0.2;
    let supervisedTrainingActive = true;
    let diagnosticsVisible = false;

    let trainingSampleCount = 0;
    let correctionSamples = [];

    let nodes = [];
    let svg = null;
    let keyGroups = null;
    let swipePolyline = null;

    let rawGazeX = null;
    let rawGazeY = null;
    let smoothedGazeX = null;
    let smoothedGazeY = null;

    let correctedGaze = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    let activeHoverKey = null;
    let selection = null;

    let homeBaseTimer = null;

    const calibrationMap = [];
    const spikeGuard = { lastX: null, lastY: null, freezeUntil: 0 };

    const KEY_ROWS = [
      ["Q","W","E","R","T","Y","U","I","O","P"],
      ["A","S","D","F","G","H","J","K","L"],
      ["Z","X","C","V","B","N","M","⌫","SP"]
    ];

    function setStatus(message, color) {
      const status = document.getElementById("status-msg");
      status.innerText = message;
      if (color) status.style.color = color;
    }

    function toggleSupervisedTraining() {
      supervisedTrainingActive = !supervisedTrainingActive;
      const btn = document.getElementById("train-toggle-btn");
      if (supervisedTrainingActive) {
        btn.className = "action-btn training";
        btn.innerText = "🎓 Training Mode: ON";
        setStatus(`🎓 Supervised Training Active: Hover mouse on target key & click/look (${trainingSampleCount} learned)`, "#ff0055");
      } else {
        btn.className = "action-btn primary";
        btn.innerText = "🔒 Training Mode: OFF";
        setStatus(`🔒 Live Inference Mode (${trainingSampleCount} samples active)`, "#00ffcc");
      }
    }

    function toggleDiagnostics() {
      diagnosticsVisible = !diagnosticsVisible;
      const btn = document.getElementById("diag-toggle-btn");
      btn.innerText = diagnosticsVisible ? "📊 Diag Overlay: ON" : "📊 Diag Overlay: OFF";
      if (!d3.select("#diag-group").empty()) {
        d3.select("#diag-group").style("display", diagnosticsVisible ? "block" : "none");
      }
    }

    function recordSupervisedGroundTruth(trueTargetX, trueTargetY) {
      if (!supervisedTrainingActive || rawGazeX === null || rawGazeY === null) return;

      const deltaX = trueTargetX - rawGazeX;
      const deltaY = trueTargetY - rawGazeY;

      correctionSamples.push({ rawX: rawGazeX, rawY: rawGazeY, deltaX, deltaY });
      if (correctionSamples.length > 80) correctionSamples.shift();
      trainingSampleCount = correctionSamples.length;

      setStatus(`🎓 Recorded Ground-Truth Delta! (${trainingSampleCount} spatial samples learned)`, "#ff0055");
    }

    function applyAdaptiveResiduals(gazeX, gazeY) {
      if (correctionSamples.length === 0) return { x: gazeX, y: gazeY };

      let totalWeight = 0;
      let weightedDeltaX = 0;
      let weightedDeltaY = 0;
      const bandwidth = 350;

      for (const sample of correctionSamples) {
        const dist = Math.hypot(gazeX - sample.rawX, gazeY - sample.rawY);
        if (dist < bandwidth) {
          const weight = Math.exp(-(dist * dist) / (2 * bandwidth * bandwidth));
          weightedDeltaX += sample.deltaX * weight;
          weightedDeltaY += sample.deltaY * weight;
          totalWeight += weight;
        }
      }

      if (totalWeight > 0) {
        return {
          x: gazeX + (weightedDeltaX / totalWeight),
          y: gazeY + (weightedDeltaY / totalWeight)
        };
      }

      return { x: gazeX, y: gazeY };
    }

    function learnKeyOffset(rawX, rawY, key) {
      if (!key) return;
      calibrationMap.push({
        rawX,
        rawY,
        targetX: key.x,
        targetY: key.y
      });
      if (calibrationMap.length > 300) calibrationMap.shift();
    }

    function correctRawGaze(rawX, rawY) {
      if (!calibrationMap.length) return { x: rawX, y: rawY };

      let totalWeight = 0;
      let offsetX = 0;
      let offsetY = 0;

      for (const sample of calibrationMap) {
        const dist = Math.hypot(rawX - sample.rawX, rawY - sample.rawY);
        if (dist > 320) continue;

        const weight = 1 / (dist + 1);
        offsetX += (sample.targetX - sample.rawX) * weight;
        offsetY += (sample.targetY - sample.rawY) * weight;
        totalWeight += weight;
      }

      if (totalWeight === 0) return { x: rawX, y: rawY };

      return {
        x: rawX + (offsetX / totalWeight),
        y: rawY + (offsetY / totalWeight)
      };
    }

    function createFixedLayout() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      const list = [];
      const startY = height * 0.54;

      KEY_ROWS.forEach((row, rowIndex) => {
        const startX = (width - (row.length * 72)) / 2;
        row.forEach((char, colIndex) => {
          const x = startX + (colIndex * 72) + 36;
          const y = startY + (rowIndex * 72) + 30;
          list.push({ char, x, y, radius: 34, mode: "fixed" });
        });
      });

      return list;
    }

    function rebuildKeyboard() {
      nodes = createFixedLayout();

      if (svg) svg.remove();

      svg = d3.select("body").append("svg");

      keyGroups = svg.selectAll(".key-group")
        .data(nodes)
        .enter()
        .append("g")
        .attr("class", "key-group");

      keyGroups.append("rect")
        .attr("class", "key-box")
        .attr("x", d => d.x - 32)
        .attr("y", d => d.y - 32)
        .attr("width", 64)
        .attr("height", 64)
        .attr("rx", 8)
        .attr("ry", 8);

      keyGroups.append("text")
        .attr("class", "key-text")
        .attr("x", d => d.x)
        .attr("y", d => d.y)
        .text(d => d.char);

      swipePolyline = svg.append("polyline")
        .attr("fill", "none")
        .attr("stroke", "#ff0055")
        .attr("stroke-width", 4)
        .attr("stroke-linecap", "round")
        .style("opacity", 0);

      const diagGroup = svg.append("g").attr("id", "diag-group").style("display", "none");
      diagGroup.append("line").attr("id", "diag-vector-line").attr("stroke", "#ff0055").attr("stroke-width", 3).attr("stroke-dasharray", "4,4");
      diagGroup.append("circle").attr("id", "diag-raw-circle").attr("r", 12).attr("fill", "none").attr("stroke", "#ffff00").attr("stroke-width", 2);

      svg.append("line").attr("id", "eyeline1").attr("stroke-width", 2).attr("stroke", "rgba(255,0,85,0.7)");
      svg.append("line").attr("id", "eyeline2").attr("stroke-width", 2).attr("stroke", "rgba(255,0,85,0.7)");
    }

    function renderKeyboardHighlights() {
      if (!keyGroups) return;

      keyGroups.select("rect").attr("fill", "#1e1e1e").attr("stroke", "#00ffcc");
      keyGroups.select(".key-text").attr("fill", "#00ffcc");

      if (activeHoverKey) {
        const target = keyGroups.filter(d => d.char === activeHoverKey);
        if (!target.empty()) {
          target.select("rect").attr("fill", "#00ffcc").attr("stroke", "#ff0055");
          target.select(".key-text").attr("fill", "#000");
        }
      }
    }

    function findNearestKey(gx, gy) {
      let best = null;
      let bestDist = Infinity;

      for (const key of nodes) {
        const dist = Math.hypot(gx - key.x, gy - key.y);
        const radius = 110;
        if (dist <= radius && dist < bestDist) {
          bestDist = dist;
          best = key;
        }
      }

      return best;
    }

    function setSpikeGuard(x, y) {
      const now = performance.now();
      if (spikeGuard.lastX !== null && spikeGuard.lastY !== null) {
        const velocity = Math.hypot(x - spikeGuard.lastX, y - spikeGuard.lastY);
        if (velocity > 90 && now < spikeGuard.freezeUntil) {
          return true;
        }
        if (velocity > 90) {
          spikeGuard.freezeUntil = now + 220;
          return true;
        }
      }
      spikeGuard.lastX = x;
      spikeGuard.lastY = y;
      return false;
    }

    function activateKey(key) {
      if (!key) return;

      if (key.char === "⌫") {
        const outputBar = document.getElementById("output-bar");
        let txt = outputBar.innerText === "Type here..." ? "" : outputBar.innerText;
        txt = txt.slice(0, -1);
        outputBar.innerText = txt || "Type here...";
      } else if (key.char === "SP") {
        const outputBar = document.getElementById("output-bar");
        let txt = outputBar.innerText === "Type here..." ? "" : outputBar.innerText;
        outputBar.innerText = (txt + " ").trim() || "Type here...";
      } else {
        const outputBar = document.getElementById("output-bar");
        let txt = outputBar.innerText === "Type here..." ? "" : outputBar.innerText;
        outputBar.innerText = txt + key.char;
      }

      if (rawGazeX !== null && rawGazeY !== null) {
        learnKeyOffset(rawGazeX, rawGazeY, key);
      }

      activeHoverKey = null;
      selection = null;
      renderKeyboardHighlights();
    }

    function doSelectionAt(gx, gy) {
      if (setSpikeGuard(gx, gy)) {
        selection = null;
        activeHoverKey = null;
        renderKeyboardHighlights();
        return;
      }

      const nearest = findNearestKey(gx, gy);

      if (!nearest) {
        selection = null;
        activeHoverKey = null;
        renderKeyboardHighlights();
        return;
      }

      if (!selection || selection.char !== nearest.char) {
        selection = { char: nearest.char, startedAt: performance.now(), dwellStartedAt: null };
        activeHoverKey = nearest.char;
        hoverStartedAt = performance.now();
        renderKeyboardHighlights();
        return;
      }

      if (performance.now() - selection.startedAt >= 180) {
        if (selection.dwellStartedAt === null) {
          selection.dwellStartedAt = performance.now();
        }

        if (performance.now() - selection.dwellStartedAt >= DWELL_TIME_MS) {
          activateKey(nearest);
        }
      }
    }

    function updateCalibrationTarget() {
      if (calibStep >= calibSequence.length) {
        isCalibrating = false;
        document.getElementById("calibration-overlay").style.display = "none";
        return;
      }

      const target = calibSequence[calibStep];
      const targetX = target.x0 !== undefined ? target.x0 : window.innerWidth * target.x;
      const targetY = target.y0 !== undefined ? target.y0 : window.innerHeight * target.y;

      const dot = document.getElementById("calib-dot");
      dot.style.left = targetX + "px";
      dot.style.top = targetY + "px";
      dot.innerText = target.key || (calibStep + 1);

      document.getElementById("calib-text").innerHTML =
        `Step ${calibStep + 1} of ${calibSequence.length} (${target.name})<br>Stare directly at the red dot and click it 3 times (${calibClicks}/3).`;

      window.currentCalibrationTargetCoords = { x: targetX, y: targetY };
    }

    function startCalibration(type) {
      calibModeType = type;
      isCalibrating = true;
      calibStep = 0;
      calibClicks = 0;

      if (calibModeType === "perkey") {
        calibSequence = nodes.map(n => ({
          name: `Key '${n.char}'`,
          x0: n.x,
          y0: n.y,
          key: n.char
        }));
        document.getElementById("calib-title").innerText = "⌨️ Per-Key Sweep Calibration";
      } else {
        calibSequence = zone9Sequence;
        document.getElementById("calib-title").innerText = "🎯 9-Zone Grid Calibration";
      }

      document.getElementById("calibration-overlay").style.display = "flex";
      updateCalibrationTarget();
    }

    document.getElementById("calib-dot").addEventListener("click", function() {
      if (!isCalibrating) return;
      const coords = window.currentCalibrationTargetCoords;
      webgazer.recordScreenPosition(coords.x, coords.y, "click");
      calibClicks++;

      if (calibClicks >= 3) {
        calibClicks = 0;
        calibStep++;
      }

      updateCalibrationTarget();
    });

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll(".mode-btn").forEach(btn => btn.classList.remove("active"));
      const button = event.target;
      if (button) button.classList.add("active");

      if (swipePolyline) {
        swipePolyline.style("opacity", mode === "swipe" ? 1 : 0);
      }

      rebuildKeyboard();
      selection = null;
      activeHoverKey = null;
    }

    function clearText() {
      const outputBar = document.getElementById("output-bar");
      const txt = outputBar.innerText;
      outputBar.innerText = txt.length > 1 ? txt.slice(0, -1) : "Type here...";
    }

    function updateDwell(val) {
      DWELL_TIME_MS = parseFloat(val) * 1000;
      document.getElementById("dwell-val").innerText = val;
    }

    function updateSmooth(val) {
      smoothingFactor = parseFloat(val);
      document.getElementById("smooth-val").innerText = val;
    }

    function handleHomeReset(gx, gy) {
      if (gx < 320 && gy < 300) {
        if (!homeBaseTimer) {
          homeBaseTimer = setTimeout(() => {
            startCalibration("9zone");
            homeBaseTimer = null;
          }, 2500);
        }
        return true;
      }
      clearTimeout(homeBaseTimer);
      homeBaseTimer = null;
      return false;
    }

    function updateGazeDots(rawX, rawY, correctedX, correctedY) {
      const rawDot = document.getElementById("raw-gaze-dot");
      const vCursor = document.getElementById("virtual-cursor");

      rawDot.style.left = rawX + "px";
      rawDot.style.top = rawY + "px";
      rawDot.style.display = isCalibrating ? "none" : "block";

      vCursor.style.left = correctedX + "px";
      vCursor.style.top = correctedY + "px";
      vCursor.style.display = isCalibrating ? "none" : "block";
    }

    let renderScheduled = false;

    function renderFrame() {
      renderScheduled = false;

      // visual updates only, no heavy work
      const rawDot = document.getElementById("raw-gaze-dot");
      const vCursor = document.getElementById("virtual-cursor");

      if (rawGazeX !== null && rawGazeY !== null) {
        rawDot.style.left = rawGazeX + "px";
        rawDot.style.top = rawGazeY + "px";
        rawDot.style.display = isCalibrating ? "none" : "block";
      }

      vCursor.style.left = correctedGaze.x + "px";
      vCursor.style.top = correctedGaze.y + "px";
      vCursor.style.display = isCalibrating ? "none" : "block";

      if (!isCalibrating && selection && activeHoverKey) {
        renderKeyboardHighlights();
      }
    }

    function scheduleRender() {
      if (renderScheduled) return;
      renderScheduled = true;
      requestAnimationFrame(renderFrame);
    }

    function processGaze(data) {
      if (!data) return;

      const rawX = data.x;
      const rawY = data.y;
      rawGazeX = rawX;
      rawGazeY = rawY;

      if (smoothedGazeX !== null && smoothedGazeY !== null) {
        const instVelocity = Math.hypot(rawX - smoothedGazeX, rawY - smoothedGazeY);

        if (instVelocity > 180 && !isSaccadeLocked) {
          isSaccadeLocked = true;
          smoothedGazeX = rawX;
          smoothedGazeY = rawY;
          clearTimeout(saccadeFreezeTimer);
          saccadeFreezeTimer = setTimeout(() => {
            isSaccadeLocked = false;
          }, 350);
        } else if (!isSaccadeLocked) {
          smoothedGazeX += (rawX - smoothedGazeX) * smoothingFactor;
          smoothedGazeY += (rawY - smoothedGazeY) * smoothingFactor;
        }
      } else {
        smoothedGazeX = rawX;
        smoothedGazeY = rawY;
      }

      const residualCorrected = applyAdaptiveResiduals(smoothedGazeX, smoothedGazeY);
      const perKeyCorrected = correctRawGaze(smoothedGazeX, smoothedGazeY);

      correctedGaze = {
        x: perKeyCorrected.x,
        y: perKeyCorrected.y
      };

      if (handleHomeReset(correctedGaze.x, correctedGaze.y)) {
        return;
      }

      doSelectionAt(correctedGaze.x, correctedGaze.y);
      scheduleRender();
    }

    function gazeTickListener(data) {
      // keep this cheap; do not do heavy work here
      processGaze(data);
    }

    window.onload = async function() {
      if (!window.saveDataAcrossSessions) {
        localforage.setItem("webgazerGlobalData", null);
        localforage.setItem("webgazerGlobalSettings", null);
      }

      rebuildKeyboard();

      const webgazerInstance = await webgazer.setRegression("ridge")
        .setTracker("TFFacemesh")
        .begin();

      webgazerInstance.showVideoPreview(true)
        .showPredictionPoints(false)
        .applyKalmanFilter(true);

      webgazer.setGazeListener(gazeTickListener);
      startCalibration("9zone");
    };

    let saccadeFreezeTimer = null;
    let isSaccadeLocked = false;
  </script>
</body>
</html>
