    }
</script>

<script>
    let smoothedGazeX = null;
    let smoothedGazeY = null;

    function triggerSelection(target) {
        const clickable = target.closest
            ? (target.closest('button, a, input, [role="button"], .q-btn, .grid-item') || target)
            : target;

        const rect = clickable.getBoundingClientRect();
        const clientX = rect.left + rect.width / 2;
        const clientY = rect.top + rect.height / 2;

        if (typeof webgazer !== 'undefined' && webgazer.recordScreenPosition) {
            webgazer.recordScreenPosition(clientX, clientY, 'click');
        }

        clickable.dispatchEvent(new MouseEvent('mousedown', {
            bubbles: true,
            cancelable: true,
            clientX,
            clientY,
            button: 0,
            buttons: 1
        }));

        clickable.dispatchEvent(new MouseEvent('mouseup', {
            bubbles: true,
            cancelable: true,
            clientX,
            clientY,
            button: 0,
            buttons: 0
        }));

        clickable.dispatchEvent(new MouseEvent('click', {
            bubbles: true,
            cancelable: true,
            clientX,
            clientY,
            button: 0,
            buttons: 0
        }));

        if (typeof clickable.click === 'function') {
            clickable.click();
        }
    }

    function resetGazeTarget() {
        const active = document.querySelector('.gaze-active-target');
        if (active) active.classList.remove('gaze-active-target');
        window.__gazeActiveTarget = null;
        window.__gazeDwellStart = 0;
    }

    function smoothGaze(rawX, rawY) {
        if (smoothedGazeX === null || smoothedGazeY === null) {
            smoothedGazeX = rawX;
            smoothedGazeY = rawY;
            return { x: rawX, y: rawY };
        }

        const smoothing = 0.7;
        smoothedGazeX += (rawX - smoothedGazeX) * smoothing;
        smoothedGazeY += (rawY - smoothedGazeY) * smoothing;
        return { x: smoothedGazeX, y: smoothedGazeY };
    }

    function initGridGazeDwell() {
        const checkInterval = setInterval(async () => {
            if (typeof webgazer === 'undefined') return;
            clearInterval(checkInterval);

            try {
                await webgazer.begin();
                webgazer.showVideoPreview(false);
                webgazer.showPredictionPoints(false);
                webgazer.showFaceOverlay(false);
                webgazer.applyKalmanFilter(true);

                webgazer.setGazeListener((data) => {
                    if (!data) return;

                    const smoothed = smoothGaze(data.x, data.y);
                    const x = smoothed.x;
                    const y = smoothed.y;

                    const elementUnderGaze = document.elementFromPoint(x, y);
                    const interactive = elementUnderGaze && elementUnderGaze.closest
                        ? elementUnderGaze.closest('.grid-item, button, [role="button"], .q-btn, a, input')
                        : null;

                    if (!interactive) {
                        resetGazeTarget();
                        return;
                    }

                    if (window.__gazeActiveTarget !== interactive) {
                        const oldTarget = document.querySelector('.gaze-active-target');
                        if (oldTarget) oldTarget.classList.remove('gaze-active-target');

                        window.__gazeActiveTarget = interactive;
                        interactive.classList.add('gaze-active-target');
                        window.__gazeDwellStart = performance.now();
                        return;
                    }

                    if (performance.now() - window.__gazeDwellStart >= 1000) {
                        triggerSelection(interactive);
                        resetGazeTarget();
                    }
                });

            } catch (err) {
                console.error("WebGazer init error:", err);
            }
        }, 200);
    }

    initGridGazeDwell();
</script>
