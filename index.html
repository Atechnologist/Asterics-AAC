                            : RegExp(String(search).replace(/[.^$*+?()[{|\\\\]/g, "\\$&"), "g"),

    <script>
    function initializeAstericsGaze() {
        'use strict';

        const SETTINGS_KEY = 'asterics-gaze-settings-v3';
        const RANGE_KEY = 'asterics-gaze-range-v2';
        const MODE_KEY = 'asterics-gaze-mode-v1';
        const JOYSTICK_REPEAT_DELAY_MS = 1200;

        // Blink & eye-loss guard thresholds
        const EAR_CLOSED_THRESHOLD = 0.19;
        const BLINK_FREEZE_MAX_MS = 450;
        const LONG_BLINK_MIN_MS = 500;
        const LONG_BLINK_MAX_MS = 1100;
        const EYE_LOSS_TIMEOUT_MS = 1100;

        const DEFAULTS = {
            dwellMs: 900,
            repeatDelayMs: 1200,
            longBlinkEnabled: false,
            smoothing: 0.65,
            switchHysteresisMs: 100,
            minStableSamples: 4,
            processingIntervalMs: 50,
            mapRefreshIntervalMs: 5000,
            joystickThreshold: 0.38,
            headCompGain: 0.8,
            offsetX: 0,
            offsetY: 0
        };

        const TUNING = { ...DEFAULTS };

        let activeCells = [];
        let cachedGridBounds = null;
        let gazeRange = null;
        let interactionMode = 'direct';
        let calibrationDone = false;
        let gazeLoopStarted = false;
        let gazeX = null;
        let gazeY = null;
        let lastGazeAt = 0;
        let smoothedRawGazeX = null;
        let smoothedRawGazeY = null;
        let recentGaze = [];
        let gazeState = null;
        let spatialMapObserver = null;
        let spatialMapResizeObserver = null;
        let spatialMapUpdateTimer = null;
        let recenterOffset = { x: 0, y: 0 };
        let latestHeadPose = null;
        let latestGazeSample = null;
        let activeHeadPoseCapture = null;
        let headPoseModel = null;
        let baselineHeadPose = null;
        let smoothedHeadOffset = { x: 0, y: 0 };
        let headPoseReadWarningLogged = false;
        let lastJoystickStepAt = 0;
        let smoothJoyDx = 0;
        let smoothJoyDy = 0;
        let joystickSelectCooldownUntil = 0;
        let joystickHudRefs = null;

        // Blink, long-blink & eye-loss tracking state
        let eyesClosedSince = 0;
        let faceMissingSince = 0;
        let isBlinkingOrLost = false;
        let dwellPausedAt = 0;
        let lastSelectedTarget = null;
        let lastSelectedAt = 0;

        function loadSettings() {
            try {
                const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
                Object.keys(DEFAULTS).forEach(key => {
                    if (typeof DEFAULTS[key] === 'boolean') {
                        if (typeof saved[key] === 'boolean') TUNING[key] = saved[key];
                        return;
                    }
                    const value = Number(saved[key]);
                    if (Number.isFinite(value)) TUNING[key] = value;
                });
                const savedMode = localStorage.getItem(MODE_KEY);
                if (savedMode === 'grouped' || savedMode === 'direct' || savedMode === 'joystick') {
                    interactionMode = savedMode;
                }
            } catch (error) {
                console.warn('Could not load gaze settings:', error);
            }
        }

        function saveSettings() {
            try {
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(TUNING));
            } catch (error) {
                console.warn('Could not save gaze settings:', error);
            }
        }

        function loadRange() {
            try {
                const saved = JSON.parse(localStorage.getItem(RANGE_KEY) || 'null');
                if (
                    saved &&
                    Number.isFinite(saved.minX) &&
                    Number.isFinite(saved.maxX) &&
                    Number.isFinite(saved.minY) &&
                    Number.isFinite(saved.maxY) &&
                    Number.isFinite(saved.centerX) &&
                    Number.isFinite(saved.centerY) &&
                    saved.maxX - saved.minX >= 40 &&
                    saved.maxY - saved.minY >= 40
                ) {
                    gazeRange = saved;
                }
            } catch (error) {
                console.warn('Could not load comfort range:', error);
                gazeRange = null;
            }
        }

        function saveRange() {
            try {
                if (gazeRange) {
                    localStorage.setItem(RANGE_KEY, JSON.stringify(gazeRange));
                } else {
                    localStorage.removeItem(RANGE_KEY);
                }
            } catch (error) {
                console.warn('Could not save comfort range:', error);
            }
        }

        function getEyeOpenness(positions) {
            if (!Array.isArray(positions) || positions.length < 387) return null;

            const p159 = positions[159];
            const p145 = positions[145];
            const p33 = positions[33];
            const p133 = positions[133];
            const p386 = positions[386];
            const p374 = positions[374];
            const p362 = positions[362];
            const p263 = positions[263];

            if (!p159 || !p145 || !p33 || !p133 || !p386 || !p374 || !p362 || !p263) {
                return null;
            }

            const leftVert = Math.hypot(p159[0] - p145[0], p159[1] - p145[1]);
            const leftHoriz = Math.hypot(p33[0] - p133[0], p33[1] - p133[1]);
            const rightVert = Math.hypot(p386[0] - p374[0], p386[1] - p374[1]);
            const rightHoriz = Math.hypot(p362[0] - p263[0], p362[1] - p263[1]);

            if (leftHoriz < 5 || rightHoriz < 5) return null;

            const ear = ((leftVert / leftHoriz) + (rightVert / rightHoriz)) / 2;
            return Number.isFinite(ear) ? ear : null;
        }

        function readFaceMetrics() {
            try {
                if (window.webgazer && typeof window.webgazer.getTracker === 'function') {
                    const tracker = window.webgazer.getTracker();
                    if (tracker && typeof tracker.getPositions === 'function') {
                        const positions = tracker.getPositions();
                        if (!Array.isArray(positions) || positions.length < 455) {
                            return { pose: null, ear: null };
                        }

                        const ear = getEyeOpenness(positions);
                        const leftCheek = positions[234];
                        const rightCheek = positions[454];
                        if (
                            !leftCheek ||
                            !rightCheek ||
                            !Number.isFinite(leftCheek[0]) ||
                            !Number.isFinite(leftCheek[1]) ||
                            !Number.isFinite(rightCheek[0]) ||
                            !Number.isFinite(rightCheek[1])
                        ) {
                            return { pose: null, ear };
                        }

                        const width = Math.hypot(rightCheek[0] - leftCheek[0], rightCheek[1] - leftCheek[1]);
                        if (width < 20) return { pose: null, ear };

                        return {
                            pose: {
                                centerX: (leftCheek[0] + rightCheek[0]) / 2,
                                centerY: (leftCheek[1] + rightCheek[1]) / 2,
                                width,
                                roll: Math.atan2(rightCheek[1] - leftCheek[1], rightCheek[0] - leftCheek[0])
                            },
                            ear
                        };
                    }
                }
            } catch (error) {
                if (!headPoseReadWarningLogged) {
                    console.warn('Could not read FaceMesh landmarks:', error);
                    headPoseReadWarningLogged = true;
                }
            }
            return { pose: null, ear: null };
        }

        function getCurrentHeadPose() {
            return readFaceMetrics().pose;
        }

        function evaluateEyeState(metrics, now) {
            if (!metrics || !metrics.pose) {
                eyesClosedSince = 0;
                if (!faceMissingSince) faceMissingSince = now;
                if (now - faceMissingSince >= EYE_LOSS_TIMEOUT_MS) {
                    return 'eye-loss';
                }
                return 'blink';
            }

            faceMissingSince = 0;

            if (typeof metrics.ear === 'number' && metrics.ear < EAR_CLOSED_THRESHOLD) {
                if (!eyesClosedSince) eyesClosedSince = now;
                const closedDuration = now - eyesClosedSince;
                return closedDuration > EYE_LOSS_TIMEOUT_MS ? 'eye-loss' : 'blink';
            }

            const closedDuration = eyesClosedSince > 0 ? (now - eyesClosedSince) : 0;
            eyesClosedSince = 0;

            if (
                closedDuration >= LONG_BLINK_MIN_MS &&
                closedDuration <= LONG_BLINK_MAX_MS
            ) {
                return 'long-blink-release';
            }

            return 'open';
        }

        function pauseDwellForBlinkOrLoss(state, now) {
            if (!state) return;
            if (!dwellPausedAt) {
                dwellPausedAt = now;
            }
        }

        function resumeDwellAfterBlinkOrLoss(state, now) {
            if (!dwellPausedAt) return;
            const pausedDuration = now - dwellPausedAt;
            if (state) {
                if (state.dwellStartedAt > 0) state.dwellStartedAt += pausedDuration;
                if (state.pendingAt > 0) state.pendingAt += pausedDuration;
                if (state.pendingGroupLastSeen > 0) state.pendingGroupLastSeen += pausedDuration;
            }
            dwellPausedAt = 0;
        }

        function canSelectElement(element, now) {
            if (!element) return false;
            if (lastSelectedTarget === element && (now - lastSelectedAt) < TUNING.repeatDelayMs) {
                return false;
            }
            return true;
        }

        function activateGazeTarget(element, state, now) {
            if (!canSelectElement(element, now)) return false;
            if (!triggerSelection(element)) return false;

            lastSelectedTarget = element;
            lastSelectedAt = now;
            if (state) {
                state.selectedTarget = element;
                state.dwellStartedAt = now;
            }
            return true;
        }

        function resetHeadPoseBaseline() {
            baselineHeadPose = getCurrentHeadPose();
            smoothedHeadOffset = { x: 0, y: 0 };
            smoothJoyDx = 0;
            smoothJoyDy = 0;
            joystickSelectCooldownUntil = 0;
        }

        function clearHeadPoseModel() {
            headPoseModel = null;
            baselineHeadPose = null;
            smoothedHeadOffset = { x: 0, y: 0 };
            smoothJoyDx = 0;
            smoothJoyDy = 0;
            joystickSelectCooldownUntil = 0;
        }

        function median(values) {
            const sorted = values.slice().sort((a, b) => a - b);
            const middle = Math.floor(sorted.length / 2);
            return sorted.length % 2
                ? sorted[middle]
                : (sorted[middle - 1] + sorted[middle]) / 2;
        }

        function fitHeadPoseAxis(negativeSamples, positiveSamples, deltaKey, residualKey) {
            const negativeDelta = median(negativeSamples.map(sample => sample[deltaKey]));
            const positiveDelta = median(positiveSamples.map(sample => sample[deltaKey]));
            if (
                negativeDelta * positiveDelta >= 0 ||
                Math.min(Math.abs(negativeDelta), Math.abs(positiveDelta)) < 0.025
            ) return null;

            const samples = negativeSamples.concat(positiveSamples);
            const deltas = samples.map(sample => sample[deltaKey]);
            const residuals = samples.map(sample => sample[residualKey]);
            const denominator = deltas.reduce((sum, value) => sum + value * value, 0);
            if (denominator < 0.0005) return null;

            const gain = deltas.reduce((sum, value, index) => sum + value * residuals[index], 0) / denominator;
            const beforeError = residuals.reduce((sum, value) => sum + value * value, 0);
            const afterError = residuals.reduce((sum, value, index) => {
                const error = value - gain * deltas[index];
                return sum + error * error;
            }, 0);
            const confidence = beforeError > 0
                ? 1 - (afterError / beforeError)
                : 0;
            const maxDelta = Math.max(Math.abs(deltas[0]), Math.abs(deltas[1]));

            if (
                !Number.isFinite(gain) ||
                Math.sqrt(beforeError / samples.length) < 8 ||
                confidence < 0.2
            ) return null;

            return { gain, maxDelta, confidence };
        }

        function computeHeadPoseCorrection() {
            if (!headPoseModel || !TUNING.headCompGain || TUNING.headCompGain <= 0) {
                smoothedHeadOffset = { x: 0, y: 0 };
                return { x: 0, y: 0 };
            }

            const current = latestHeadPose || getCurrentHeadPose();
            if (!current) {
                smoothedHeadOffset.x *= 0.5;
                smoothedHeadOffset.y *= 0.5;
                return smoothedHeadOffset;
            }

            if (!baselineHeadPose) {
                baselineHeadPose = current;
                return { x: 0, y: 0 };
            }

            const deltaX = (current.centerX - baselineHeadPose.centerX) / baselineHeadPose.width;
            const deltaY = (current.centerY - baselineHeadPose.centerY) / baselineHeadPose.width;
            const maxCorrectionPx = 40;
            const targetX = headPoseModel.gainX !== null &&
                headPoseModel.confidenceX >= 0.2 &&
                Math.abs(deltaX) <= headPoseModel.maxDeltaX * 1.25 + 0.01
                ? Math.max(-maxCorrectionPx, Math.min(maxCorrectionPx, headPoseModel.gainX * deltaX * TUNING.headCompGain))
                : 0;
            const targetY = headPoseModel.gainY !== null &&
                headPoseModel.confidenceY >= 0.2 &&
                Math.abs(deltaY) <= headPoseModel.maxDeltaY * 1.25 + 0.01
                ? Math.max(-maxCorrectionPx, Math.min(maxCorrectionPx, headPoseModel.gainY * deltaY * TUNING.headCompGain))
                : 0;

            smoothedHeadOffset.x = smoothedHeadOffset.x * 0.75 + targetX * 0.25;
            smoothedHeadOffset.y = smoothedHeadOffset.y * 0.75 + targetY * 0.25;

        function updateSpatialMap() {

            for (let i = 0; i < elements.length; i++) {

                if (!element.isConnected || element.closest('[inert]')) continue;

                const rect = element.getBoundingClientRect();
                if (rect.width <= 0 || rect.height <= 0) continue;

                const style = window.getComputedStyle(element);
                if (style.display === 'none' || style.visibility === 'hidden') continue;

                if (rect.left < minLeft) minLeft = rect.left;
                if (rect.top < minTop) minTop = rect.top;
                if (rect.right > maxRight) maxRight = rect.right;
                if (rect.bottom > maxBottom) maxBottom = rect.bottom;

                nextCells.push({
                    element,
                    left: rect.left,
                    top: rect.top,
                    right: rect.right,
                    bottom: rect.bottom,
                    area: rect.width * rect.height,
                    centerX: (rect.left + rect.right) / 2,
                    centerY: (rect.top + rect.bottom) / 2

                bottom: Math.max(bounds.bottom, cell.bottom)

                right: -Infinity,

            const totalOffsetY = (TUNING.offsetY || 0) + recenterOffset.y;

            if (!gazeRange) return { x: x + totalOffsetX, y: y + totalOffsetY };

            const bounds = getGridBounds();
            if (!bounds) return { x: x + totalOffsetX, y: y + totalOffsetY };

            const sourceWidth = gazeRange.maxX - gazeRange.minX;
            const sourceHeight = gazeRange.maxY - gazeRange.minY;
            const gridWidth = bounds.right - bounds.left;
            const gridHeight = bounds.bottom - bounds.top;

            if (sourceWidth < 40 || sourceHeight < 40 || gridWidth <= 0 || gridHeight <= 0) {

            if (!bounds) return { x: mapped.x + headCorrection.x, y: mapped.y + headCorrection.y };

                    y <= cell.bottom

            const sign = direction === 'left' || direction === 'up' ? -1 : 1;
            const currentSpan = horizontal
                ? Math.max(40, current.bottom - current.top)
                : Math.max(40, current.right - current.left);

            let best = null;
            let bestScore = Infinity;

            for (const cell of activeCells) {

                const primary = horizontal
                    ? (cell.centerX - current.centerX) * sign
                    : (cell.centerY - current.centerY) * sign;

                if (primary <= 4) continue;

                const perpendicular = horizontal
                    ? Math.abs(cell.centerY - current.centerY)
                    : Math.abs(cell.centerX - current.centerX);

                const alignmentPenalty = perpendicular > currentSpan * 0.85 ? perpendicular * 8 : perpendicular * 3.5;
                const score = alignmentPenalty + primary * 0.2;

                if (score < bestScore) {
                    best = cell;
                    bestScore = score;
                }

            }

            const middleX = (bounds.left + bounds.right) / 2;
            const middleY = (bounds.top + bounds.bottom) / 2;
            let horizontal = x < middleX ? 'left' : 'right';
            let vertical = y < middleY ? 'top' : 'bottom';

                const verticalBuffer = Math.max(20, Math.min(50, (bounds.bottom - bounds.top) * 0.06));

                    horizontal = preferredHorizontal;
                }
                if (vertical !== preferredVertical && Math.abs(y - middleY) < verticalBuffer) {
                    vertical = preferredVertical;
                }

            const pointGroup = `${vertical}-${horizontal}`;
            if (activeCells.some(cell => getCellGroupForCell(cell, bounds) === pointGroup)) {
                return pointGroup;

            activeCells.forEach(cell => {
                const groupKey = getCellGroupForCell(cell, bounds);
                const center = groupCenters.get(groupKey) || { x: 0, y: 0, count: 0 };
                center.x += cell.centerX;
                center.y += cell.centerY;
                center.count++;
                groupCenters.set(groupKey, center);

            let nearestGroup = null;
            let nearestDistance = Infinity;
            groupCenters.forEach((center, groupKey) => {
                const distance = Math.hypot(
                    x - center.x / center.count,
                    y - center.y / center.count

                if (distance < nearestDistance) {
                    nearestGroup = groupKey;
                    nearestDistance = distance;

                    if (distance <= toleranceRadius) {
                        if (!dwellStartTime) {
                            dwellStartTime = performance.now();
                        }
                        const elapsed = performance.now() - dwellStartTime;
                        const progress = Math.min(100, (elapsed / dwellRequiredMs) * 100);
                        progressBar.style.width = `${progress}%`;
                        progressBar.style.height = `${progress}%`;

                        if (elapsed >= dwellRequiredMs) {
                            recordPoint(targetCenterX, targetCenterY);
                            requestAnimationFrame(checkDwell);
                            return;
                        }
                    } else {
                        dwellStartTime = null;
                        progressBar.style.width = '0%';
                        progressBar.style.height = '0%';
                    }
                }

                requestAnimationFrame(checkDwell);
            }

            showPoint();
            requestAnimationFrame(checkDwell);
        }

            document.body.appendChild(overlay);

            const prompt = overlay.querySelector('#gaze-head-calibration-prompt');
            const status = overlay.querySelector('#gaze-head-calibration-status');
            const cancelButton = overlay.querySelector('button');
            const hud = overlay.querySelector('#gaze-head-hud');
            const targetZone = overlay.querySelector('#hud-target-zone');
            const liveHeadDot = overlay.querySelector('#hud-live-head');
            const progressCircle = overlay.querySelector('#hud-progress-circle');
            const arrows = {
                up: overlay.querySelector('#hud-arrow-up'),
                down: overlay.querySelector('#hud-arrow-down'),
                left: overlay.querySelector('#hud-arrow-left'),
                right: overlay.querySelector('#hud-arrow-right')
            };

            const settingsToggle = document.getElementById('gaze-settings-toggle');
            if (settingsToggle) settingsToggle.disabled = true;

            const bounds = getGridBounds();
            const centerX = bounds ? (bounds.left + bounds.right) / 2 : window.innerWidth / 2;
            const centerY = bounds ? (bounds.top + bounds.bottom) / 2 : window.innerHeight / 2;
            hud.style.left = `${centerX}px`;
            hud.style.top = `${centerY}px`;

            const phases = [
                { dir: 'neutral', targetDx: 0, targetDy: 0, instruction: 'Keep eyes on the cyan dot. Hold head in center ring.' },
                { dir: 'left',    targetDx: -36, targetDy: 0, instruction: 'Keep eyes on the cyan dot. Shift head gently LEFT into the ring.' },
                { dir: 'right',   targetDx: 36,  targetDy: 0, instruction: 'Keep eyes on the cyan dot. Shift head gently RIGHT into the ring.' },
                { dir: 'up',      targetDx: 0, targetDy: -36, instruction: 'Keep eyes on the cyan dot. Shift head gently UP into the ring.' },
                { dir: 'down',    targetDx: 0, targetDy: 36,  instruction: 'Keep eyes on the cyan dot. Shift head gently DOWN into the ring.' },
                { dir: 'neutral', targetDx: 0, targetDy: 0, instruction: 'Keep eyes on the cyan dot. Return head to center ring.' }
            ];

            const settleMs = 1100;
            const captureMs = 1800;
            const circumference = 2 * Math.PI * 26;
            let phaseIndex = 0;
            let phaseStartedAt = performance.now();
            let phaseAttempts = 0;
            let isFinished = false;
            let phaseData = [];
            let visualNeutralPose = null;

            function updateVisualHud(phase, progressRatio) {
                Object.keys(arrows).forEach(key => {
                    const isActive = phase.dir === key;
                    arrows[key].style.opacity = isActive ? '1' : '0.12';
                    arrows[key].style.transform = key === 'up' || key === 'down'
                        ? `translateX(-50%) scale(${isActive ? 1.25 : 1})`
                        : `translateY(-50%) scale(${isActive ? 1.25 : 1})`;
                });

                targetZone.style.left = `calc(50% + ${phase.targetDx}px)`;
                targetZone.style.top = `calc(50% + ${phase.targetDy}px)`;

                const offset = circumference * (1 - Math.max(0, Math.min(1, progressRatio)));
                progressCircle.style.strokeDashoffset = String(offset);

                const pose = latestHeadPose || getCurrentHeadPose();
                if (pose) {
                    if (!visualNeutralPose) {
                        visualNeutralPose = { centerX: pose.centerX, centerY: pose.centerY, width: pose.width };
                    }
                    const normDx = -((pose.centerX - visualNeutralPose.centerX) / visualNeutralPose.width);
                    const normDy = (pose.centerY - visualNeutralPose.centerY) / visualNeutralPose.width;
                    const pxX = Math.max(-68, Math.min(68, normDx * 550));
                    const pxY = Math.max(-68, Math.min(68, normDy * 550));

                    liveHeadDot.style.left = `calc(50% + ${pxX}px)`;
                    liveHeadDot.style.top = `calc(50% + ${pxY}px)`;

                    const distToTarget = Math.hypot(pxX - phase.targetDx, pxY - phase.targetDy);
                    if (distToTarget <= 22) {
                        liveHeadDot.style.borderColor = '#00ffcc';
                        liveHeadDot.style.background = 'rgba(0, 255, 204, 0.32)';
                        targetZone.style.borderColor = '#00ffcc';
                        targetZone.style.borderStyle = 'solid';
                    } else {
                        liveHeadDot.style.borderColor = '#ffc857';
                        liveHeadDot.style.background = 'rgba(255, 200, 87, 0.18)';
                        targetZone.style.borderColor = 'rgba(255,255,255,0.5)';
                        targetZone.style.borderStyle = 'dashed';
                    }
                }
            }

            function complete(message) {
                if (isFinished) return;
                isFinished = true;
                activeHeadPoseCapture = null;
                if (settingsToggle) settingsToggle.disabled = false;
                status.textContent = message;
                window.setTimeout(() => {
                    overlay.remove();
                    if (typeof onComplete === 'function') onComplete();
                }, 1400);
            }

            function beginPhase(now) {
                phaseStartedAt = now;
                phaseAttempts = 0;
                activeHeadPoseCapture = { collecting: false, samples: [] };
                const phase = phases[phaseIndex];
                prompt.textContent = `(${phaseIndex + 1}/${phases.length}) ${phase.instruction}`;
                status.textContent = 'Move the yellow head ring into the dashed target ring…';
                updateVisualHud(phase, 0);
            }

            function summarizePhase(samples) {
                if (samples.length < 8) return null;

                const midpoint = Math.floor(samples.length / 2);
                const halves = [samples.slice(0, midpoint), samples.slice(midpoint)];
                const summarizeSamples = group => ({
                    pose: {
                        centerX: median(group.map(sample => sample.pose.centerX)),
                        centerY: median(group.map(sample => sample.pose.centerY)),
                        width: median(group.map(sample => sample.pose.width)),
                        roll: median(group.map(sample => sample.pose.roll))
                    },
                    gazeX: median(group.map(sample => sample.x)),
                    gazeY: median(group.map(sample => sample.y)),
                    mappedX: median(group.map(sample => sample.mappedX)),
                    mappedY: median(group.map(sample => sample.mappedY))
                });
                const observations = halves.map(summarizeSamples);
                const centerFaceX = median(samples.map(sample => sample.pose.centerX));
                const centerFaceY = median(samples.map(sample => sample.pose.centerY));
                const faceWidth = median(samples.map(sample => sample.pose.width));
                const gazeX = median(samples.map(sample => sample.x));
                const gazeY = median(samples.map(sample => sample.y));
                const poseSpread = median(samples.map(sample =>
                    Math.hypot(
                        (sample.pose.centerX - centerFaceX) / faceWidth,
                        (sample.pose.centerY - centerFaceY) / faceWidth
                    )
                ));
                const gazeSpread = median(samples.map(sample =>
                    Math.hypot(sample.x - gazeX, sample.y - gazeY)
                ));

                if (poseSpread > 0.06 || gazeSpread > 120 || Math.hypot(gazeX - centerX, gazeY - centerY) > 250) {
                    return null;
                }

                return {
                    pose: {
                        centerX: centerFaceX,
                        centerY: centerFaceY,
                        width: faceWidth,
                        roll: median(samples.map(sample => sample.pose.roll))
                    },
                    gazeX,
                    gazeY,
                    mappedX: median(samples.map(sample => sample.mappedX)),
                    mappedY: median(samples.map(sample => sample.mappedY)),
                    targetX: centerX,
                    targetY: centerY,
                    observations
                };
            }

            function capturePhase(now) {
                const summary = summarizePhase(activeHeadPoseCapture.samples);
                if (!summary) {
                    phaseAttempts++;
                    if (phaseAttempts <= 2) {
                        status.textContent = 'Hold steady in the target ring while looking at the dot; retrying…';
                        activeHeadPoseCapture = { collecting: false, samples: [] };
                        phaseStartedAt = now;
                        return;
                    }
                    complete('Stable readings were unavailable. Head-shift correction was not changed.');
                    return;
                }

                if (phaseIndex === 0) {
                    visualNeutralPose = summary.pose;
                }

                phaseData.push(summary);
                phaseIndex++;
                if (phaseIndex < phases.length) {
                    beginPhase(now);
                    return;
                }

                const neutral = phaseData[0];
                const finalNeutral = phaseData[5];
                const returnDeltaX = (finalNeutral.pose.centerX - neutral.pose.centerX) / neutral.pose.width;
                const returnDeltaY = (finalNeutral.pose.centerY - neutral.pose.centerY) / neutral.pose.width;
                const widthRatio = finalNeutral.pose.width / neutral.pose.width;
                if (
                    Math.abs(returnDeltaX) > 0.08 ||
                    Math.abs(returnDeltaY) > 0.08 ||
                    widthRatio < 0.85 ||
                    widthRatio > 1.15
                ) {
                    complete('Neutral return position drifted too far. No head-shift correction was saved.');
                    return;
                }
                const hasUnmodeledPoseChange = phaseData.slice(1, 5).some(phase => {
                    const phaseWidthRatio = phase.pose.width / neutral.pose.width;
                    const rollDelta = Math.atan2(
                        Math.sin(phase.pose.roll - neutral.pose.roll),
                        Math.cos(phase.pose.roll - neutral.pose.roll)
                    );
                    return phaseWidthRatio < 0.85 || phaseWidthRatio > 1.15 || Math.abs(rollDelta) > 0.12;
                });
                if (hasUnmodeledPoseChange) {
                    complete('Head tilted or leaned too much. Shift sideways/up/down without turning or leaning.');
                    return;
                }

                const getResidualPairs = phase => phase.observations.map(observation => ({
                    deltaX: (observation.pose.centerX - neutral.pose.centerX) / neutral.pose.width,
                    deltaY: (observation.pose.centerY - neutral.pose.centerY) / neutral.pose.width,
                    residualX: (phase.targetX - observation.mappedX) - (neutral.targetX - neutral.mappedX),
                    residualY: (phase.targetY - observation.mappedY) - (neutral.targetY - neutral.mappedY)
                }));
                const horizontal = fitHeadPoseAxis(
                    getResidualPairs(phaseData[1]),
                    getResidualPairs(phaseData[2]),
                    'deltaX',
                    'residualX'
                );
                const vertical = fitHeadPoseAxis(
                    getResidualPairs(phaseData[3]),
                    getResidualPairs(phaseData[4]),
                    'deltaY',
                    'residualY'
                );

                if (!horizontal && !vertical) {
                    complete('No reliable head-shift relationship was measured. Tracking remains unchanged.');
                    return;
                }

                headPoseModel = {
                    gainX: horizontal ? horizontal.gain : null,
                    gainY: vertical ? vertical.gain : null,
                    maxDeltaX: horizontal ? horizontal.maxDelta : 0,
                    maxDeltaY: vertical ? vertical.maxDelta : 0,
                    confidenceX: horizontal ? horizontal.confidence : 0,
                    confidenceY: vertical ? vertical.confidence : 0
                };
                baselineHeadPose = finalNeutral.pose;
                smoothedHeadOffset = { x: 0, y: 0 };
                const calibratedAxes = [
                    horizontal ? 'horizontal' : null,
                    vertical ? 'vertical' : null
                ].filter(Boolean);
                complete(`Saved confidence-gated ${calibratedAxes.join(' and ')} head-shift correction.`);
            }

            function animate(now) {
                if (isFinished || !overlay.isConnected) return;
                const phase = phases[phaseIndex];
                const elapsed = now - phaseStartedAt;

                if (elapsed < settleMs) {
                    updateVisualHud(phase, 0);
                } else {
                    if (!activeHeadPoseCapture.collecting) {
                        activeHeadPoseCapture.collecting = true;
                        status.textContent = 'Hold still! Recording…';
                    }
                    const captureProgress = (elapsed - settleMs) / captureMs;
                    updateVisualHud(phase, captureProgress);
                }

                if (elapsed >= settleMs + captureMs) {
                    capturePhase(now);
                    if (isFinished) return;
                }
                requestAnimationFrame(animate);
            }

            cancelButton.addEventListener('click', () => {
                if (!isFinished) {
                    isFinished = true;
                    activeHeadPoseCapture = null;
                    if (settingsToggle) settingsToggle.disabled = false;
                    overlay.remove();
                    if (typeof onComplete === 'function') onComplete();
                }
            });

            beginPhase(phaseStartedAt);
            requestAnimationFrame(animate);
        }

        function createCenterRecenterOverlay() {
            const previous = document.getElementById('gaze-recenter-overlay');
            if (previous) previous.remove();

            const overlay = document.createElement('div');
            overlay.id = 'gaze-recenter-overlay';
            overlay.style.cssText = [
                'position:fixed',
                'inset:0',
                'z-index:1000001',
                'display:flex',
                'flex-direction:column',
                'align-items:center',
                'justify-content:center',
                'background:rgba(0,0,0,.75)',
                'color:white',
                'font:16px sans-serif',
                'text-align:center'
            ].join(';');
            overlay.innerHTML = `
                <p style="max-width:520px;margin:0 16px 24px;line-height:1.5">
                    Look at the center dot and hold your gaze steady. Tracking will recenter
                    automatically when the readings are stable.
                </p>
                <div aria-hidden="true" style="position:fixed;left:50%;top:50%;width:28px;height:28px;
                    transform:translate(-50%,-50%);border:3px solid white;border-radius:50%;
                    background:#00ffcc;box-shadow:0 0 24px #00ffcc"></div>
                <p id="gaze-recenter-status" style="margin-top:42px;color:#00ffcc;font-weight:bold">
                    Collecting steady gaze readings…
                </p>
                <button type="button" style="margin-top:12px;padding:8px 16px;cursor:pointer">Cancel</button>
            `;
            document.body.appendChild(overlay);
            recentGaze = [];

            const status = overlay.querySelector('#gaze-recenter-status');
            overlay.querySelector('button').addEventListener('click', () => overlay.remove());

            function checkStability() {
                if (!overlay.isConnected) return;

                const cutoff = performance.now() - 2000;
                const samples = recentGaze.filter(sample => sample.time >= cutoff);
                if (samples.length < 8) {
                    status.textContent = `Collecting steady gaze readings… ${samples.length}/8`;
                    window.setTimeout(checkStability, 200);
                    return;
                }

                const centerX = median(samples.map(sample => sample.x));
                const centerY = median(samples.map(sample => sample.y));
                const deviations = samples.map(sample =>
                    Math.hypot(sample.x - centerX, sample.y - centerY)
                );
                const typicalDeviation = median(deviations);
                const inliers = samples.filter((sample, index) =>
                    deviations[index] <= Math.max(35, typicalDeviation * 2.5)
                );

                if (typicalDeviation > 80 || inliers.length < Math.max(5, Math.ceil(samples.length * 0.6))) {
                    status.textContent = 'Readings are still moving. Keep looking at the center dot.';
                    window.setTimeout(checkStability, 200);
                    return;
                }

                const newCenterX = median(inliers.map(sample => sample.x));
                const newCenterY = median(inliers.map(sample => sample.y));
                if (gazeRange) {
                    const width = gazeRange.maxX - gazeRange.minX;
                    const height = gazeRange.maxY - gazeRange.minY;

                    gazeRange.centerX = newCenterX;
                    gazeRange.centerY = newCenterY;
                    gazeRange.minX = newCenterX - (width / 2);
                    gazeRange.maxX = newCenterX + (width / 2);
                    gazeRange.minY = newCenterY - (height / 2);
                    gazeRange.maxY = newCenterY + (height / 2);
                    saveRange();
                    recenterOffset = { x: 0, y: 0 };
                } else {
                    const bounds = getGridBounds();
                    const targetCenterX = bounds
                        ? (bounds.left + bounds.right) / 2
                        : window.innerWidth / 2;
                    const targetCenterY = bounds
                        ? (bounds.top + bounds.bottom) / 2
                        : window.innerHeight / 2;
                    recenterOffset = {
                        x: targetCenterX - newCenterX,
                        y: targetCenterY - newCenterY
                    };
                }

                resetHeadPoseBaseline();

                if (gazeState) {
                    clearHighlight(gazeState.activeTarget);
                    clearHighlight(gazeState.pendingTarget);
                    gazeState.activeTarget = null;
                    gazeState.pendingTarget = null;
                    gazeState.selectedTarget = null;
                    gazeState.dwellStartedAt = 0;
                    gazeState.pendingAt = 0;
                    gazeState.missingSince = 0;
                    gazeState.samples = 0;
                }

                gazeX = null;
                gazeY = null;
                status.textContent = 'Recentered. Continue using gaze.';
                window.setTimeout(() => overlay.remove(), 700);
            }

            window.setTimeout(checkStability, 200);
        }

        function createComfortRangeOverlay(onComplete) {
            const previous = document.getElementById('gaze-range-overlay');
            if (previous) previous.remove();

            const overlay = document.createElement('div');
            overlay.id = 'gaze-range-overlay';
            overlay.style.cssText = [
                'position:fixed',
                'inset:0',
                'z-index:999999',
                'display:flex',
                'flex-direction:column',
                'align-items:center',
                'justify-content:center',
                'background:rgba(10,10,10,.95)',
                'color:white',
                'font:16px sans-serif',
                'text-align:center'
            ].join(';');

            overlay.innerHTML = `
                <p style="max-width:560px;margin:0 16px 20px;color:#ccc;line-height:1.5">
                    Look toward each target only as far as is comfortable. Hold your gaze
                    steadily for 2 seconds, then click the target. Keep your head in your usual position.
                </p>
                <button id="gaze-range-target" type="button" aria-label="Comfort range target"
                    style="position:fixed;width:44px;height:44px;border:3px solid white;
                    border-radius:50%;background:#ff0055;box-shadow:0 0 24px #ff0055;
                    transform:translate(-50%,-50%);cursor:pointer"></button>
                <p id="gaze-range-status" style="color:white"></p>
            `;

            document.body.appendChild(overlay);

            const target = document.getElementById('gaze-range-target');
            const status = document.getElementById('gaze-range-status');

            const points = [
                { label: 'Top-left comfortable limit', x: 0.12, y: 0.18 },
                { label: 'Top-right comfortable limit', x: 0.88, y: 0.18 },
                { label: 'Bottom-right comfortable limit', x: 0.88, y: 0.82 },
                { label: 'Bottom-left comfortable limit', x: 0.12, y: 0.82 }
            ];

            const readings = [];
            let pointIndex = 0;

            function showPoint() {
                if (pointIndex >= points.length) {
                    const leftX = median([readings[0].x, readings[3].x]);
                    const rightX = median([readings[1].x, readings[2].x]);
                    const topY = median([readings[0].y, readings[1].y]);
                    const bottomY = median([readings[2].y, readings[3].y]);
                    const minX = Math.min(leftX, rightX);
                    const maxX = Math.max(leftX, rightX);
                    const minY = Math.min(topY, bottomY);
                    const maxY = Math.max(topY, bottomY);

                    if (maxX - minX < 40 || maxY - minY < 40) {
                        pointIndex = points.length - 1;
                        readings.length = pointIndex;
                        status.textContent = 'The measured range was too small. Please hold the bottom-left target steadily and capture it again.';
                        setTimeout(showPoint, 1600);
                        return;
                    }

                    gazeRange = {
                        minX,
                        maxX,
                        minY,
                        maxY,
                        centerX: (minX + maxX) / 2,
                        centerY: (minY + maxY) / 2
                    };

                    recenterOffset = { x: 0, y: 0 };
                    saveRange();
                    gazeX = null;
                    gazeY = null;
                    overlay.remove();

                    if (typeof onComplete === 'function') onComplete();
                    return;
                }

                const point = points[pointIndex];
                target.style.left = `${window.innerWidth * point.x}px`;
                target.style.top = `${window.innerHeight * point.y}px`;
                status.textContent = `${point.label} — point ${pointIndex + 1} of 4. Hold steady for 2 seconds, then click.`;

                recentGaze = [];
            }

            target.addEventListener('click', () => {
                const cutoff = performance.now() - 2000;
                const samples = recentGaze.filter(sample => sample.time >= cutoff);

                if (samples.length < 8) {
                    status.textContent = `Only ${samples.length} readings collected. Keep looking at the target for 2 seconds, then click again.`;
                    return;
                }

                const centerX = median(samples.map(sample => sample.x));
                const centerY = median(samples.map(sample => sample.y));
                const deviations = samples.map(sample =>
                    Math.hypot(sample.x - centerX, sample.y - centerY)
                );
                const typicalDeviation = median(deviations);
                const inliers = samples.filter((sample, index) =>
                    deviations[index] <= Math.max(35, typicalDeviation * 2.5)
                );

                if (typicalDeviation > 80 || inliers.length < Math.max(5, Math.ceil(samples.length * 0.6))) {
                    status.textContent = 'Gaze readings are moving too much. Hold your gaze steadily for 2 seconds, then click again.';
                    return;
                }

                readings.push({
                    x: median(inliers.map(sample => sample.x)),
                    y: median(inliers.map(sample => sample.y))
                });

                pointIndex++;
                showPoint();
            });

            showPoint();
        }

        function processDirectGaze(state, now) {
            const cell = findCell(gazeX, gazeY);
            const candidate = cell ? cell.element : null;

            if (!candidate) {
                clearHighlight(state.pendingTarget);
                clearHighlight(state.activeTarget);
                state.pendingTarget = null;
                state.pendingAt = 0;

                if (state.activeTarget && !state.missingSince) {
                    state.missingSince = now;
                }

                if (
                    state.activeTarget &&
                    state.missingSince &&
                    now - state.missingSince >= 350
                ) {
                    clearHighlight(state.activeTarget);
                    state.activeTarget = null;
                    state.selectedTarget = null;
                    state.dwellStartedAt = 0;
                    state.samples = 0;
                    state.missingSince = 0;
                }
                return;
            }

            state.missingSince = 0;

            if (candidate !== state.activeTarget) {
                if (state.pendingTarget !== candidate) {
                    clearHighlight(state.pendingTarget);
                    clearHighlight(state.activeTarget);
                    state.pendingTarget = candidate;
                    state.pendingAt = now;
                    highlight(candidate);
                    return;
                }

                if (now - state.pendingAt < TUNING.switchHysteresisMs) return;

                clearHighlight(state.activeTarget);
                state.activeTarget = candidate;
                state.selectedTarget = null;
                state.dwellStartedAt = now;
                state.samples = 1;
                state.pendingTarget = null;
                state.pendingAt = 0;
                highlight(candidate);
                return;
            }

            if (state.pendingTarget) {
                clearHighlight(state.pendingTarget);
                state.pendingTarget = null;
                state.pendingAt = 0;
            }
            highlight(candidate);

            state.samples++;

            if (
                state.selectedTarget !== candidate &&
                now - state.dwellStartedAt >= TUNING.dwellMs &&
                state.samples >= TUNING.minStableSamples
            ) {
                if (activateGazeTarget(candidate, state, now)) {
                    state.dwellStartedAt = now;
                }
            }
        }

        //let nudgeArmed = true;

                    <div id="joy-deadzone" style="position:absolute;left:50%;top:50%;width:38px;height:38px;transform:translate(-50%,-50%);border:1.5px solid rgba(255,255,255,0.55);border-radius:50%;"></div>

            const { hud, dot, stepRing, deadzoneRing, arrows } = joystickHudRefs;
            if (!visible) {

            // Map stepThreshold directly to the 46px radius of #joy-step-ring
            // so reaching the dashed outer ring equals triggering one button step
            const stepRadiusPx = 46;
            const scale = stepRadiusPx / Math.max(0.02, thresholdNorm);
            const pxX = Math.max(-64, Math.min(64, dx * scale));
            const pxY = Math.max(-64, Math.min(64, dy * scale));

                ? `0 0 ${Math.round(14 * dwellProgress)}px rgba(0, 255, 204, 0.85)`
                : 'none';

            const nextColor = activeDir
                ? (nudgeReady ? '#00ffcc' : '#ffc857')
                : (dwellProgress > 0 ? '#00ffcc' : '#9ee8dc');
            if (dot.style.background !== nextColor) {
                dot.style.background = nextColor;
            }

        function processJoystickGaze(data, state, now) {
            const pose = latestHeadPose || getCurrentHeadPose();
            if (!pose) {
                updateJoystickHud(0, 0, 0.05, null, true, 0, false);
                nudgeArmed = true;
                peakNudgeMag = 0;
                neutralSettledAt = 0;
                return;
            }

            if (!baselineHeadPose) {
                baselineHeadPose = pose;
            }

            if (!state.activeTarget || !state.activeTarget.isConnected) {
                const startingCell = findCell(gazeX, gazeY) || activeCells[0];
                if (!startingCell) return;

                state.activeTarget = startingCell.element;
                state.pendingTarget = null;
                state.selectedTarget = null;
                state.dwellStartedAt = 0;
                state.samples = 1;
                nudgeArmed = true;
                peakNudgeMag = 0;
                neutralSettledAt = 0;
                highlight(state.activeTarget);
            }

            const rawDx = -((pose.centerX - baselineHeadPose.centerX) / baselineHeadPose.width);
            const rawDy = (pose.centerY - baselineHeadPose.centerY) / baselineHeadPose.width;

            // Responsive filter so pullbacks toward center register quickly
            const alpha = Math.max(0.25, Math.min(0.75, TUNING.smoothing * 0.7));
            smoothJoyDx += (rawDx - smoothJoyDx) * alpha;
            smoothJoyDy += (rawDy - smoothJoyDy) * alpha;

            // Outer step threshold vs inner neutral rest zone (~40% of step radius)
            const stepThreshold = Math.max(0.035, TUNING.joystickThreshold * 0.18);
            const neutralZone = stepThreshold * 0.42;
            const absX = Math.abs(smoothJoyDx);
            const absY = Math.abs(smoothJoyDy);
            const radialMag = Math.hypot(smoothJoyDx, smoothJoyDy);

            let activeDir = null;
            if (absX > stepThreshold || absY > stepThreshold) {
                activeDir = absX > absY
                    ? (smoothJoyDx > 0 ? 'right' : 'left')
                    : (smoothJoyDy > 0 ? 'down' : 'up');
            }

            // Track peak excursion and re-arm as soon as you pull back 40% toward center
            if (!nudgeArmed) {
                if (radialMag > peakNudgeMag) {
                    peakNudgeMag = radialMag;
                }
                const pullbackThreshold = Math.max(neutralZone, peakNudgeMag * 0.6);
                if (radialMag <= pullbackThreshold) {
                    nudgeArmed = true;
                    peakNudgeMag = 0;
                }
            }

            // Outside the inner neutral rest zone: never count dwell selection
            if (radialMag > neutralZone) {
                neutralSettledAt = 0;
                state.dwellStartedAt = 0;

                if (activeDir && nudgeArmed && (now - lastSteppedAt >= 260)) {
                    const neighbor = findNeighbor(state.activeTarget, activeDir);
                    if (neighbor) {
                        clearHighlight(state.activeTarget);
                        state.activeTarget = neighbor;
                        state.selectedTarget = null;
                        highlight(state.activeTarget);
                    }
                    nudgeArmed = false;
                    peakNudgeMag = radialMag;
                    lastSteppedAt = now;
                }

                updateJoystickHud(smoothJoyDx, smoothJoyDy, stepThreshold, activeDir, nudgeArmed, 0, true);
                return;
            }

            // Inside inner neutral circle: require a calm settle delay after any nudge
            // so returning to center never triggers an accidental click or repeat
            const postNudgeSettleMs = 850;
            if (now - lastSteppedAt < postNudgeSettleMs) {
                neutralSettledAt = 0;
                state.dwellStartedAt = 0;
                highlight(state.activeTarget);
                updateJoystickHud(smoothJoyDx, smoothJoyDy, stepThreshold, null, nudgeArmed, 0, true);
                return;
            }

            if (!neutralSettledAt) {
                neutralSettledAt = now;
                state.dwellStartedAt = now;
            }

            const dwellElapsed = Math.max(0, now - state.dwellStartedAt);
            const dwellProgress = Math.min(1, dwellElapsed / Math.max(200, TUNING.dwellMs));
            highlight(state.activeTarget);
            updateJoystickHud(smoothJoyDx, smoothJoyDy, stepThreshold, null, nudgeArmed, dwellProgress, true);

            if (
                now >= joystickSelectCooldownUntil &&
                state.activeTarget &&
                dwellElapsed >= TUNING.dwellMs
            ) {
                if (activateGazeTarget(state.activeTarget, state, now)) {
                    joystickSelectCooldownUntil = now + Math.max(JOYSTICK_REPEAT_DELAY_MS, TUNING.repeatDelayMs);
                }
                state.dwellStartedAt = now;
            }
        }
        function processGroupedGaze(state, now) {
            const groupSwitchGraceMs = 1000;
            const groupSwitchDwellMs = Math.max(TUNING.dwellMs * 2, 1800);

            if (activeCells.length <= 4) {
                if (state.groupKey || state.pendingGroupKey) {
                    clearGroupedState(state);
                }
                setGroupedStatus('Small grid: direct targeting. Larger grids use 2×2 groups.');
                processDirectGaze(state, now);
                return;
            }

            const bounds = getGridBounds();
            if (state.groupKey && !activeCells.some(cell => getCellGroupForCell(cell, bounds) === state.groupKey)) {
                clearGroupedState(state);
            }

            const cell = findCell(gazeX, gazeY);
            const candidate = cell ? cell.element : null;
            const candidateGroup = getGroupAtPoint(gazeX, gazeY, bounds, state.groupKey);

            if (!candidateGroup) {
                pauseGroupedTargetDwell(state, now);
                if (
                    state.pendingGroupKey &&
                    now - state.pendingGroupLastSeen > groupSwitchGraceMs
                ) {
                    cancelPendingGroup(state);
                }
                setGroupedStatus(state.groupKey
                    ? 'Gaze is outside the grid groups. Button dwell is paused; look inside the highlighted group to resume.'
                    : 'Hold gaze on a quadrant to activate it.');
                return;
            }

            if (candidateGroup !== state.groupKey) {
                pauseGroupedTargetDwell(state, now);
                if (state.pendingGroupKey !== candidateGroup) {
                    cancelPendingGroup(state);
                    state.pendingGroupKey = candidateGroup;
                    state.pendingGroupAt = now;
                    state.pendingGroupLastSeen = now;
                    state.pendingGroupElapsed = 0;
                    state.groupSamples = 1;
                    setGroupHighlight(candidateGroup, 'gaze-group-pending', true);
                    const groupLabel = candidateGroup.replace('-', ' ');
                    setGroupedStatus(state.groupKey
                        ? `Button dwell paused. Hold in the ${groupLabel} group for a longer dwell to switch, or return to the active group.`
                        : `Hold gaze in the ${groupLabel} group for a longer dwell to activate it.`);
                    return;
                }

                if (now - state.pendingGroupLastSeen > groupSwitchGraceMs) {
                    cancelPendingGroup(state);
                    state.pendingGroupKey = candidateGroup;
                    state.pendingGroupAt = now;
                    state.pendingGroupLastSeen = now;
                    state.pendingGroupElapsed = 0;
                    state.groupSamples = 1;
                    setGroupHighlight(candidateGroup, 'gaze-group-pending', true);
                    const groupLabel = candidateGroup.replace('-', ' ');
                    setGroupedStatus(state.groupKey
                        ? `Button dwell paused. Hold in the ${groupLabel} group for a longer dwell to switch, or return to the active group.`
                        : `Hold gaze in the ${groupLabel} group for a longer dwell to activate it.`);
                    return;
                }

                const sampleGap = now - state.pendingGroupLastSeen;
                if (sampleGap <= 250) state.pendingGroupElapsed += sampleGap;
                state.pendingGroupLastSeen = now;
                state.groupSamples++;
                if (
                    state.pendingGroupElapsed >= groupSwitchDwellMs &&
                    state.groupSamples >= TUNING.minStableSamples
                ) {
                    setGroupHighlight(state.groupKey, 'gaze-group-active', false);
                    setGroupHighlight(state.pendingGroupKey, 'gaze-group-pending', false);
                    state.groupKey = candidateGroup;
                    state.pendingGroupKey = null;
                    state.pendingGroupAt = 0;
                    state.pendingGroupLastSeen = 0;
                    state.pendingGroupElapsed = 0;
                    state.groupSamples = 0;
                    state.groupOutSince = null;
                    clearHighlight(state.activeTarget);
                    clearHighlight(state.pendingTarget);
                    state.activeTarget = null;
                    state.pendingTarget = null;
                    state.pendingAt = 0;
                    state.dwellStartedAt = 0;
                    state.samples = 0;
                    state.selectedTarget = null;
                    setGroupHighlight(state.groupKey, 'gaze-group-active', true);
                    const groupLabel = state.groupKey.replace('-', ' ');
                    setGroupedStatus(`Active group: ${groupLabel}. Hold on a button inside it for another dwell to select.`);
                }
                return;
            }

            resumeGroupedTargetDwell(state, now);
            if (state.pendingGroupKey) {
                cancelPendingGroup(state);
            }
            setGroupedStatus(`Active group: ${state.groupKey.replace('-', ' ')}. Hold on a button inside it for another dwell to select.`);

            if (candidate && getCellGroup(candidate, bounds) !== state.groupKey) {
                clearHighlight(state.activeTarget);
                clearHighlight(state.pendingTarget);
                state.activeTarget = null;
                state.pendingTarget = null;
                state.pendingAt = 0;
                state.dwellStartedAt = 0;
                state.samples = 0;
                state.selectedTarget = null;
                return;
            }

            processDirectGaze(state, now);
        }

        function startGazeSystem() {
            if (!window.webgazer || gazeLoopStarted) return;
            gazeLoopStarted = true;

            loadSettings();
            loadRange();
            updateSpatialMap();
            observeSpatialMapChanges();
            window.setInterval(updateSpatialMap, TUNING.mapRefreshIntervalMs);

            if (typeof window.webgazer.setGazeListener === 'function') {
                window.webgazer.setGazeListener((data, elapsedTime) => {
                    if (!data || !Number.isFinite(data.x) || !Number.isFinite(data.y)) return;

                    const now = performance.now();
                    lastGazeAt = now;
                    const rawX = data.x;
                    const rawY = data.y;

                    const faceMetrics = readFaceMetrics();
                    latestHeadPose = faceMetrics.pose;

                    const eyeState = evaluateEyeState(faceMetrics, now);
                    if (eyeState === 'blink' || eyeState === 'eye-loss') {
                        isBlinkingOrLost = true;
                        pauseDwellForBlinkOrLoss(gazeState, now);

                        if (gazeX !== null && gazeY !== null) {
                            setGazeDots(rawX, rawY, gazeX, gazeY, true);
                        }
                        return;
                    }

                    const wasBlinkingOrLost = isBlinkingOrLost;
                    if (wasBlinkingOrLost) {
                        isBlinkingOrLost = false;
                        resumeDwellAfterBlinkOrLoss(gazeState, now);
                    }

                    const mappedWithoutHeadCorrection = mapGazeWithoutHeadCorrection(rawX, rawY);
                    latestGazeSample = {
                        x: rawX,
                        y: rawY,
                        mappedX: mappedWithoutHeadCorrection.x,
                        mappedY: mappedWithoutHeadCorrection.y,
                        time: now,
                        pose: latestHeadPose
                    };
                    if (
                        activeHeadPoseCapture &&
                        activeHeadPoseCapture.collecting &&
                        latestHeadPose &&
                        activeHeadPoseCapture.samples.length < 150
                    ) {
                        activeHeadPoseCapture.samples.push(latestGazeSample);
                    }

                    if (smoothedRawGazeX === null || smoothedRawGazeY === null) {
                        smoothedRawGazeX = rawX;
                        smoothedRawGazeY = rawY;
                    } else {
                        smoothedRawGazeX += (rawX - smoothedRawGazeX) * TUNING.smoothing;
                        smoothedRawGazeY += (rawY - smoothedRawGazeY) * TUNING.smoothing;
                    }

                    const mapped = applyComfortRange(rawX, rawY);
                    if (gazeX === null || gazeY === null) {
                        gazeX = mapped.x;
                        gazeY = mapped.y;
                    } else {
                        gazeX += (mapped.x - gazeX) * TUNING.smoothing;
                        gazeY += (mapped.y - gazeY) * TUNING.smoothing;
                    }

                    recentGaze.push({ x: rawX, y: rawY, time: now });
                    if (recentGaze.length > 60) recentGaze.shift();

                    if (
                        document.getElementById('gaze-calibration-overlay') ||
                        document.getElementById('gaze-range-overlay') ||
                        document.getElementById('gaze-recenter-overlay') ||
                        document.getElementById('gaze-head-calibration-overlay')
                    ) {
                        updateJoystickHud(0, 0, 0.05, null, false);
                        if (gazeX !== null && gazeY !== null) {
                            setGazeDots(rawX, rawY, gazeX, gazeY, false);
                        }
                        return;
                    }

                    if (!gazeState) {
                        gazeState = {
                            activeTarget: null,
                            dwellStartedAt: 0,
                            samples: 0,
                            pendingTarget: null,
                            pendingAt: 0,
                            missingSince: 0,
                            selectedTarget: null,
                            groupKey: null,
                            pendingGroupKey: null,
                            pendingGroupAt: 0,
                            pendingGroupLastSeen: 0,
                            pendingGroupElapsed: 0,
                            groupSamples: 0,
                            groupOutSince: null
                        };
                    }

                    if (
                        eyeState === 'long-blink-release' &&
                        TUNING.longBlinkEnabled &&
                        gazeState.activeTarget
                    ) {
                        activateGazeTarget(gazeState.activeTarget, gazeState, now);
                    }

                    if (interactionMode === 'joystick') {
                        processJoystickGaze(data, gazeState, now);
                    } else if (interactionMode === 'grouped') {
                        updateJoystickHud(0, 0, 0.05, null, false);
                        processGroupedGaze(gazeState, now);
                    } else {
                        updateJoystickHud(0, 0, 0.05, null, false);
                        setGroupedStatus('');
                        processDirectGaze(gazeState, now);
                    }

                    if (gazeX !== null && gazeY !== null) {
                        setGazeDots(rawX, rawY, gazeX, gazeY, false);
                    }
                });
            }

            if (typeof window.webgazer.showVideoPreview === 'function') {
                window.webgazer.showVideoPreview(false);
            }

            if (typeof window.webgazer.showPredictionPoints === 'function') {
                window.webgazer.showPredictionPoints(false);
            }

            addSettingsMenu();
            if (typeof window.webgazer.begin !== 'function') {
                console.warn('WebGazer does not expose begin(); gaze interaction disabled.');
                return;
            }

            try {
                Promise.resolve(window.webgazer.begin()).then(() => {
                    createSmoothPursuitCalibration(() => {
                        resetHeadPoseBaseline();
                        if (typeof window.webgazer.saveDataAcrossSessions === 'function') {
                            window.webgazer.saveDataAcrossSessions();
                        }
                    });
                }).catch(error => {
                    console.warn('WebGazer failed to initialize:', error);
                });
            } catch (error) {
                console.warn('WebGazer failed to initialize:', error);
            }
        }

        window.addEventListener('load', function () {
            if (window.webgazer) {
                setTimeout(startGazeSystem, 300);
            } else {
                console.warn('WebGazer did not load; gaze interaction disabled.');
            }
        });

        window.__astericsGaze = {
            TUNING,
            loadSettings,
            saveSettings,
            loadRange,
            saveRange,
            addSettingsMenu,
            createCalibrationOverlay,
            createSmoothPursuitCalibration,
            createHeadPoseCalibration,
            createComfortRangeOverlay,
            triggerSelection,
            findCell,
            applyComfortRange
        };
    }

    initializeAstericsGaze();
    </script>

    <script type="module" src="app/build/asterics-aac.bundle.js"></script>
</body>
