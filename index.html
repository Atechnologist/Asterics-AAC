<script>
    // Global Shared Spatial Map for Bidirectional Sync
    window.activeGridMap = {
        cells: [],
        lastUpdated: 0
    };

    document.addEventListener("DOMContentLoaded", () => {
        // Suppress TensorFlow FaceMesh willReadFrequently canvas warning
        const originalGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function(type, attributes) {
            if (type === '2d') {
                attributes = attributes || {};
                attributes.willReadFrequently = true;
            }
            return originalGetContext.call(this, type, attributes);
        };

        const checkInterval = setInterval(async () => {
            if (typeof webgazer !== 'undefined') {
                clearInterval(checkInterval);
                try {
                    // Clear stale local storage calibration models
                    window.localStorage.removeItem('webgazerGlobalData');

                    await webgazer.begin();
                    webgazer.removeMouseEventListeners();
                    webgazer.showVideoPreview(true);
                    webgazer.showPredictionPoints(false);

                    // 1. Launch Startup Calibration Overlay
                    createCalibrationOverlay(() => {
                        // Start spatial-map eye-tracking loop after calibration completes
                        startEyeTrackingLoop();
                    });

                } catch (err) {
                    console.error("WebGazer initialization error:", err);
                }
            }
        }, 200);
    });

    function startEyeTrackingLoop() {
        let lastProcessingTime = 0;
        const THROTTLE_MS = 50; // ~20 FPS
        let lastTarget = null;

        // --- BIDIRECTIONAL BRIDGE: LAYOUT OBSERVER ---
        // Automatically updates the shared spatial map whenever AsTeRICS Grid renders/updates buttons
        const layoutObserver = new MutationObserver(() => {
            updateSpatialMap();
        });
        layoutObserver.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
        
        // Initial map build
        updateSpatialMap();

        webgazer.setGazeListener((data, timestamp) => {
            if (!data) return;

            const now = performance.now();
            if (now - lastProcessingTime < THROTTLE_MS) return;
            lastProcessingTime = now;

            let rawX = data.x;
            let rawY = data.y;

            // If layout changed or map is empty, refresh it
            if (window.activeGridMap.cells.length === 0) {
                updateSpatialMap();
            }

            // --- SHARED SPATIAL MAP HIT-TESTING ---
            let bestTargetCell = null;
            let minDistance = Infinity;

            window.activeGridMap.cells.forEach(cell => {
                const distance = Math.hypot(rawX - cell.centerX, rawY - cell.centerY);
                
                // Check if gaze is inside bounding box or closest overall
                const isInsideBox = (rawX >= cell.left && rawX <= cell.right && rawY >= cell.top && rawY <= cell.bottom);
                
                if (isInsideBox || distance < minDistance) {
                    minDistance = distance;
                    bestTargetCell = cell;
                }
            });

            if (!bestTargetCell || !bestTargetCell.element) return;

            const bestTarget = bestTargetCell.element;
            const targetX = bestTargetCell.centerX;
            const targetY = bestTargetCell.centerY;

            // Update simulated gaze cursor to snap to the shared model's center coordinate
            const cursor = document.getElementById('gaze-cursor-sim') || createSimulatedCursor();
            cursor.style.left = `${targetX}px`;
            cursor.style.top = `${targetY}px`;

            // Handle Native Event Dispatching & Hover State
            if (bestTarget !== lastTarget) {
                if (lastTarget) {
                    lastTarget.dispatchEvent(new PointerEvent('pointerout', { bubbles: true, clientX: targetX, clientY: targetY }));
                    lastTarget.dispatchEvent(new MouseEvent('mouseleave', { bubbles: true, clientX: targetX, clientY: targetY }));
                    lastTarget.classList.remove('gaze-active-target');
                }
                bestTarget.dispatchEvent(new PointerEvent('pointerenter', { bubbles: true, clientX: targetX, clientY: targetY }));
                bestTarget.dispatchEvent(new MouseEvent('mouseenter', { bubbles: true, clientX: targetX, clientY: targetY }));
                bestTarget.classList.add('gaze-active-target');
                
                lastTarget = bestTarget;
            }

            // Continuous motion injection for native dwell progress bars
            bestTarget.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, clientX: targetX, clientY: targetY }));
            bestTarget.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: targetX, clientY: targetY }));

            // --- PROGRESSIVE IMPLICIT DRIFT CORRECTION ---
            // Feed the matched semantic center back into WebGazer for continuous auto-calibration
            if (minDistance < 200) {
                webgazer.recordScreenPosition(targetX, targetY, 'click');
            }
        });
    }

    // Helper to extract and share the layout coordinates
    function updateSpatialMap() {
        const gridButtons = document.querySelectorAll('.grid-item, button, [role="button"], .q-btn');
        const cells = [];

        gridButtons.forEach((btn, index) => {
            const rect = btn.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return; // Skip hidden elements

            cells.push({
                id: index,
                element: btn,
                left: rect.left,
                top: rect.top,
                right: rect.right,
                bottom: rect.bottom,
                centerX: rect.left + rect.width / 2,
                centerY: rect.top + rect.height / 2,
                width: rect.width,
                height: rect.height
            });
        });

        window.activeGridMap.cells = cells;
        window.activeGridMap.lastUpdated = performance.now();
    }

    // 5-Point Startup Calibration Overlay
    function createCalibrationOverlay(onComplete) {
        if (document.getElementById('gaze-calibration-overlay')) return;

        const overlay = document.createElement('div');
        overlay.id = 'gaze-calibration-overlay';
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100vw';
        overlay.style.height = '100vh';
        overlay.style.backgroundColor = 'rgba(10, 10, 10, 0.95)';
        overlay.style.zIndex = '999999';
        overlay.style.display = 'flex';
        overlay.style.flexDirection = 'column';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.color = '#fff';
        overlay.style.fontFamily = 'sans-serif';

        overlay.innerHTML = `
            <h2 style="margin-bottom: 10px; font-size: 24px;">Eye-Tracker Setup Calibration</h2>
            <p style="max-width: 450px; text-align: center; color: #bbb; margin-bottom: 30px; line-height: 1.5;">
                Stare directly at the glowing green dot and click it <strong>3 times</strong> with your mouse. Repeat for all positions to map your 3x3 grid accurately.
            </p>
            <div id="calibration-target" style="width: 40px; height: 40px; background: #00ffcc; border-radius: 50%; cursor: pointer; box-shadow: 0 0 25px #00ffcc; transition: all 0.15s;"></div>
            <p id="calib-status" style="margin-top: 25px; font-weight: bold; color: #00ffcc; font-size: 16px;">Target 1 of 5: Click 3 times</p>
        `;
        document.body.appendChild(overlay);

        const target = document.getElementById('calibration-target');
        const statusText = document.getElementById('calib-status');
        
        const points = [
            {x: '15vw', y: '20vh'}, {x: '85vw', y: '20vh'},
            {x: '50vw', y: '50vh'},
            {x: '15vw', y: '80vh'}, {x: '85vw', y: '80vh'}
        ];
        let currentPoint = 0;
        let clickCount = 0;

        function updateTargetPosition() {
            if (currentPoint >= points.length) {
                overlay.remove();
                if (typeof onComplete === 'function') onComplete();
                return;
            }
            target.style.position = 'absolute';
            target.style.left = points[currentPoint].x;
            target.style.top = points[currentPoint].y;
            clickCount = 0;
            statusText.innerText = `Target ${currentPoint + 1} of ${points.length}: Click 3 times while staring at the dot.`;
        }

        target.addEventListener('click', (e) => {
            webgazer.recordScreenPosition(e.clientX, e.clientY, 'click');
            clickCount++;
            statusText.innerText = `Point ${currentPoint + 1} of 5: Click count ${clickCount}/3`;

            if (clickCount >= 3) {
                currentPoint++;
                updateTargetPosition();
            }
        });

        updateTargetPosition();
    }

    function createSimulatedCursor() {
        const div = document.getElementById('gaze-cursor-sim') || document.createElement('div');
        if (!div.id) {
            div.id = 'gaze-cursor-sim';
            div.style.position = 'fixed';
            div.style.width = '14px';
            div.style.height = '14px';
            div.style.backgroundColor = 'rgba(0, 255, 204, 0.9)';
            div.style.border = '2px solid white';
            div.style.borderRadius = '50%';
            div.style.pointerEvents = 'none';
            div.style.zIndex = '999998';
            div.style.transform = 'translate(-50%, -50%)';
            document.body.appendChild(div);
        }
        return div;
    }
    </script>
