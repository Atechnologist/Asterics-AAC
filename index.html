<script>
document.addEventListener("DOMContentLoaded", () => {
    // Suppress TensorFlow FaceMesh willReadFrequently canvas warning
    const originalGetContext = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function(type, attributes) {
        if (type === '2d') {
            attributes = attributes || {};
            attributes.willReadFrequently = true;
        }
        return originalGetContext.call(this, type, attributes);
    };

    const checkInterval = setInterval(async () => {
        if (typeof webgazer !== 'undefined') {
            clearInterval(checkInterval);
            try {
                window.localStorage.removeItem('webgazerGlobalData');

                await webgazer.begin();
                webgazer.removeMouseEventListeners();
                webgazer.showVideoPreview(true);
                webgazer.showPredictionPoints(false);

                // 1. Launch Startup Calibration to lock baseline accuracy
                createCalibrationOverlay(() => {
                    startEyeTrackingLoop();
                });

            } catch (err) {
                console.error("WebGazer initialization error:", err);
            }
        }
    }, 200);
});

function startEyeTrackingLoop() {
    let activeCellIndex = null;
    let dwellTimer = null;
    const DWELL_TIME_MS = 1000; // 1 second dwell

    // Lightweight throttling (~20 FPS to eliminate lag entirely)
    let lastProcessingTime = 0;
    const THROTTLE_MS = 50; 

    let cachedButtons = [];
    function updateButtonCache() {
        const gridContainer = document.querySelector('.grid-container') || document.getElementById('touchElement');
        if (gridContainer) {
            cachedButtons = Array.from(gridContainer.querySelectorAll('button, .grid-item, [role="button"]'));
        }
    }

    webgazer.setGazeListener((data, timestamp) => {
        if (!data) return;

        const now = performance.now();
        if (now - lastProcessingTime < THROTTLE_MS) return;
        lastProcessingTime = now;

        // Update simulated gaze cursor
        const cursor = document.getElementById('gaze-cursor-sim') || createSimulatedCursor();
        cursor.style.left = `${data.x}px`;
        cursor.style.top = `${data.y}px`;

        if (cachedButtons.length === 0) updateButtonCache();
        if (cachedButtons.length === 0) return;

        // Macro-Cell Hit Testing
        let matchedIndex = -1;
        let matchedButton = null;

        for (let i = 0; i < cachedButtons.length; i++) {
            const rect = cachedButtons[i].getBoundingClientRect();
            if (data.x >= rect.left && data.x <= rect.right && data.y >= rect.top && data.y <= rect.bottom) {
                matchedIndex = i;
                matchedButton = cachedButtons[i];
                break;
            }
        }

        if (matchedButton) {
            if (matchedIndex !== activeCellIndex) {
                clearTimeout(dwellTimer);
                cachedButtons.forEach(b => b.classList.remove('gaze-active-target'));

                activeCellIndex = matchedIndex;
                matchedButton.classList.add('gaze-active-target');

                // Dwell trigger timer
                dwellTimer = setTimeout(() => {
                    const rect = matchedButton.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    // AUTO-CALIBRATION: Retrain model on successful clicks to eliminate drift over time
                    webgazer.recordScreenPosition(centerX, centerY, 'click');

                    matchedButton.click();
                    matchedButton.classList.remove('gaze-active-target');
                    activeCellIndex = null;
                    updateButtonCache();
                }, DWELL_TIME_MS);
            }
        } else {
            if (activeCellIndex !== null) {
                clearTimeout(dwellTimer);
                cachedButtons.forEach(b => b.classList.remove('gaze-active-target'));
                activeCellIndex = null;
            }
        }
    });
}

// 5-Point Startup Calibration Overlay
function createCalibrationOverlay(onComplete) {
    if (document.getElementById('gaze-calibration-overlay')) return;

    const overlay = document.createElement('div');
    overlay.id = 'gaze-calibration-overlay';
    overlay.style.position = 'fixed';
    overlay.style.top = '0';
    overlay.style.left = '0';
    overlay.style.width = '100vw';
    overlay.style.height = '100vh';
    overlay.style.backgroundColor = 'rgba(10, 10, 10, 0.95)';
    overlay.style.zIndex = '999999';
    overlay.style.display = 'flex';
    overlay.style.flexDirection = 'column';
    overlay.style.alignItems = 'center';
    overlay.style.justifyContent = 'center';
    overlay.style.color = '#fff';
    overlay.style.fontFamily = 'sans-serif';

    overlay.innerHTML = `
        <h2 style="margin-bottom: 10px; font-size: 24px;">Eye-Tracker Setup Calibration</h2>
        <p style="max-width: 450px; text-align: center; color: #bbb; margin-bottom: 30px; line-height: 1.5;">
            Stare directly at the glowing green dot and click it <strong>3 times</strong> with your mouse. Repeat for all positions to map your 3x3 grid accurately.
        </p>
        <div id="calibration-target" style="width: 40px; height: 40px; background: #00ffcc; border-radius: 50%; cursor: pointer; box-shadow: 0 0 25px #00ffcc; transition: all 0.15s;"></div>
        <p id="calib-status" style="margin-top: 25px; font-weight: bold; color: #00ffcc; font-size: 16px;">Target 1 of 5: Click 3 times</p>
    `;
    document.body.appendChild(overlay);

    const target = document.getElementById('calibration-target');
    const statusText = document.getElementById('calib-status');
    
    const points = [
        {x: '15vw', y: '20vh'}, {x: '85vw', y: '20vh'},
        {x: '50vw', y: '50vh'},
        {x: '15vw', y: '80vh'}, {x: '85vw', y: '80vh'}
    ];
    let currentPoint = 0;
    let clickCount = 0;

    function updateTargetPosition() {
        if (currentPoint >= points.length) {
            overlay.remove();
            if (typeof onComplete === 'function') onComplete();
            return;
        }
        target.style.position = 'absolute';
        target.style.left = points[currentPoint].x;
        target.style.top = points[currentPoint].y;
        clickCount = 0;
        statusText.innerText = `Target ${currentPoint + 1} of ${points.length}: Click 3 times while staring at the dot.`;
    }

    target.addEventListener('click', (e) => {
        webgazer.recordScreenPosition(e.clientX, e.clientY, 'click');
        clickCount++;
        statusText.innerText = `Target ${currentPoint + 1} of 5: Click count ${clickCount}/3`;

        if (clickCount >= 3) {
            currentPoint++;
            updateTargetPosition();
        }
    });

    updateTargetPosition();
}

function createSimulatedCursor() {
    const div = document.getElementById('gaze-cursor-sim') || document.createElement('div');
    if (!div.id) {
        div.id = 'gaze-cursor-sim';
        div.style.position = 'fixed';
        div.style.width = '14px';
        div.style.height = '14px';
        div.style.backgroundColor = 'rgba(0, 255, 204, 0.9)';
        div.style.border = '2px solid white';
        div.style.borderRadius = '50%';
        div.style.pointerEvents = 'none';
        div.style.zIndex = '999998';
        div.style.transform = 'translate(-50%, -50%)';
        document.body.appendChild(div);
    }
    return div;
}
</script>
