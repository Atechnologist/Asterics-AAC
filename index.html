    <script>
    (function () {
        'use strict';

        const SETTINGS_KEY = 'asterics-gaze-settings-v3';
        const RANGE_KEY = 'asterics-gaze-range-v2';
        const MODE_KEY = 'asterics-gaze-mode-v1';

        const DEFAULTS = {
            dwellMs: 900,
            smoothing: 0.65,
            switchHysteresisMs: 100,
            minStableSamples: 4,
            processingIntervalMs: 50,
            mapRefreshIntervalMs: 1000,
            joystickThreshold: 0.38
        };

        const TUNING = { ...DEFAULTS };

        let activeCells = [];
        let gazeRange = null;
        let interactionMode = 'direct';
        let calibrationDone = false;
        let gazeLoopStarted = false;
        let gazeX = null;
        let gazeY = null;
        let recentGaze = [];
        let gazeState = null;

        function loadSettings() {
            try {
                const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
                Object.keys(DEFAULTS).forEach(key => {
                    const value = Number(saved[key]);
                    if (Number.isFinite(value)) TUNING[key] = value;
                });
            } catch (error) {
                console.warn('Could not load gaze settings:', error);
            }
        }

        function saveSettings() {
            try {
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(TUNING));
            } catch (error) {
                console.warn('Could not save gaze settings:', error);
            }
        }

        function loadRange() {
            try {
                const saved = JSON.parse(localStorage.getItem(RANGE_KEY) || 'null');
                if (
                    saved &&
                    Number.isFinite(saved.minX) &&
                    Number.isFinite(saved.maxX) &&
                    Number.isFinite(saved.minY) &&
                    Number.isFinite(saved.maxY) &&
                    Number.isFinite(saved.centerX) &&
                    Number.isFinite(saved.centerY) &&
                    saved.maxX - saved.minX >= 40 &&
                    saved.maxY - saved.minY >= 40
                ) {
                    gazeRange = saved;
                }
            } catch (error) {
                console.warn('Could not load comfort range:', error);
                gazeRange = null;
            }
        }

        function saveRange() {
            try {
                if (gazeRange) {
                    localStorage.setItem(RANGE_KEY, JSON.stringify(gazeRange));
                } else {
                    localStorage.removeItem(RANGE_KEY);
                }
            } catch (error) {
                console.warn('Could not save comfort range:', error);
            }
        }

        function updateSpatialMap() {
            activeCells = Array.from(document.querySelectorAll('.element-container:not([data-empty="true"])'))
                .filter(element => {
                    if (!element.isConnected) return false;

                    const rect = element.getBoundingClientRect();
                    const style = window.getComputedStyle(element);

                    return rect.width > 0 &&
                        rect.height > 0 &&
                        style.display !== 'none' &&
                        style.visibility !== 'hidden';
                })
                .map(element => {
                    const rect = element.getBoundingClientRect();

                    return {
                        element,
                        left: rect.left,
                        top: rect.top,
                        right: rect.right,
                        bottom: rect.bottom,
                        area: rect.width * rect.height,
                        centerX: (rect.left + rect.right) / 2,
                        centerY: (rect.top + rect.bottom) / 2
                    };
                });
        }

        function getGridBounds() {
            if (!activeCells.length) return null;

            return activeCells.reduce((bounds, cell) => ({
                left: Math.min(bounds.left, cell.left),
                top: Math.min(bounds.top, cell.top),
                right: Math.max(bounds.right, cell.right),
                bottom: Math.max(bounds.bottom, cell.bottom)
            }), {
                left: Infinity,
                top: Infinity,
                right: -Infinity,
                bottom: -Infinity
            });
        }

        function applyComfortRange(x, y) {
            if (!gazeRange) return { x, y };

            const bounds = getGridBounds();
            if (!bounds) return { x, y };

            const sourceWidth = gazeRange.maxX - gazeRange.minX;
            const sourceHeight = gazeRange.maxY - gazeRange.minY;
            const gridWidth = bounds.right - bounds.left;
            const gridHeight = bounds.bottom - bounds.top;

            if (sourceWidth < 40 || sourceHeight < 40 || gridWidth <= 0 || gridHeight <= 0) {
                return { x, y };
            }

            const mappedX = bounds.left + ((x - gazeRange.minX) / sourceWidth) * gridWidth;
            const mappedY = bounds.top + ((y - gazeRange.minY) / sourceHeight) * gridHeight;

            return {
                x: Math.max(bounds.left, Math.min(bounds.right, mappedX)),
                y: Math.max(bounds.top, Math.min(bounds.bottom, mappedY))
            };
        }

        function findCell(x, y) {
            if (typeof x !== 'number' || typeof y !== 'number') return null;

            const matches = activeCells
                .filter(cell =>
                    x >= cell.left &&
                    x <= cell.right &&
                    y >= cell.top &&
                    y <= cell.bottom
                )
                .sort((a, b) => a.area - b.area);

            if (matches[0]) return matches[0];

            const elementUnderGaze = document.elementFromPoint(x, y);
            const targetEl = elementUnderGaze ? elementUnderGaze.closest('.element-container, button, [role="button"], .q-btn') : null;
            if (targetEl) {
                return activeCells.find(cell => cell.element === targetEl) || null;
            }

            return null;
        }

        function findNeighbor(element, direction) {
            const current = activeCells.find(cell => cell.element === element);
            if (!current) return null;

            const horizontal = direction === 'left' || direction === 'right';
            const sign = direction === 'left' || direction === 'up' ? -1 : 1;

            let best = null;
            let bestScore = Infinity;

            for (const cell of activeCells) {
                if (cell.element === element) continue;

                const primary = horizontal
                    ? (cell.centerX - current.centerX) * sign
                    : (cell.centerY - current.centerY) * sign;

                if (primary <= 0) continue;

                const perpendicular = horizontal
                    ? Math.abs(cell.centerY - current.centerY)
                    : Math.abs(cell.centerX - current.centerX);

                const score = perpendicular * 2 + primary * 0.15;

                if (score < bestScore) {
                    best = cell;
                    bestScore = score;
                }
            }

            return best ? best.element : null;
        }

        function setGazeDots(rawX, rawY, mappedX, mappedY) {
            const rawDot = document.getElementById('gaze-raw-dot');
            const mappedDot = document.getElementById('gaze-cursor-sim');

            if (rawDot) {
                rawDot.style.transform = `translate3d(${rawX}px, ${rawY}px, 0) translate(-50%, -50%)`;
                rawDot.style.display = 'block';
            }

            if (mappedDot) {
                mappedDot.style.transform = `translate3d(${mappedX}px, ${mappedY}px, 0) translate(-50%, -50%)`;
                mappedDot.style.display = 'block';
            }
        }

        function clearHighlight(element) {
            if (element && element.classList) {
                element.classList.remove('gaze-active-target');
            }
        }

        function highlight(element) {
            if (element && element.isConnected) {
                element.classList.add('gaze-active-target');
            }
        }

     function triggerSelection(element) {
    if (!element || !element.isConnected) return false;

    const target = element.matches('button, [role="button"], .q-btn')
        ? element
        : element.querySelector(
            'button:not(:disabled), [role="button"]:not([aria-disabled="true"]), .q-btn'
        ) || element;

    if (
        target.matches(':disabled, [aria-disabled="true"]') ||
        target.closest('[inert]')
    ) {
        return false;
    }

    const rect = target.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0 || typeof target.click !== 'function') {
        return false;
    }

    console.debug('Gaze activating:', target);
    target.click();
    return true;
}

window.addEventListener('keydown', event => {
    if (
        (event.code !== 'Space' && event.code !== 'Enter') ||
        event.repeat
    ) {
        return;
    }

    const focused = document.activeElement;
    if (
        focused &&
        focused.matches('input, textarea, select, [contenteditable="true"]')
    ) {
        return;
    }

    const target =
        (gazeState && gazeState.activeTarget) ||
        document.querySelector('.gaze-active-target');

    if (!target) {
        console.debug('Gaze selection: no active target');
        return;
    }

    event.preventDefault();
    console.debug('Keyboard selection target:', target);
    triggerSelection(target);
}, true);
        function createCalibrationOverlay(onComplete) {
            const previous = document.getElementById('gaze-calibration-overlay');
            if (previous) previous.remove();

            const overlay = document.createElement('div');
            overlay.id = 'gaze-calibration-overlay';
            overlay.style.cssText = [
                'position:fixed',
                'inset:0',
                'z-index:999999',
                'display:flex',
                'flex-direction:column',
                'align-items:center',
                'justify-content:center',
                'background:rgba(10,10,10,.95)',
                'color:white',
                'font-family:sans-serif',
                'text-align:center'
            ].join(';');

            overlay.innerHTML = `
                <h2 style="margin:0 16px 10px">Eye-Tracker Calibration</h2>
                <p style="max-width:540px;margin:0 16px 20px;color:#ccc;line-height:1.5">
                    Keep your head still. Look at each target and click it five times.
                    Pause briefly between clicks.
                </p>
                <button id="gaze-calibration-target" type="button" aria-label="Calibration target"
                    style="position:fixed;width:44px;height:44px;padding:0;border:3px solid white;
                    border-radius:50%;background:#00ffcc;box-shadow:0 0 24px #00ffcc;
                    cursor:pointer;transform:translate(-50%,-50%);z-index:1000000"></button>
                <p id="gaze-calibration-status" style="margin-top:30px;color:#00ffcc"></p>
            `;

            document.body.appendChild(overlay);

            const target = document.getElementById('gaze-calibration-target');
            const status = document.getElementById('gaze-calibration-status');

            const points = [
                { x: 0.08, y: 0.10 }, { x: 0.50, y: 0.10 }, { x: 0.92, y: 0.10 },
                { x: 0.08, y: 0.50 }, { x: 0.50, y: 0.50 }, { x: 0.92, y: 0.50 },
                { x: 0.08, y: 0.90 }, { x: 0.50, y: 0.90 }, { x: 0.92, y: 0.90 }
            ];

            let pointIndex = 0;
            let clicksAtPoint = 0;

            function showPoint() {
                if (pointIndex >= points.length) {
                    overlay.remove();
                    calibrationDone = true;
                    if (typeof onComplete === 'function') onComplete();
                    return;
                }

                const point = points[pointIndex];
                target.style.left = `${window.innerWidth * point.x}px`;
                target.style.top = `${window.innerHeight * point.y}px`;
                clicksAtPoint = 0;
                status.textContent = `Point ${pointIndex + 1} of 9 — clicks 0 of 5`;
            }

            target.addEventListener('click', event => {
                if (window.webgazer && typeof window.webgazer.recordScreenPosition === 'function') {
                    window.webgazer.recordScreenPosition(event.clientX, event.clientY, 'click');
                }

                clicksAtPoint++;
                status.textContent = `Point ${pointIndex + 1} of 9 — clicks ${clicksAtPoint} of 5`;

                if (clicksAtPoint >= 5) {
                    pointIndex++;
                    showPoint();
                }
            });

            showPoint();
        }

        function median(values) {
            const sorted = values.slice().sort((a, b) => a - b);
            return sorted[Math.floor(sorted.length / 2)];
        }

        function createComfortRangeOverlay(onComplete) {
            const previous = document.getElementById('gaze-range-overlay');
            if (previous) previous.remove();

            const overlay = document.createElement('div');
            overlay.id = 'gaze-range-overlay';
            overlay.style.cssText = [
                'position:fixed',
                'inset:0',
                'z-index:999999',
                'display:flex',
                'flex-direction:column',
                'align-items:center',
                'justify-content:center',
                'background:rgba(10,10,10,.95)',
                'color:white',
                'font:16px sans-serif',
                'text-align:center'
            ].join(';');

            overlay.innerHTML = `
                <p style="max-width:560px;margin:0 16px 20px;color:#ccc;line-height:1.5">
                    Look toward each target only as far as is comfortable. Hold your gaze
                    briefly, then click the target. Keep your head in your usual position.
                </p>
                <button id="gaze-range-target" type="button" aria-label="Comfort range target"
                    style="position:fixed;width:44px;height:44px;border:3px solid white;
                    border-radius:50%;background:#ff0055;box-shadow:0 0 24px #ff0055;
                    transform:translate(-50%,-50%);cursor:pointer"></button>
                <p id="gaze-range-status" style="color:white"></p>
            `;

            document.body.appendChild(overlay);

            const target = document.getElementById('gaze-range-target');
            const status = document.getElementById('gaze-range-status');

            const points = [
                { label: 'Top-left comfortable limit', x: 0.12, y: 0.18 },
                { label: 'Top-right comfortable limit', x: 0.88, y: 0.18 },
                { label: 'Bottom-right comfortable limit', x: 0.88, y: 0.82 },
                { label: 'Bottom-left comfortable limit', x: 0.12, y: 0.82 }
            ];

            const readings = [];
            let pointIndex = 0;

            function showPoint() {
                if (pointIndex >= points.length) {
                    const minX = Math.min(...readings.map(point => point.x));
                    const maxX = Math.max(...readings.map(point => point.x));
                    const minY = Math.min(...readings.map(point => point.y));
                    const maxY = Math.max(...readings.map(point => point.y));

                    if (readings.length !== points.length || maxX - minX < 40 || maxY - minY < 40) {
                        pointIndex = 0;
                        readings.length = 0;
                        status.textContent = 'Could not measure a usable range. Please try the four points again.';
                        setTimeout(showPoint, 1600);
                        return;
                    }

                    gazeRange = {
                        minX,
                        maxX,
                        minY,
                        maxY,
                        centerX: (minX + maxX) / 2,
                        centerY: (minY + maxY) / 2
                    };

                    saveRange();
                    gazeX = null;
                    gazeY = null;
                    overlay.remove();

                    if (typeof onComplete === 'function') onComplete();
                    return;
                }

                const point = points[pointIndex];
                target.style.left = `${window.innerWidth * point.x}px`;
                target.style.top = `${window.innerHeight * point.y}px`;
                status.textContent = `${point.label} — point ${pointIndex + 1} of 4. Look, hold, then click.`;

                recentGaze = [];
            }

            target.addEventListener('click', () => {
                const cutoff = performance.now() - 2000;
                const samples = recentGaze.filter(sample => sample.time >= cutoff);

                if (samples.length < 3) {
                    status.textContent = `Only ${samples.length} gaze readings collected. Keep looking at the target for 2 seconds, then click again.`;
                    return;
                }

                readings.push({
                    x: median(samples.map(sample => sample.x)),
                    y: median(samples.map(sample => sample.y))
                });

                pointIndex++;
                showPoint();
            });

            showPoint();
        }

        function addSettingsMenu() {
            const style = document.createElement('style');
            style.textContent = `
                #gaze-settings-toggle {
                    position:fixed;top:12px;right:12px;z-index:99990;
                    padding:9px 12px;border:1px solid #00c9a7;border-radius:6px;
                    background:#172321;color:#fff;font:14px sans-serif;cursor:pointer
                }
                #gaze-settings-panel {
                    position:fixed;top:58px;right:12px;z-index:99990;
                    width:min(340px,calc(100vw - 24px));max-height:calc(100vh - 75px);
                    overflow:auto;padding:14px;border:1px solid #00c9a7;border-radius:8px;
                    background:rgba(15,20,20,.97);color:#fff;font:14px sans-serif;
                    box-shadow:0 4px 18px rgba(0,0,0,.45)
                }
                #gaze-settings-panel[hidden]{display:none}
                .gaze-setting{margin:12px 0}
                .gaze-setting-heading{display:flex;justify-content:space-between;gap:12px;margin-bottom:5px}
                .gaze-setting input{width:100%;accent-color:#00ffcc}
                #gaze-settings-panel button,#gaze-settings-panel select {
                    margin:4px;padding:7px 9px;border:1px solid #00c9a7;
                    border-radius:5px;background:#172321;color:#fff
                }
            `;

            document.head.appendChild(style);

            const toggle = document.createElement('button');
            toggle.id = 'gaze-settings-toggle';
            toggle.type = 'button';
            toggle.textContent = 'Gaze settings';
            toggle.setAttribute('aria-expanded', 'false');

            const panel = document.createElement('section');
            panel.id = 'gaze-settings-panel';
            panel.hidden = true;

            const heading = document.createElement('h2');
            heading.textContent = 'Gaze settings';
            panel.appendChild(heading);

            const help = document.createElement('p');
            help.textContent = 'Changes apply immediately and are saved in this browser.';
            panel.appendChild(help);

            const modeLabel = document.createElement('label');
            modeLabel.htmlFor = 'gaze-interaction-mode';
            modeLabel.textContent = 'Selection mode: ';

            const modeSelect = document.createElement('select');
            modeSelect.id = 'gaze-interaction-mode';
            modeSelect.innerHTML = `
                <option value="direct">Direct gaze</option>
                <option value="joystick">Directional gaze</option>
            `;
            modeSelect.value = interactionMode;

            modeSelect.addEventListener('change', () => {
                if (modeSelect.value === 'joystick' && !gazeRange) {
                    modeSelect.value = 'direct';
                    alert('Calibrate the comfort range first to use directional gaze.');
                    return;
                }

                interactionMode = modeSelect.value;
                localStorage.setItem(MODE_KEY, interactionMode);
            });

            panel.append(modeLabel, modeSelect);

            const settings = [
                {
                    key: 'dwellMs',
                    label: 'Dwell time',
                    min: 500,
                    max: 2500,
                    step: 100,
                    format: value => `${(value / 1000).toFixed(1)} s`
                },
                {
                    key: 'smoothing',
                    label: 'Gaze responsiveness',
                    min: 0.2,
                    max: 0.9,
                    step: 0.05,
                    format: value => Number(value).toFixed(2)
                },
                {
                    key: 'switchHysteresisMs',
                    label: 'Direct target switch delay',
                    min: 50,
                    max: 400,
                    step: 25,
                    format: value => `${value} ms`
                },
                {
                    key: 'joystickThreshold',
                    label: 'Directional movement threshold',
                    min: 0.20,
                    max: 0.70,
                    step: 0.05,
                    format: value => Number(value).toFixed(2)
                }
            ];

            settings.forEach(setting => {
                const wrapper = document.createElement('div');
                wrapper.className = 'gaze-setting';

                const row = document.createElement('div');
                row.className = 'gaze-setting-heading';

                const label = document.createElement('label');
                const id = `gaze-setting-${setting.key}`;
                label.htmlFor = id;
                label.textContent = setting.label;

                const output = document.createElement('output');
                output.id = `${id}-value`;

                const input = document.createElement('input');
                input.id = id;
                input.type = 'range';
                input.min = String(setting.min);
                input.max = String(setting.max);
                input.step = String(setting.step);
                input.value = String(TUNING[setting.key]);
                output.textContent = setting.format(Number(input.value));

                input.addEventListener('input', () => {
                    TUNING[setting.key] = Number(input.value);
                    output.textContent = setting.format(TUNING[setting.key]);
                    saveSettings();
                });

                row.append(label, output);
                wrapper.append(row, input);
                panel.appendChild(wrapper);
            });

            const recalibrate = document.createElement('button');
            recalibrate.type = 'button';
            recalibrate.textContent = 'Recalibrate (9 points)';
            recalibrate.addEventListener('click', () => {
                panel.hidden = true;
                createCalibrationOverlay(() => {
                    panel.hidden = false;
                });
            });

            const rangeButton = document.createElement('button');
            rangeButton.type = 'button';
            rangeButton.textContent = 'Calibrate comfort range';
            rangeButton.addEventListener('click', () => {
                panel.hidden = true;
                createComfortRangeOverlay(() => {
                    panel.hidden = false;
                });
            });

            const clearRange = document.createElement('button');
            clearRange.type = 'button';
            clearRange.textContent = 'Clear comfort range';
            clearRange.addEventListener('click', () => {
                gazeRange = null;
                saveRange();
                interactionMode = 'direct';
                modeSelect.value = 'direct';
                localStorage.setItem(MODE_KEY, 'direct');
                gazeX = null;
                gazeY = null;
            });

            toggle.addEventListener('click', () => {
                panel.hidden = !panel.hidden;
                toggle.setAttribute('aria-expanded', String(!panel.hidden));
            });

            panel.append(recalibrate, rangeButton, clearRange);
            document.body.append(toggle, panel);
        }

       function processDirectGaze(state, now) {
    const cell = findCell(gazeX, gazeY);
    const candidate = cell ? cell.element : null;

    if (!candidate) {
        state.pendingTarget = null;
        state.pendingAt = 0;

        if (state.activeTarget && !state.missingSince) {
            state.missingSince = now;
        }

        // Ignore short tracking gaps instead of restarting dwell immediately.
        if (
            state.activeTarget &&
            state.missingSince &&
            now - state.missingSince >= 350
        ) {
            clearHighlight(state.activeTarget);
            state.activeTarget = null;
            state.selectedTarget = null;
            state.dwellStartedAt = 0;
            state.samples = 0;
            state.missingSince = 0;
        }
        return;
    }

    state.missingSince = 0;

    if (candidate !== state.activeTarget) {
        if (state.pendingTarget !== candidate) {
            state.pendingTarget = candidate;
            state.pendingAt = now;
            return;
        }

        if (now - state.pendingAt < TUNING.switchHysteresisMs) return;

        clearHighlight(state.activeTarget);
        state.activeTarget = candidate;
        state.selectedTarget = null;
        state.dwellStartedAt = now;
        state.samples = 1;
        state.pendingTarget = null;
        state.pendingAt = 0;
        highlight(candidate);
        return;
    }

    state.samples++;

    if (
        state.selectedTarget !== candidate &&
        now - state.dwellStartedAt >= TUNING.dwellMs &&
        state.samples >= TUNING.minStableSamples
    ) {
        if (triggerSelection(candidate)) {
            state.selectedTarget = candidate;
        }
    }
}

        function processJoystickGaze(data, state, now) {
            if (!gazeRange) return;

            if (!state.activeTarget || !state.activeTarget.isConnected) {
                const startingCell = findCell(gazeX, gazeY);
                if (!startingCell) return;

                state.activeTarget = startingCell.element;
                state.pendingTarget = null;
                state.dwellStartedAt = now;
                state.samples = 1;
                highlight(state.activeTarget);
                return;
            }

            const offsetX = data.x - gazeRange.centerX;
            const offsetY = data.y - gazeRange.centerY;
            const threshold = TUNING.joystickThreshold;
            const absX = Math.abs(offsetX / Math.max(1, gazeRange.maxX - gazeRange.minX));
            const absY = Math.abs(offsetY / Math.max(1, gazeRange.maxY - gazeRange.minY));

            if (absX > threshold || absY > threshold) {
                const nextDirection = absX > absY
                    ? (offsetX > 0 ? 'right' : 'left')
                    : (offsetY > 0 ? 'down' : 'up');

                const element = findNeighbor(state.activeTarget, nextDirection);
                if (element) {
                    clearHighlight(state.activeTarget);
                    state.activeTarget = element;
                    state.dwellStartedAt = now;
                    state.samples = 1;
                    highlight(state.activeTarget);
                }
            }

            if (state.activeTarget && now - state.dwellStartedAt >= TUNING.dwellMs) {
                triggerSelection(state.activeTarget);
                clearHighlight(state.activeTarget);
                state.activeTarget = null;
                state.dwellStartedAt = 0;
                state.samples = 0;
            }
        }

        function startGazeSystem() {
            if (!window.webgazer || gazeLoopStarted) return;
            gazeLoopStarted = true;

            loadSettings();
            loadRange();

            if (typeof window.webgazer.setGazeListener === 'function') {
                window.webgazer.setGazeListener((data, elapsedTime) => {
                    if (!data || !Number.isFinite(data.x) || !Number.isFinite(data.y)) return;

                    const rawX = data.x;
                    const rawY = data.y;

                    const mapped = applyComfortRange(rawX, rawY);
                    gazeX = mapped.x;
                    gazeY = mapped.y;

                    if (!gazeState) {
                        gazeState = {
                            activeTarget: null,
                            dwellStartedAt: 0,
                            samples: 0,
                            pendingTarget: null,
                            pendingAt: 0,
                            missingSince: 0,
                            selected: false
                        };
                    }

                    if (interactionMode === 'joystick') {
                        processJoystickGaze(data, gazeState, performance.now());
                    } else {
                        processDirectGaze(gazeState, performance.now());
                    }

                    if (gazeX !== null && gazeY !== null) {
                        setGazeDots(rawX, rawY, gazeX, gazeY);
                    }

                    recentGaze.push({ x: rawX, y: rawY, time: performance.now() });
                    if (recentGaze.length > 200) recentGaze.shift();
                });
            }

            if (typeof window.webgazer.begin === 'function') {
                window.webgazer.begin().catch(error => {
                    console.warn('WebGazer failed to initialize:', error);
                });
            }

            if (typeof window.webgazer.showVideoPreview === 'function') {
                window.webgazer.showVideoPreview(false);
            }

            if (typeof window.webgazer.showPredictionPoints === 'function') {
                window.webgazer.showPredictionPoints(false);
            }

            addSettingsMenu();
            createCalibrationOverlay(() => {
                if (typeof window.webgazer.saveDataAcrossSessions === 'function') {
                    window.webgazer.saveDataAcrossSessions();
                }
            });
        }

        window.addEventListener('load', function () {
            if (window.webgazer) {
                startGazeSystem();
            } else {
                console.warn('WebGazer did not load; gaze interaction disabled.');
            }
        });

        window.__astericsGaze = {
            TUNING,
            loadSettings,
            saveSettings,
            loadRange,
            saveRange,
            addSettingsMenu,
            createCalibrationOverlay,
            createComfortRangeOverlay,
            triggerSelection,
            findCell,
            applyComfortRange
        };
    })();
    </script>

    <script type="module" src="app/build/asterics-aac.bundle.js"></script>
