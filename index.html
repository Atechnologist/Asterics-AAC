<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Suppress TensorFlow FaceMesh willReadFrequently canvas warning
        const originalGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function(type, attributes) {
            if (type === '2d') {
                attributes = attributes || {};
                attributes.willReadFrequently = true;
            }
            return originalGetContext.call(this, type, attributes);
        };

        const checkInterval = setInterval(async () => {
            if (typeof webgazer !== 'undefined') {
                clearInterval(checkInterval);
                try {
                    window.localStorage.removeItem('webgazerGlobalData');

                    await webgazer.begin();
                    webgazer.removeMouseEventListeners();
                    webgazer.showVideoPreview(true);
                    webgazer.showPredictionPoints(false);
                    webgazer.showFaceOverlay(true);

                    // 1. Launch Startup Calibration Overlay
                    createCalibrationOverlay(() => {
                        startVectorGazeTracking();
                    });

                } catch (err) {
                    console.error("WebGazer initialization error:", err);
                }
            }
        }, 200);
    });

    // ==========================================
    // 1. GEOMETRIC ELEMENT SNAPPING UTILITY
    // ==========================================
    function getSnappedGazeTarget(gazeX, gazeY) {
        // Dynamically tag grid buttons and interactive elements as gaze targets
        const targetElements = document.querySelectorAll('.grid-item, button, [role="button"], .q-btn');
        const SNAP_BUFFER = 65; // Proximity magnetic snap buffer zone in pixels

        for (let element of targetElements) {
            const bounds = element.getBoundingClientRect();
            if (bounds.width === 0 || bounds.height === 0) continue;

            const minX = bounds.left - SNAP_BUFFER;
            const maxX = bounds.right + SNAP_BUFFER;
            const minY = bounds.top - SNAP_BUFFER;
            const maxY = bounds.bottom + SNAP_BUFFER;

            if (gazeX >= minX && gazeX <= maxX && gazeY >= minY && gazeY <= maxY) {
                element.classList.add('gaze-focused');
                return {
                    element: element,
                    x: bounds.left + bounds.width / 2,
                    y: bounds.top + bounds.height / 2,
                    isSnapped: true
                };
            } else {
                element.classList.remove('gaze-focused');
            }
        }
        return { element: null, x: gazeX, y: gazeY, isSnapped: false };
    }

    // ==========================================
    // 2. MAIN EYE VECTOR DRAWER & WEBGAZER SYNC
    // ==========================================
    function startVectorGazeTracking() {
        let lastTarget = null;

        webgazer.setGazeListener((data, elapsedTime) => {
            if (!data) return;

            // Run raw coordinates through the magnetic snap verification pass
            const target = getSnappedGazeTarget(data.x, data.y);

            // Fetch the 468-point facial mesh mapping array from TensorFlow/MediaPipe
            const tracker = webgazer.getTracker();
            const positions = tracker && typeof tracker.getCurrentPosition === 'function' ? tracker.getCurrentPosition() : null;
            const overlayCanvas = document.getElementById('webgazerVideoCanvas');
            
            if (overlayCanvas && positions && positions.length > 0) {
                const ctx = overlayCanvas.getContext('2d');
                ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

                // Calculate eye tracking center points via explicit MediaPipe landmarks
                const leftEyeX = (positions[362].x + positions[263].x) / 2;
                const leftEyeY = (positions[362].y + positions[263].y) / 2;
                const rightEyeX = (positions[133].x + positions[33].x) / 2;
                const rightEyeY = (positions[133].y + positions[33].y) / 2;

                // Visual configurations (Green if snapped to a button, Red if floating)
                ctx.strokeStyle = target.isSnapped ? "rgba(46, 204, 113, 0.95)" : "rgba(231, 76, 60, 0.85)";
                ctx.lineWidth = target.isSnapped ? 3.5 : 2.0;

                // Draw Vector 1: Left Eye to Target
                ctx.beginPath();
                ctx.moveTo(leftEyeX, leftEyeY);
                ctx.lineTo(target.x, target.y);
                ctx.stroke();

                // Draw Vector 2: Right Eye to Target
                ctx.beginPath();
                ctx.moveTo(rightEyeX, rightEyeY);
                ctx.lineTo(target.x, target.y);
                ctx.stroke();
            }

            // Handle Event Dispatching for Snapped Elements
            if (target.isSnapped && target.element) {
                const bestTarget = target.element;
                const targetX = target.x;
                const targetY = target.y;

                if (bestTarget !== lastTarget) {
                    if (lastTarget) {
                        lastTarget.dispatchEvent(new PointerEvent('pointerout', { bubbles: true, clientX: targetX, clientY: targetY }));
                        lastTarget.dispatchEvent(new MouseEvent('mouseleave', { bubbles: true, clientX: targetX, clientY: targetY }));
                    }
                    bestTarget.dispatchEvent(new PointerEvent('pointerenter', { bubbles: true, clientX: targetX, clientY: targetY }));
                    bestTarget.dispatchEvent(new MouseEvent('mouseenter', { bubbles: true, clientX: targetX, clientY: targetY }));
                    lastTarget = bestTarget;
                }
                bestTarget.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, clientX: targetX, clientY: targetY }));
                bestTarget.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: targetX, clientY: targetY }));
            } else if (lastTarget) {
                lastTarget.dispatchEvent(new PointerEvent('pointerout', { bubbles: true }));
                lastTarget.dispatchEvent(new MouseEvent('mouseleave', { bubbles: true }));
                lastTarget = null;
            }
        });
    }

    // 5-Point Startup Calibration Overlay
    function createCalibrationOverlay(onComplete) {
        if (document.getElementById('gaze-calibration-overlay')) return;

        const overlay = document.createElement('div');
        overlay.id = 'gaze-calibration-overlay';
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100vw';
        overlay.style.height = '100vh';
        overlay.style.backgroundColor = 'rgba(10, 10, 10, 0.95)';
        overlay.style.zIndex = '999999';
        overlay.style.display = 'flex';
        overlay.style.flexDirection = 'column';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.color = '#fff';
        overlay.style.fontFamily = 'sans-serif';

        overlay.innerHTML = `
            <h2 style="margin-bottom: 10px; font-size: 24px;">Eye-Tracker Setup Calibration</h2>
            <p style="max-width: 450px; text-align: center; color: #bbb; margin-bottom: 30px; line-height: 1.5;">
                Stare directly at the glowing green dot and click it <strong>3 times</strong> with your mouse. Repeat for all positions to map your grid accurately.
            </p>
            <div id="calibration-target" style="width: 40px; height: 40px; background: #00ffcc; border-radius: 50%; cursor: pointer; box-shadow: 0 0 25px #00ffcc; transition: all 0.15s;"></div>
            <p id="calib-status" style="margin-top: 25px; font-weight: bold; color: #00ffcc; font-size: 16px;">Target 1 of 5: Click 3 times</p>
        `;
        document.body.appendChild(overlay);

        const target = document.getElementById('calibration-target');
        const statusText = document.getElementById('calib-status');
        
        const points = [
            {x: '15vw', y: '15vh'}, {x: '85vw', y: '15vh'},
            {x: '50vw', y: '50vh'},
            {x: '15vw', y: '85vh'}, {x: '85vw', y: '85vh'}
        ];
        let currentPoint = 0;
        let clickCount = 0;

        function updateTargetPosition() {
            if (currentPoint >= points.length) {
                overlay.remove();
                if (typeof onComplete === 'function') onComplete();
                return;
            }
            target.style.position = 'absolute';
            target.style.left = points[currentPoint].x;
            target.style.top = points[currentPoint].y;
            clickCount = 0;
            statusText.innerText = `Target ${currentPoint + 1} of ${points.length}: Click 3 times while staring at the dot.`;
        }

        target.addEventListener('click', (e) => {
            webgazer.recordScreenPosition(e.clientX, e.clientY, 'click');
            clickCount++;
            statusText.innerText = `Point ${currentPoint + 1} of 5: Click count ${clickCount}/3`;

            if (clickCount >= 3) {
                currentPoint++;
                updateTargetPosition();
            }
        });

        updateTargetPosition();
    }
</script>
