                        ? (search.global ? search : RegExp(search.source, /\/([a-z]*)$/.exec(search.toString())[1] + 'g'))
                        : RegExp(String(search).replace(/[.^$*+?()[{|\\]/g, "\\$&"), "g"),
                    replace

            }

    }

    testEval("function x(a = 1){}", "default parameters");

    if (![].fill) {

<script>
(function() {
    'use strict';

    const SETTINGS_KEY = 'asterics-gaze-settings-v1';

    const DEFAULT_TUNING = {
        dwellMs: 1200,
        smoothing: 0.50,
        hitPaddingRatio: 0.35,
        minHitPaddingPx: 30,
        maxHitPaddingPx: 80,
        resetGraceMs: 200,
        switchHysteresisMs: 150,
        minStableSamples: 6,
        processingIntervalMs: 50,
        mapRefreshIntervalMs: 200
    };

    const GAZE_TUNING = { ...DEFAULT_TUNING };

    let smoothedGazeX = null;
    let smoothedGazeY = null;
    let gazeStartupStarted = false;
    let gazeLoopStarted = false;
    let activeGridMap = [];

    function loadSettings() {
        try {
            const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');

            Object.keys(DEFAULT_TUNING).forEach(key => {
                if (Object.prototype.hasOwnProperty.call(saved, key)) {
                    const value = Number(saved[key]);
                    if (Number.isFinite(value)) GAZE_TUNING[key] = value;
                }
            });
        } catch (error) {
            console.warn('Could not load gaze settings:', error);
        }
    }

    function saveSettings() {
        try {
            localStorage.setItem(SETTINGS_KEY, JSON.stringify(GAZE_TUNING));
        } catch (error) {
            console.warn('Could not save gaze settings:', error);
        }
    }

    function initGazeSettingsMenu() {
        const settings = [
            {
                key: 'dwellMs',
                label: 'Dwell time',
                min: 500,
                max: 2500,
                step: 100,
                format: value => `${(value / 1000).toFixed(1)} s`
            },
            {
                key: 'smoothing',
                label: 'Gaze responsiveness',
                min: 0.2,
                max: 0.9,
                step: 0.05,
                format: value => Number(value).toFixed(2)
            },
            {
                key: 'hitPaddingRatio',
                label: 'Target tolerance',
                min: 0.15,
                max: 0.6,
                step: 0.05,
                format: value => Number(value).toFixed(2)
            },
            {
                key: 'resetGraceMs',
                label: 'Leave-target grace',
                min: 0,
                max: 600,
                step: 50,
                format: value => `${value} ms`
            },
            {
                key: 'switchHysteresisMs',
                label: 'Target switch stability',
                min: 50,
                max: 400,
                step: 25,
                format: value => `${value} ms`
            },
            {
                key: 'minStableSamples',
                label: 'Minimum stable samples',
                min: 3,
                max: 12,
                step: 1,
                format: value => `${value}`
            }
        ];

        const style = document.createElement('style');
        style.textContent = `
            #gaze-settings-toggle {
                position: fixed;
                top: 12px;
                right: 12px;
                z-index: 99990;
                padding: 9px 12px;
                border: 1px solid #00c9a7;
                border-radius: 6px;
                background: #172321;
                color: #fff;
                font: 14px sans-serif;
                cursor: pointer;
            }

            #gaze-settings-panel {
                position: fixed;
                top: 58px;
                right: 12px;
                z-index: 99990;
                width: min(340px, calc(100vw - 24px));
                max-height: calc(100vh - 75px);
                overflow-y: auto;
                padding: 14px;
                border: 1px solid #00c9a7;
                border-radius: 8px;
                background: rgba(15, 20, 20, 0.97);
                color: #fff;
                font: 14px sans-serif;
                box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
            }

            #gaze-settings-panel[hidden] {
                display: none;
            }

            #gaze-settings-panel h2 {
                margin: 0 0 12px;
                font-size: 18px;
            }

            .gaze-setting {
                margin: 12px 0;
            }

            .gaze-setting-heading {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 5px;
            }

            .gaze-setting input {
                width: 100%;
                accent-color: #00ffcc;
            }

            #gaze-settings-actions {
                display: flex;
                justify-content: space-between;
                gap: 8px;
                margin-top: 14px;
            }

            #gaze-settings-actions button {
                padding: 7px 10px;
                border: 1px solid #00c9a7;
                border-radius: 5px;
                background: #172321;
                color: #fff;
                cursor: pointer;
            }

            #gaze-settings-help {
                color: #bbb;
                font-size: 12px;
                line-height: 1.4;
            }
        `;
        document.head.appendChild(style);

        const toggle = document.createElement('button');
        toggle.id = 'gaze-settings-toggle';
        toggle.type = 'button';
        toggle.textContent = 'Gaze settings';
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-controls', 'gaze-settings-panel');

        const panel = document.createElement('section');
        panel.id = 'gaze-settings-panel';
        panel.hidden = true;
        panel.setAttribute('aria-label', 'Gaze settings');

        const heading = document.createElement('h2');
        heading.textContent = 'Gaze settings';
        panel.appendChild(heading);

        const help = document.createElement('p');
        help.id = 'gaze-settings-help';
        help.textContent = 'Adjust one setting at a time. Changes apply immediately and are saved in this browser.';
        panel.appendChild(help);

        settings.forEach(setting => {
            const wrapper = document.createElement('div');
            wrapper.className = 'gaze-setting';

            const labelRow = document.createElement('div');
            labelRow.className = 'gaze-setting-heading';

            const label = document.createElement('label');
            const inputId = `gaze-setting-${setting.key}`;
            label.htmlFor = inputId;
            label.textContent = setting.label;

            const output = document.createElement('output');
            output.id = `${inputId}-value`;

            const input = document.createElement('input');
            input.id = inputId;
            input.type = 'range';
            input.min = String(setting.min);
            input.max = String(setting.max);
            input.step = String(setting.step);
            input.value = String(GAZE_TUNING[setting.key]);

            output.textContent = setting.format(Number(input.value));

            input.addEventListener('input', () => {
                const value = Number(input.value);
                GAZE_TUNING[setting.key] = value;
                output.textContent = setting.format(value);
                saveSettings();
            });

            labelRow.append(label, output);
            wrapper.append(labelRow, input);
            panel.appendChild(wrapper);
        });

        const actions = document.createElement('div');
        actions.id = 'gaze-settings-actions';

        const resetButton = document.createElement('button');
        resetButton.type = 'button';
        resetButton.textContent = 'Reset defaults';
        resetButton.addEventListener('click', () => {
            Object.assign(GAZE_TUNING, DEFAULT_TUNING);

            settings.forEach(setting => {
                const input = document.getElementById(`gaze-setting-${setting.key}`);
                const output = document.getElementById(`gaze-setting-${setting.key}-value`);
                const value = Number(GAZE_TUNING[setting.key]);

                input.value = String(value);
                output.textContent = setting.format(value);
            });

            saveSettings();
        });

        const closeButton = document.createElement('button');
        closeButton.type = 'button';
        closeButton.textContent = 'Close';
        closeButton.addEventListener('click', () => {
            panel.hidden = true;
            toggle.setAttribute('aria-expanded', 'false');
            toggle.focus();
        });

        actions.append(resetButton, closeButton);
        panel.appendChild(actions);

        toggle.addEventListener('click', () => {
            panel.hidden = !panel.hidden;
            toggle.setAttribute('aria-expanded', String(!panel.hidden));
        });

        document.body.append(toggle, panel);
    }

    function updateSpatialMap() {
        activeGridMap = Array.from(
            document.querySelectorAll('.element-container:not([data-empty="true"])')
        ).filter(element => {
            if (!element.isConnected) return false;

            const rect = element.getBoundingClientRect();
            const style = window.getComputedStyle(element);

            return rect.width > 0 &&
                rect.height > 0 &&
                style.display !== 'none' &&
                style.visibility !== 'hidden';
        }).map(element => {
            const rect = element.getBoundingClientRect();

            return {
                element,
                left: rect.left,
                top: rect.top,
                right: rect.right,
                bottom: rect.bottom,
                width: rect.width,
                height: rect.height,
                area: rect.width * rect.height
            };
        });
    }

    function findGazeCell(x, y) {
        if (!activeGridMap.length) return null;

        const containing = activeGridMap
            .filter(cell =>
                x >= cell.left && x <= cell.right &&
                y >= cell.top && y <= cell.bottom
            )
            .sort((a, b) => a.area - b.area);

        if (containing.length) return containing[0];

        let nearestCell = null;
        let nearestDistance = Infinity;

        for (const cell of activeGridMap) {
            const dx = Math.max(cell.left - x, 0, x - cell.right);
            const dy = Math.max(cell.top - y, 0, y - cell.bottom);
            const distance = Math.hypot(dx, dy);

            const padding = Math.max(
                GAZE_TUNING.minHitPaddingPx,
                Math.min(
                    GAZE_TUNING.maxHitPaddingPx,
                    Math.min(cell.width, cell.height) * GAZE_TUNING.hitPaddingRatio
                )
            );

            if (distance <= padding && distance < nearestDistance) {
                nearestCell = cell;
                nearestDistance = distance;
            }
        }

        return nearestCell;
    }

    function setGazeDots(rawX, rawY, smoothX, smoothY) {
        const rawDot = document.getElementById('gaze-raw-dot');
        const smoothDot = document.getElementById('gaze-cursor-sim');

        rawDot.style.left = `${rawX}px`;
        rawDot.style.top = `${rawY}px`;
        rawDot.style.display = 'block';

        smoothDot.style.left = `${smoothX}px`;
        smoothDot.style.top = `${smoothY}px`;
        smoothDot.style.display = 'block';
    }

    function setGazeHighlight(element) {
        document.querySelectorAll('.gaze-active-target').forEach(active => {
            if (active !== element) active.classList.remove('gaze-active-target');
        });

        if (element && element.isConnected) {
            element.classList.add('gaze-active-target');
        }
    }

    function clearGazeHighlight(element) {
        if (element && element.classList) {
            element.classList.remove('gaze-active-target');
        }
    }

    function triggerSelection(element) {
        if (!element || !element.isConnected || element.matches(':disabled')) return;

        // Asterics Grid's mouse-click input handles this one click.
        // Do not dispatch extra mousedown/up/click events as well.
        element.click();
    }

    function createCalibrationOverlay(onComplete) {
        const oldOverlay = document.getElementById('gaze-calibration-overlay');
        if (oldOverlay) oldOverlay.remove();

        const overlay = document.createElement('div');
        overlay.id = 'gaze-calibration-overlay';
        overlay.innerHTML = `
            <h2 style="margin: 0 16px 10px;">Eye-Tracker Calibration</h2>
            <p style="max-width: 520px; margin: 0 16px 24px; color: #ccc; line-height: 1.5;">
                Look directly at the target, then click it three times. Complete all nine positions.
            </p>
            <button id="gaze-calibration-target" type="button" aria-label="Calibration target"></button>
            <p id="gaze-calibration-status" style="margin-top: 26px; color: #00ffcc;">
                Target 1 of 9 — clicks 0 of 3
            </p>
        `;
        document.body.appendChild(overlay);

        const target = document.getElementById('gaze-calibration-target');
        const status = document.getElementById('gaze-calibration-status');

        const points = [
            { x: 0.08, y: 0.10 }, { x: 0.50, y: 0.10 }, { x: 0.92, y: 0.10 },
            { x: 0.08, y: 0.50 }, { x: 0.50, y: 0.50 }, { x: 0.92, y: 0.50 },
            { x: 0.08, y: 0.90 }, { x: 0.50, y: 0.90 }, { x: 0.92, y: 0.90 }
        ];

        let pointIndex = 0;
        let clicksAtPoint = 0;

        function showPoint() {
            if (pointIndex >= points.length) {
                overlay.remove();
                if (typeof onComplete === 'function') onComplete();
                return;
            }

            const point = points[pointIndex];
            const x = window.innerWidth * point.x;
            const y = window.innerHeight * point.y;

            target.style.left = `${x}px`;
            target.style.top = `${y}px`;
            clicksAtPoint = 0;
            status.textContent = `Target ${pointIndex + 1} of 9 — clicks 0 of 3`;
        }

        target.addEventListener('click', event => {
            if (window.webgazer && typeof window.webgazer.recordScreenPosition === 'function') {
                window.webgazer.recordScreenPosition(event.clientX, event.clientY, 'click');
            }

            clicksAtPoint++;

            if (clicksAtPoint >= 3) {
                pointIndex++;
                showPoint();
            } else {
                status.textContent =
                    `Target ${pointIndex + 1} of 9 — clicks ${clicksAtPoint} of 3`;
            }
        });

        showPoint();
    }

    function startEyeTrackingLoop() {
        if (gazeLoopStarted || !window.webgazer) return;
        gazeLoopStarted = true;

        let activeTarget = null;
        let dwellStartedAt = 0;
        let stableSamples = 0;
        let pendingTarget = null;
        let pendingTargetStartedAt = 0;
        let missingTargetStartedAt = 0;
        let lastSelectedTarget = null;
        let lastProcessedAt = 0;
        let lastMapRefreshAt = 0;

        updateSpatialMap();

        // Watch for grid navigation and DOM changes. Position refreshes also
        // run periodically and on resize/scroll.
        const observer = new MutationObserver(updateSpatialMap);
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });

        window.addEventListener('resize', updateSpatialMap);
        window.addEventListener('scroll', updateSpatialMap, true);

        window.webgazer.setGazeListener(data => {
            if (!data || !Number.isFinite(data.x) || !Number.isFinite(data.y)) return;

            const now = performance.now();
            if (now - lastProcessedAt < GAZE_TUNING.processingIntervalMs) return;
            lastProcessedAt = now;

            if (now - lastMapRefreshAt >= GAZE_TUNING.mapRefreshIntervalMs) {
                updateSpatialMap();
                lastMapRefreshAt = now;
            }

            if (smoothedGazeX === null || smoothedGazeY === null) {
                smoothedGazeX = data.x;
                smoothedGazeY = data.y;
            } else {
                smoothedGazeX += (data.x - smoothedGazeX) * GAZE_TUNING.smoothing;
                smoothedGazeY += (data.y - smoothedGazeY) * GAZE_TUNING.smoothing;
            }

            setGazeDots(data.x, data.y, smoothedGazeX, smoothedGazeY);

            const cell = findGazeCell(smoothedGazeX, smoothedGazeY);
            const candidate = cell && cell.element && cell.element.isConnected
                ? cell.element
                : null;

            // Prevent repeat activation while gaze remains on the selected cell.
            if (lastSelectedTarget) {
                if (candidate === lastSelectedTarget) return;
                lastSelectedTarget = null;
            }

            if (!candidate) {
                pendingTarget = null;
                pendingTargetStartedAt = 0;

                if (!missingTargetStartedAt) missingTargetStartedAt = now;

                if (
                    activeTarget &&
                    now - missingTargetStartedAt >= GAZE_TUNING.resetGraceMs
                ) {
                    clearGazeHighlight(activeTarget);
                    activeTarget = null;
                    dwellStartedAt = 0;
                    stableSamples = 0;
                }
                return;
            }

            missingTargetStartedAt = 0;

            if (candidate === activeTarget) {
                stableSamples++;

                if (
                    now - dwellStartedAt >= GAZE_TUNING.dwellMs &&
                    stableSamples >= GAZE_TUNING.minStableSamples
                ) {
                    triggerSelection(candidate);
                    lastSelectedTarget = candidate;

                    clearGazeHighlight(candidate);
                    activeTarget = null;
                    dwellStartedAt = 0;
                    stableSamples = 0;
                    pendingTarget = null;
                    pendingTargetStartedAt = 0;
                }
                return;
            }

            // Require a new candidate to persist briefly before switching.
            if (pendingTarget !== candidate) {
                pendingTarget = candidate;
                pendingTargetStartedAt = now;
                return;
            }

            if (now - pendingTargetStartedAt < GAZE_TUNING.switchHysteresisMs) return;

            clearGazeHighlight(activeTarget);
            activeTarget = candidate;
            dwellStartedAt = now;
            stableSamples = 1;
            pendingTarget = null;
            pendingTargetStartedAt = 0;
            setGazeHighlight(activeTarget);
        });
    }

    async function startWebGazerAndCalibration() {
        if (gazeStartupStarted) return;
        gazeStartupStarted = true;

        if (!window.webgazer) {
            console.error('WebGazer did not load. Check the browser console and network access.');
            gazeStartupStarted = false;
            return;
        }

        try {
            // Start once before calibration so its clicks can train WebGazer.
            await window.webgazer.begin();

            window.webgazer.showVideoPreview(true);
            window.webgazer.showPredictionPoints(false);
            window.webgazer.applyKalmanFilter(true);

            createCalibrationOverlay(startEyeTrackingLoop);
        } catch (error) {
            console.error('WebGazer initialization failed:', error);
            gazeStartupStarted = false;
        }
    }

    loadSettings();
    initGazeSettingsMenu();

    window.addEventListener('load', () => {
        setTimeout(startWebGazerAndCalibration, 500);
    });
})();
</script>

<script type="module" src="app/build/asterics-aac.bundle.js"></script>
