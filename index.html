            writable: true,
            enumerable: false,
            value: function(search, replace) {
                return this.replace(
                    Object.prototype.toString.call(search) === '[object RegExp]'
                        ? (search.global ? search : RegExp(search.source, /\/([a-z]*)$/.exec(search.toString())[1] + 'g'))
                        : RegExp(String(search).replace(/[.^$*+?()[{|\\]/g, "\\$&"), "g"),
                    replace
                );
            }
        });
    }

    testEval("function x(a = 1){}", "default parameters");

    if (![].fill) {

    }

    checkModernizr('promises');

    function checkModernizr(modernizrFeature) {
        Modernizr.on(modernizrFeature, function(result) {
            if (!result) logAndRedirect(modernizrFeature);
        });

    function logAndRedirect(missingFeature) {

            console.log(e);
            logAndRedirect(msg);
        }

<script>
(function() {
    'use strict';

    const GAZE_TUNING = {
        dwellMs: 1200,
        smoothing: 0.35,
        hitPaddingRatio: 0.45,
        minHitPaddingPx: 35,
        maxHitPaddingPx: 100,
        resetGraceMs: 250,
        switchHysteresisMs: 180,
        minStableSamples: 8,
        processingIntervalMs: 50,
        mapRefreshIntervalMs: 200,
        rearmMs: 350
    };

    let smoothedGazeX = null;
    let smoothedGazeY = null;
    let gazeStarted = false;
    let activeGridMap = [];

    function updateSpatialMap() {
        activeGridMap = Array.from(
            document.querySelectorAll('.element-container:not([data-empty="true"])')
        ).filter(element => {
            if (!element.isConnected) return false;

            const rect = element.getBoundingClientRect();
            const style = window.getComputedStyle(element);

            return rect.width > 0 &&
                rect.height > 0 &&
                style.display !== 'none' &&
                style.visibility !== 'hidden';
        }).map(element => {
            const rect = element.getBoundingClientRect();
            return {
                element,
                left: rect.left,
                top: rect.top,
                right: rect.right,
                bottom: rect.bottom,
                width: rect.width,
                height: rect.height,
                area: rect.width * rect.height
            };
        });
    }

    function findGazeCell(x, y) {
        if (!activeGridMap.length) return null;

        // Prefer the cell containing the gaze point. In overlaps, prefer
        // the smaller cell.
        const containing = activeGridMap
            .filter(cell =>
                x >= cell.left && x <= cell.right &&
                y >= cell.top && y <= cell.bottom
            )
            .sort((a, b) => a.area - b.area);

        if (containing.length) return containing[0];

        // Allow limited calibration error, scaled to each cell. Do not select
        // a cell if gaze is too far away from all cells.
        let nearestCell = null;
        let nearestDistance = Infinity;

        for (const cell of activeGridMap) {
            const dx = Math.max(cell.left - x, 0, x - cell.right);
            const dy = Math.max(cell.top - y, 0, y - cell.bottom);
            const distance = Math.hypot(dx, dy);

            const padding = Math.max(
                GAZE_TUNING.minHitPaddingPx,
                Math.min(
                    GAZE_TUNING.maxHitPaddingPx,
                    Math.min(cell.width, cell.height) * GAZE_TUNING.hitPaddingRatio
                )
            );

            if (distance <= padding && distance < nearestDistance) {
                nearestCell = cell;
                nearestDistance = distance;
            }
        }

        return nearestCell;
    }

    function setGazeHighlight(element) {
        document.querySelectorAll('.gaze-active-target').forEach(active => {
            if (active !== element) active.classList.remove('gaze-active-target');
        });
        if (element && element.isConnected) {
            element.classList.add('gaze-active-target');
        }
    }

    function clearGazeHighlight(element) {
        if (element && element.classList) {
            element.classList.remove('gaze-active-target');
        }
    }

    function triggerSelection(element) {
        if (!element || !element.isConnected || element.matches(':disabled')) return;

        // Asterics listens for clicks on the element container. Use one click;
        // do not also dispatch mousedown/up or call click() a second time.
        element.click();
    }

    function createCalibrationOverlay(onComplete) {
        const existing = document.getElementById('gaze-calibration-overlay');
        if (existing) existing.remove();

        const overlay = document.createElement('div');
        overlay.id = 'gaze-calibration-overlay';
        overlay.innerHTML = `
            <h2 style="margin: 0 16px 10px;">Eye-Tracker Calibration</h2>
            <p id="gaze-calibration-instructions" style="max-width: 520px; margin: 0 16px 24px; color: #ccc; line-height: 1.5;">
                Look at the target, then click it three times. Complete all nine positions.
            </p>
            <button id="gaze-calibration-target" type="button" aria-label="Calibration target"></button>
            <p id="gaze-calibration-status" style="margin-top: 26px; color: #00ffcc;">
                Target 1 of 9 — clicks 0 of 3
            </p>
        `;
        document.body.appendChild(overlay);

        const target = document.getElementById('gaze-calibration-target');
        const status = document.getElementById('gaze-calibration-status');

        const points = [
            { x: 0.08, y: 0.10 }, { x: 0.50, y: 0.10 }, { x: 0.92, y: 0.10 },
            { x: 0.08, y: 0.50 }, { x: 0.50, y: 0.50 }, { x: 0.92, y: 0.50 },
            { x: 0.08, y: 0.90 }, { x: 0.50, y: 0.90 }, { x: 0.92, y: 0.90 }
        ];

        let pointIndex = 0;
        let clicksAtPoint = 0;

        function showPoint() {
            if (pointIndex >= points.length) {
                overlay.remove();
                if (typeof onComplete === 'function') onComplete();
                return;
            }

            const point = points[pointIndex];
            const x = window.innerWidth * point.x;
            const y = window.innerHeight * point.y;

            target.style.left = `${x}px`;
            target.style.top = `${y}px`;
            clicksAtPoint = 0;
            status.textContent = `Target ${pointIndex + 1} of 9 — clicks 0 of 3`;
        }

        target.addEventListener('click', event => {
            // Train WebGazer with the actual location of this calibration click.
            if (window.webgazer && typeof window.webgazer.recordScreenPosition === 'function') {
                window.webgazer.recordScreenPosition(event.clientX, event.clientY, 'click');
            }

            clicksAtPoint++;

            if (clicksAtPoint >= 3) {
                pointIndex++;
                showPoint();
            } else {
                status.textContent = `Target ${pointIndex + 1} of 9 — clicks ${clicksAtPoint} of 3`;
            }
        });

        showPoint();
    }

    function startEyeTrackingLoop() {
        if (gazeStarted || !window.webgazer) return;
        gazeStarted = true;

        let activeTarget = null;
        let dwellStartedAt = 0;
        let stableSamples = 0;
        let pendingTarget = null;
        let pendingTargetStartedAt = 0;
        let missingTargetStartedAt = 0;
        let lastSelectedTarget = null;
        let lastProcessedAt = 0;
        let lastMapRefreshAt = 0;

        updateSpatialMap();

        const observer = new MutationObserver(() => updateSpatialMap());
        observer.observe(document.body, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['style']
        });

        window.addEventListener('resize', updateSpatialMap);
        window.addEventListener('scroll', updateSpatialMap, true);

        window.webgazer.setGazeListener(data => {
            if (!data || !Number.isFinite(data.x) || !Number.isFinite(data.y)) return;

            const now = performance.now();
            if (now - lastProcessedAt < GAZE_TUNING.processingIntervalMs) return;
            lastProcessedAt = now;

            if (now - lastMapRefreshAt >= GAZE_TUNING.mapRefreshIntervalMs) {
                updateSpatialMap();
                lastMapRefreshAt = now;
            }

            if (smoothedGazeX === null || smoothedGazeY === null) {
                smoothedGazeX = data.x;
                smoothedGazeY = data.y;
            } else {
                smoothedGazeX += (data.x - smoothedGazeX) * GAZE_TUNING.smoothing;
                smoothedGazeY += (data.y - smoothedGazeY) * GAZE_TUNING.smoothing;
            }

            const cursor = document.getElementById('gaze-cursor-sim');
            if (cursor) {
                cursor.style.left = `${smoothedGazeX}px`;
                cursor.style.top = `${smoothedGazeY}px`;
            }

            const cell = findGazeCell(smoothedGazeX, smoothedGazeY);
            const candidate = cell ? cell.element : null;

            // Prevent repeat activation while gaze stays on the selected cell.
            if (lastSelectedTarget) {
                if (candidate === lastSelectedTarget) return;
                lastSelectedTarget = null;
            }

            if (!candidate) {
                pendingTarget = null;
                pendingTargetStartedAt = 0;

                if (!missingTargetStartedAt) missingTargetStartedAt = now;

                if (activeTarget && now - missingTargetStartedAt >= GAZE_TUNING.resetGraceMs) {
                    clearGazeHighlight(activeTarget);
                    activeTarget = null;
                    dwellStartedAt = 0;
                    stableSamples = 0;
                }
                return;
            }

            missingTargetStartedAt = 0;

            if (candidate === activeTarget) {
                stableSamples++;

                if (
                    now - dwellStartedAt >= GAZE_TUNING.dwellMs &&
                    stableSamples >= GAZE_TUNING.minStableSamples
                ) {
                    triggerSelection(candidate);
                    lastSelectedTarget = candidate;

                    clearGazeHighlight(candidate);
                    activeTarget = null;
                    dwellStartedAt = 0;
                    stableSamples = 0;
                    pendingTarget = null;
                    pendingTargetStartedAt = 0;
                }
                return;
            }

            // Require a candidate to remain stable briefly before switching.
            if (pendingTarget !== candidate) {
                pendingTarget = candidate;
                pendingTargetStartedAt = now;
                return;
            }

            if (now - pendingTargetStartedAt < GAZE_TUNING.switchHysteresisMs) return;

            clearGazeHighlight(activeTarget);
            activeTarget = candidate;
            dwellStartedAt = now;
            stableSamples = 1;
            pendingTarget = null;
            pendingTargetStartedAt = 0;
            setGazeHighlight(activeTarget);
        });
    }

    async function startWebGazerAndCalibration() {
        if (window.__gazeCalibrationStarted) return;
        window.__gazeCalibrationStarted = true;

        if (!window.webgazer) {
            console.error('WebGazer did not load. Check the browser console and network access.');
            window.__gazeCalibrationStarted = false;
            return;
        }

        try {
            // Start WebGazer before showing calibration so calibration clicks
            // can be recorded. Do not call begin() again after calibration.
            await window.webgazer.begin();
            window.webgazer.showVideoPreview(true);
            window.webgazer.showPredictionPoints(false);
            window.webgazer.applyKalmanFilter(true);

            createCalibrationOverlay(startEyeTrackingLoop);
        } catch (error) {
            console.error('WebGazer initialization failed:', error);
            window.__gazeCalibrationStarted = false;
        }
    }

    window.addEventListener('load', () => {
        // Let the app finish its initial load before showing the calibration.
        setTimeout(startWebGazerAndCalibration, 500);
    });
})();
</script>
