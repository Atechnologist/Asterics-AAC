    if (!String.prototype.replaceAll) {

            configurable: true,
            writable: true,
            enumerable: false,
            value: function(search, replace) {
                return this.replace(
                    Object.prototype.toString.call(search) === '[object RegExp]'
                        ? (search.global ? search : RegExp(search.source, /\/([a-z]*)$/.exec(search.toString())[1] + 'g'))
                        : RegExp(String(search).replace(/[.^$*+?()[{|\\]/g, "\\$&"), "g"),
                    replace
                );
            }
        });
    }

    testEval("function x(a = 1){}", "default parameters");

    if (![].fill) {

    }

    checkModernizr('promises');
    checkModernizr('indexeddb');

    function checkModernizr(modernizrFeature) {
        Modernizr.on(modernizrFeature, function(result) {
            if (!result) logAndRedirect(modernizrFeature);
        });
    }

    function logAndRedirect(missingFeature) {

    }

    function testEval(evalString, msg) {

<script>
(function () {
    'use strict';

    const SETTINGS_KEY = 'asterics-gaze-settings-v2';
    const RANGE_KEY = 'asterics-gaze-range-v1';

    const DEFAULTS = {
        dwellMs: 1200,
        smoothing: 0.50,
        hitPaddingRatio: 0.35,
        minHitPaddingPx: 30,
        maxHitPaddingPx: 80,
        resetGraceMs: 200,
        switchHysteresisMs: 150,
        minStableSamples: 6,
        processingIntervalMs: 50,
        mapRefreshIntervalMs: 200
    };

    const TUNING = { ...DEFAULTS };

    let calibrationDone = false;
    let gazeLoopStarted = false;
    let activeCells = [];
    let gazeX = null;
    let gazeY = null;
    let recentGaze = [];
    let gazeRange = null;
    let useComfortRange = true;

    function loadSettings() {
        try {
            const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
            for (const key of Object.keys(DEFAULTS)) {
                const value = Number(saved[key]);
                if (Number.isFinite(value)) TUNING[key] = value;
            }
        } catch (error) {
            console.warn('Could not load gaze settings:', error);
        }
    }

    function saveSettings() {
        try {
            localStorage.setItem(SETTINGS_KEY, JSON.stringify(TUNING));
        } catch (error) {
            console.warn('Could not load gaze settings:', error);
        }
    }

    function loadRange() {
        try {
            const saved = JSON.parse(localStorage.getItem(RANGE_KEY) || 'null');
            if (
                saved &&
                Number.isFinite(saved.minX) &&
                Number.isFinite(saved.maxX) &&
                Number.isFinite(saved.minY) &&
                Number.isFinite(saved.maxY)
            ) {
                gazeRange = saved;
            } else {
                gazeRange = null;
            }
        } catch (error) {
            console.warn('Could not load gaze range:', error);
            gazeRange = null;
        }
    }

    function saveRange() {
        try {
            if (gazeRange) {
                localStorage.setItem(RANGE_KEY, JSON.stringify(gazeRange));
            } else {
                localStorage.removeItem(RANGE_KEY);
            }
        } catch (error) {
            console.warn('Could not save gaze range:', error);
        }
    }

    function applyComfortRange(x, y) {
        if (!useComfortRange || !gazeRange) return { x, y };

        const width = Math.max(1, gazeRange.maxX - gazeRange.minX);
        const height = Math.max(1, gazeRange.maxY - gazeRange.minY);

        const mappedX = ((x - gazeRange.minX) / width) * window.innerWidth;
        const mappedY = ((y - gazeRange.minY) / height) * window.innerHeight;

        return {
            x: Math.min(window.innerWidth, Math.max(0, mappedX)),
            y: Math.min(window.innerHeight, Math.max(0, mappedY))
        };
    }

    function updateSpatialMap() {
        activeCells = Array.from(
            document.querySelectorAll('.element-container:not([data-empty="true"])')
        ).filter(element => {
            if (!element.isConnected) return false;
            const rect = element.getBoundingClientRect();
            const style = window.getComputedStyle(element);

            return rect.width > 0 &&
                rect.height > 0 &&
                style.display !== 'none' &&
                style.visibility !== 'hidden';
        }).map(element => {
            const rect = element.getBoundingClientRect();
            return {
                element,
                left: rect.left,
                top: rect.top,
                right: rect.right,
                bottom: rect.bottom,
                width: rect.width,
                height: rect.height,
                area: rect.width * rect.height
            };
        });
    }

    function findCell(x, y) {
        if (!activeCells.length) return null;

        const containing = activeCells
            .filter(cell =>
                x >= cell.left && x <= cell.right &&
                y >= cell.top && y <= cell.bottom
            )
            .sort((a, b) => a.area - b.area);

        return containing[0] || null;
    }

    function setGazeDots(rawX, rawY, smoothX, smoothY) {
        const rawDot = document.getElementById('gaze-raw-dot');
        const smoothDot = document.getElementById('gaze-cursor-sim');

        if (rawDot) {
            rawDot.style.left = `${rawX}px`;
            rawDot.style.top = `${rawY}px`;
            rawDot.style.display = 'block';
        }

        if (smoothDot) {
            smoothDot.style.left = `${smoothX}px`;
            smoothDot.style.top = `${smoothY}px`;
            smoothDot.style.display = 'block';
        }
    }

    function clearGazeHighlight(element) {
        if (element && element.classList) {
            element.classList.remove('gaze-active-target');
        }
    }

    function triggerSelection(element) {
        if (!element || !element.isConnected || element.matches(':disabled')) return;

        element.click();
    }

    function addSettingsMenu() {
        const style = document.createElement('style');
        style.textContent = `
            #gaze-settings-toggle {
                position: fixed;
                top: 12px;
                right: 12px;
                z-index: 99990;
                padding: 9px 12px;
                border: 1px solid #00c9a7;
                border-radius: 6px;
                background: #172321;
                color: #fff;
                font: 14px sans-serif;
                cursor: pointer;
            }

            #gaze-settings-panel {
                position: fixed;
                top: 58px;
                right: 12px;
                z-index: 99990;
                width: min(340px, calc(100vw - 24px));
                max-height: calc(100vh - 75px);
                overflow-y: auto;
                padding: 14px;
                border: 1px solid #00c9a7;
                border-radius: 8px;
                background: rgba(15, 20, 20, 0.97);
                color: #fff;
                font: 14px sans-serif;
                box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
            }

            #gaze-settings-panel[hidden] {
                display: none;
            }

            .gaze-setting {
                margin: 12px 0;
            }

            .gaze-setting-heading {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 5px;
            }

            .gaze-setting input {
                width: 100%;
                accent-color: #00ffcc;
            }

            #gaze-settings-actions {
                display: flex;
                justify-content: space-between;
                gap: 8px;
                margin-top: 14px;
            }

            #gaze-settings-actions button {
                padding: 7px 10px;
                border: 1px solid #00c9a7;
                border-radius: 5px;
                background: #172321;
                color: #fff;
                cursor: pointer;
            }
        `;
        document.head.appendChild(style);

        const settings = [
            {
                key: 'dwellMs',
                label: 'Dwell time',
                min: 500,
                max: 2500,
                step: 100,
                format: v => `${(v / 1000).toFixed(1)} s`
            },
            {
                key: 'smoothing',
                label: 'Gaze responsiveness',
                min: 0.2,
                max: 0.9,
                step: 0.05,
                format: v => Number(v).toFixed(2)
            },
            {
                key: 'hitPaddingRatio',
                label: 'Target tolerance',
                min: 0.15,
                max: 0.6,
                step: 0.05,
                format: v => Number(v).toFixed(2)
            },
            {
                key: 'switchHysteresisMs',
                label: 'Target switch stability',
                min: 50,
                max: 400,
                step: 25,
                format: v => `${v} ms`
            },
            {
                key: 'minStableSamples',
                label: 'Minimum stable samples',
                min: 3,
                max: 12,
                step: 1,
                format: v => `${v}`
            }
        ];

        const toggle = document.createElement('button');
        toggle.id = 'gaze-settings-toggle';
        toggle.type = 'button';
        toggle.textContent = 'Gaze settings';
        toggle.setAttribute('aria-expanded', 'false');

        const panel = document.createElement('section');
        panel.id = 'gaze-settings-panel';
        panel.hidden = true;

        const title = document.createElement('h2');
        title.textContent = 'Gaze settings';
        panel.appendChild(title);

        const help = document.createElement('p');
        help.textContent = 'Adjust one setting at a time. Changes apply immediately and are saved in this browser.';
        panel.appendChild(help);

        settings.forEach(setting => {
            const wrapper = document.createElement('div');
            wrapper.className = 'gaze-setting';

            const heading = document.createElement('div');
            heading.className = 'gaze-setting-heading';

            const label = document.createElement('label');
            const id = `gaze-setting-${setting.key}`;
            label.htmlFor = id;
            label.textContent = setting.label;

            const output = document.createElement('output');
            output.id = `${id}-value`;

            const input = document.createElement('input');
            input.id = id;
            input.type = 'range';
            input.min = String(setting.min);
            input.max = String(setting.max);
            input.step = String(setting.step);
            input.value = String(TUNING[setting.key]);
            output.textContent = setting.format(Number(input.value));

            input.addEventListener('input', () => {
                TUNING[setting.key] = Number(input.value);
                output.textContent = setting.format(TUNING[setting.key]);
                saveSettings();
            });

            heading.append(label, output);
            wrapper.append(heading, input);
            panel.appendChild(wrapper);
        });

        const actions = document.createElement('div');
        actions.id = 'gaze-settings-actions';

        const recalibrate = document.createElement('button');
        recalibrate.type = 'button';
        recalibrate.textContent = 'Recalibrate (9 points)';
        recalibrate.addEventListener('click', () => {
            panel.hidden = true;
            toggle.setAttribute('aria-expanded', 'false');
            createCalibrationOverlay(() => {
                panel.hidden = false;
                toggle.setAttribute('aria-expanded', 'true');
            });
        });

        const comfortCal = document.createElement('button');
        comfortCal.type = 'button';
        comfortCal.textContent = 'Calibrate comfort range';
        comfortCal.addEventListener('click', () => {
            panel.hidden = true;
            toggle.setAttribute('aria-expanded', 'false');
            createComfortRangeOverlay(() => {
                saveRange();
                panel.hidden = false;
                toggle.setAttribute('aria-expanded', 'true');
            });
        });

        const reset = document.createElement('button');
        reset.type = 'button';
        reset.textContent = 'Reset settings';
        reset.addEventListener('click', () => {
            Object.assign(TUNING, DEFAULTS);
            saveSettings();

            settings.forEach(setting => {
                const input = document.getElementById(`gaze-setting-${setting.key}`);
                const output = document.getElementById(`gaze-setting-${setting.key}-value`);
                input.value = String(TUNING[setting.key]);
                output.textContent = setting.format(TUNING[setting.key]);
            });
        });

        actions.append(recalibrate, comfortCal, reset);
        panel.appendChild(actions);

        toggle.addEventListener('click', () => {
            panel.hidden = !panel.hidden;
            toggle.setAttribute('aria-expanded', String(!panel.hidden));
        });

        document.body.append(toggle, panel);
    }

    function createCalibrationOverlay(onComplete) {
        const previous = document.getElementById('gaze-calibration-overlay');
        if (previous) previous.remove();

        const overlay = document.createElement('div');
        overlay.id = 'gaze-calibration-overlay';
        overlay.style.cssText = [
            'position:fixed',
            'inset:0',
            'z-index:999999',
            'display:flex',
            'flex-direction:column',
            'align-items:center',
            'justify-content:center',
            'background:rgba(10,10,10,.95)',
            'color:white',
            'font-family:sans-serif',
            'text-align:center'
        ].join(';');

        overlay.innerHTML = `
            <h2 style="margin:0 16px 10px;">Eye-Tracker Calibration</h2>
            <p style="max-width:540px;margin:0 16px 20px;color:#ccc;line-height:1.5;">
                Keep your head still. Look at each target and click it five times.
                Pause briefly between clicks so the gaze estimate can settle.
            </p>
            <button id="gaze-calibration-target" type="button" aria-label="Calibration target"
                style="position:fixed;width:44px;height:44px;padding:0;border:3px solid white;
                border-radius:50%;background:#00ffcc;box-shadow:0 0 24px #00ffcc;
                cursor:pointer;transform:translate(-50%,-50%);z-index:1000000"></button>
            <p id="gaze-calibration-status" style="margin-top:30px;color:#00ffcc"></p>
        `;
        document.body.appendChild(overlay);

        const target = document.getElementById('gaze-calibration-target');
        const status = document.getElementById('gaze-calibration-status');

        const points = [
            { x: 0.08, y: 0.10 }, { x: 0.50, y: 0.10 }, { x: 0.92, y: 0.10 },
            { x: 0.08, y: 0.50 }, { x: 0.50, y: 0.50 }, { x: 0.92, y: 0.50 },
            { x: 0.08, y: 0.90 }, { x: 0.50, y: 0.90 }, { x: 0.92, y: 0.90 }
        ];

        let pointIndex = 0;
        let clicksAtPoint = 0;

        function showPoint() {
            if (pointIndex >= points.length) {
                overlay.remove();
                if (typeof onComplete === 'function') onComplete();
                return;
            }

            const point = points[pointIndex];
            const screenX = window.innerWidth * point.x;
            const screenY = window.innerHeight * point.y;

            target.style.left = `${screenX}px`;
            target.style.top = `${screenY}px`;
            clicksAtPoint = 0;
            recentGaze = [];
            status.textContent = `Point ${pointIndex + 1} of 9 — clicks 0 of 5`;
        }

        target.addEventListener('click', event => {
            if (window.webgazer && typeof window.webgazer.recordScreenPosition === 'function') {
                window.webgazer.recordScreenPosition(event.clientX, event.clientY, 'click');
            }

            const recent = recentGaze.filter(sample => sample.time >= performance.now() - 700);
            if (recent.length > 0) {
                const meanX = recent.reduce((sum, item) => sum + item.x, 0) / recent.length;
                const meanY = recent.reduce((sum, item) => sum + item.y, 0) / recent.length;

                if (Number.isFinite(meanX) && Number.isFinite(meanY)) {
                    recentGaze.push({ x: meanX, y: meanY, time: performance.now() });
                }
            }

            clicksAtPoint++;
            status.textContent = `Point ${pointIndex + 1} of 9 — clicks ${clicksAtPoint} of 5`;

            if (clicksAtPoint >= 5) {
                pointIndex++;
                showPoint();
            }
        });

        showPoint();
    }

    function createComfortRangeOverlay(onComplete) {
        const previous = document.getElementById('gaze-range-overlay');
        if (previous) previous.remove();

        const overlay = document.createElement('div');
        overlay.id = 'gaze-range-overlay';
        overlay.style.position = 'fixed';
        overlay.style.inset = '0';
        overlay.style.zIndex = '999999';
        overlay.style.display = 'flex';
        overlay.style.flexDirection = 'column';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.background = 'rgba(10, 10, 10, 0.95)';
        overlay.style.color = '#fff';
        overlay.style.fontFamily = 'sans-serif';
        overlay.style.textAlign = 'center';

        const points = [
            { label: 'Top-left', x: 0.12, y: 0.18 },
            { label: 'Top-right', x: 0.88, y: 0.18 },
            { label: 'Bottom-right', x: 0.88, y: 0.82 },
            { label: 'Bottom-left', x: 0.12, y: 0.82 }
        ];

        let step = 0;

        const text = document.createElement('p');
        text.textContent = 'Keep your head still and look at the red dot. Click once at each corner.';
        text.style.maxWidth = '560px';
        text.style.margin = '0 16px 18px';
        text.style.lineHeight = '1.5';
        text.style.color = '#ccc';

        const target = document.createElement('button');
        target.type = 'button';
        target.style.position = 'fixed';
        target.style.width = '44px';
        target.style.height = '44px';
        target.style.borderRadius = '50%';
        target.style.border = '3px solid white';
        target.style.background = '#ff0055';
        target.style.boxShadow = '0 0 24px rgba(255, 0, 85, 0.9)';
        target.style.transform = 'translate(-50%, -50%)';
        target.style.cursor = 'pointer';
        target.style.zIndex = '1000000';

        const status = document.createElement('p');
        status.style.marginTop = '20px';
        status.style.color = '#fff';
        status.style.fontSize = '18px';

        overlay.appendChild(text);
        overlay.appendChild(target);
        overlay.appendChild(status);
        document.body.appendChild(overlay);

        function drawPoint() {
            if (step >= points.length) {
                overlay.remove();
                if (typeof onComplete === 'function') onComplete();
                return;
            }

            const point = points[step];
            const x = window.innerWidth * point.x;
            const y = window.innerHeight * point.y;

            target.style.left = `${x}px`;
            target.style.top = `${y}px`;
            status.textContent = `${point.label} • point ${step + 1} of ${points.length}`;
        }

        target.addEventListener('click', event => {
            if (window.webgazer && typeof window.webgazer.recordScreenPosition === 'function') {
                window.webgazer.recordScreenPosition(event.clientX, event.clientY, 'click');
            }

            const samples = recentGaze.filter(sample => sample.time >= performance.now() - 800);
            let avgX = 0;
            let avgY = 0;

            if (samples.length > 0) {
                avgX = samples.reduce((sum, item) => sum + item.x, 0) / samples.length;
                avgY = samples.reduce((sum, item) => sum + item.y, 0) / samples.length;
            }

            if (Number.isFinite(avgX) && Number.isFinite(avgY)) {
                if (!gazeRange) {
                    gazeRange = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
                }

                gazeRange.minX = Math.min(gazeRange.minX, avgX);
                gazeRange.maxX = Math.max(gazeRange.maxX, avgX);
                gazeRange.minY = Math.min(gazeRange.minY, avgY);
                gazeRange.maxY = Math.max(gazeRange.maxY, avgY);
            }

            step++;
            drawPoint();
        });

        drawPoint();
    }

    function processGaze(data, state) {
        if (!data || !Number.isFinite(data.x) || !Number.isFinite(data.y)) return;

        const now = performance.now();

        recentGaze.push({ x: data.x, y: data.y, time: now });
        recentGaze = recentGaze.filter(sample => sample.time >= now - 1500);

        const mapped = applyComfortRange(data.x, data.y);

        if (gazeX === null || gazeY === null) {
            gazeX = mapped.x;
            gazeY = mapped.y;
        } else {
            gazeX += (mapped.x - gazeX) * TUNING.smoothing;
            gazeY += (mapped.y - gazeY) * TUNING.smoothing;
        }

        setGazeDots(data.x, data.y, gazeX, gazeY);

        if (!calibrationDone) return;

        if (now - state.lastProcessedAt < TUNING.processingIntervalMs) return;
        state.lastProcessedAt = now;

        if (now - state.lastMapRefreshAt >= TUNING.mapRefreshIntervalMs) {
            updateSpatialMap();
            state.lastMapRefreshAt = now;
        }

        const cell = findCell(gazeX, gazeY);
        const candidate = cell && cell.element && cell.element.isConnected ? cell.element : null;

        if (state.lastSelectedTarget) {
            if (candidate === state.lastSelectedTarget) return;
            state.lastSelectedTarget = null;
        }

        if (!candidate) {
            state.pendingTarget = null;
            state.pendingAt = 0;
            if (!state.missingSince) state.missingSince = now;

            if (state.activeTarget && now - state.missingSince >= TUNING.resetGraceMs) {
                clearGazeHighlight(state.activeTarget);
                state.activeTarget = null;
                state.dwellStartedAt = 0;
                state.samples = 0;
            }
            return;
        }

        state.missingSince = 0;

        if (candidate === state.activeTarget) {
            state.samples++;

            if (
                now - state.dwellStartedAt >= TUNING.dwellMs &&
                state.samples >= TUNING.minStableSamples
            ) {
                triggerSelection(candidate);
                state.lastSelectedTarget = candidate;

                clearGazeHighlight(candidate);
                state.activeTarget = null;
                state.dwellStartedAt = 0;
                state.samples = 0;
                state.pendingTarget = null;
                state.pendingAt = 0;
            }
            return;
        }

        if (state.pendingTarget !== candidate) {
            state.pendingTarget = candidate;
            state.pendingAt = now;
            return;
        }

        if (now - state.pendingAt < TUNING.switchHysteresisMs) return;

        clearGazeHighlight(state.activeTarget);
        state.activeTarget = candidate;
        state.dwellStartedAt = now;
        state.samples = 1;
        state.pendingTarget = null;
        state.pendingAt = 0;
        candidate.classList.add('gaze-active-target');
    }

    function startGazeLoop() {
        if (gazeLoopStarted || !window.webgazer) return;
        gazeLoopStarted = true;

        const state = {
            lastProcessedAt: 0,
            lastMapRefreshAt: 0,
            activeTarget: null,
            dwellStartedAt: 0,
            samples: 0,
            pendingTarget: null,
            pendingAt: 0,
            missingSince: 0,
            lastSelectedTarget: null
        };

        updateSpatialMap();

        const observer = new MutationObserver(updateSpatialMap);
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });

        window.addEventListener('resize', updateSpatialMap);
        window.addEventListener('scroll', updateSpatialMap, true);

        window.webgazer.setGazeListener(data => processGaze(data, state));
    }

    async function start() {
        loadSettings();
        loadRange();
        addSettingsMenu();

        if (!window.webgazer) {
            console.error('WebGazer did not load. Check the browser console and network access.');
            return;
        }

        try {
            await window.webgazer.begin();
            window.webgazer.showVideoPreview(true);
            window.webgazer.showPredictionPoints(false);
            window.webgazer.applyKalmanFilter(true);

            startGazeLoop();

            if (!calibrationDone) {
                createCalibrationOverlay(() => {
                    calibrationDone = true;
                });
            }
        } catch (error) {
            console.error('WebGazer initialization failed:', error);
        }
    }

    window.addEventListener('load', () => {
        setTimeout(start, 500);
    });
})();
</script>

<script type="module" src="app/build/asterics-aac.bundle.js"></script>
