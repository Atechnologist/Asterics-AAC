<script>
    // ------------------------------
    // Gaze dwell selection for Asterics Grid
    // ------------------------------
    let smoothedGazeX = null;
    let smoothedGazeY = null;

    window.activeGridMap = window.activeGridMap || {
        cells: [],
        lastUpdated: 0
    };

    const GAZE_TUNING = {
        dwellMs: 1200,
        smoothing: 0.35,
        hitPaddingRatio: 0.35,
        minHitPaddingPx: 30,
        maxHitPaddingPx: 85,
        resetGraceMs: 250,
        switchHysteresisMs: 180,
        minStableSamples: 8,
        processingIntervalMs: 50,
        mapRefreshIntervalMs: 200,
        rearmMs: 350
    };

    function triggerSelection(target) {
        const clickable = target.closest
            ? (target.closest('button, a, input, [role="button"], .q-btn, .grid-item, .element-container') || target)
            : target;

        const rect = clickable.getBoundingClientRect();
        const clientX = rect.left + rect.width / 2;
        const clientY = rect.top + rect.height / 2;

        if (typeof webgazer !== 'undefined' && webgazer.recordScreenPosition) {
            webgazer.recordScreenPosition(clientX, clientY, 'click');
        }

        // Only real click events after dwell. Do not fire hover or pointerenter events.
        clickable.dispatchEvent(new MouseEvent('mousedown', {
            bubbles: true,
            cancelable: true,
            clientX,
            clientY,
            button: 0,
            buttons: 1
        }));

        clickable.dispatchEvent(new MouseEvent('mouseup', {
            bubbles: true,
            cancelable: true,
            clientX,
            clientY,
            button: 0,
            buttons: 0
        }));

        clickable.dispatchEvent(new MouseEvent('click', {
            bubbles: true,
            cancelable: true,
            clientX,
            clientY,
            button: 0,
            buttons: 0
        }));

        if (typeof clickable.click === 'function') {
            clickable.click();
        }
    }

    function resetGazeTarget() {
        const active = document.querySelector('.gaze-active-target');
        if (active) active.classList.remove('gaze-active-target');
        window.__gazeActiveTarget = null;
        window.__gazeDwellStart = 0;
    }

    function smoothGaze(rawX, rawY) {
        if (smoothedGazeX === null || smoothedGazeY === null) {
            smoothedGazeX = rawX;
            smoothedGazeY = rawY;
            return { x: rawX, y: rawY };
        }

        smoothedGazeX += (rawX - smoothedGazeX) * GAZE_TUNING.smoothing;
        smoothedGazeY += (rawY - smoothedGazeY) * GAZE_TUNING.smoothing;
        return { x: smoothedGazeX, y: smoothedGazeY };
    }

    function updateSpatialMap() {
        const cells = document.querySelectorAll('.element-container:not([data-empty="true"])');

        const nextCells = [];

        cells.forEach(element => {
            if (!element.isConnected) return;

            const rect = element.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) return;

            const style = window.getComputedStyle(element);
            if (style.display === 'none' || style.visibility === 'hidden') return;

            nextCells.push({
                element,
                left: rect.left,
                top: rect.top,
                right: rect.right,
                bottom: rect.bottom,
                width: rect.width,
                height: rect.height,
                centerX: rect.left + rect.width / 2,
                centerY: rect.top + rect.height / 2,
                area: rect.width * rect.height
            });
        });

        window.activeGridMap.cells = nextCells;
        window.activeGridMap.lastUpdated = performance.now();
    }

    function findGazeCell(x, y) {
        const cells = window.activeGridMap.cells;
        if (!cells.length) return null;

        const containing = cells
            .filter(cell =>
                x >= cell.left && x <= cell.right &&
                y >= cell.top && y <= cell.bottom
            )
            .sort((a, b) => a.area - b.area);

        if (containing.length) return containing[0];

        let nearest = null;
        let nearestDistance = Infinity;

        for (const cell of cells) {
            const dx = Math.max(cell.left - x, 0, x - cell.right);
            const dy = Math.max(cell.top - y, 0, y - cell.bottom);
            const distance = Math.hypot(dx, dy);

            const padding = Math.max(
                GAZE_TUNING.minHitPaddingPx,
                Math.min(
                    GAZE_TUNING.maxHitPaddingPx,
                    Math.min(cell.width, cell.height) * GAZE_TUNING.hitPaddingRatio
                )
            );

            if (distance <= padding && distance < nearestDistance) {
                nearest = cell;
                nearestDistance = distance;
            }
        }

        return nearest;
    }

    function setGazeHighlight(element) {
        document.querySelectorAll('.gaze-active-target').forEach(active => {
            if (active !== element) active.classList.remove('gaze-active-target');
        });

        if (element && element.isConnected) {
            element.classList.add('gaze-active-target');
        }
    }

    function clearGazeHighlight(element) {
        if (element && element.classList) {
            element.classList.remove('gaze-active-target');
        }
    }

    function createCalibrationOverlay(onComplete) {
        if (window.__gazeCalibrationOverlayStarted) return;
        window.__gazeCalibrationOverlayStarted = true;

        const existing = document.getElementById('gaze-calibration-overlay');
        if (existing) existing.remove();

        const overlay = document.createElement('div');
        overlay.id = 'gaze-calibration-overlay';
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100vw';
        overlay.style.height = '100vh';
        overlay.style.backgroundColor = 'rgba(10, 10, 10, 0.95)';
        overlay.style.zIndex = '999999';
        overlay.style.display = 'flex';
        overlay.style.flexDirection = 'column';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.color = '#fff';
        overlay.style.fontFamily = 'sans-serif';

        overlay.innerHTML = `
            <h2 style="margin-bottom: 10px; font-size: 24px;">Eye-Tracker Setup Calibration</h2>
            <p style="max-width: 450px; text-align: center; color: #bbb; margin-bottom: 30px; line-height: 1.5;">
                Stare directly at the glowing green dot and click it <strong>3 times</strong> with your mouse. Repeat for all positions to map your grid accurately.
            </p>
            <div id="calibration-target" style="width: 40px; height: 40px; background: #00ffcc; border-radius: 50%; cursor: pointer; box-shadow: 0 0 25px #00ffcc; transition: all 0.15s;"></div>
            <p id="calib-status" style="margin-top: 25px; font-weight: bold; color: #00ffcc; font-size: 16px;">Target 1 of 9: Click 3 times</p>
        `;

        document.body.appendChild(overlay);

        const target = document.getElementById('calibration-target');
        const statusText = document.getElementById('calib-status');

        const points = [
            { x: '10vw', y: '12vh' },
            { x: '50vw', y: '12vh' },
            { x: '90vw', y: '12vh' },

            { x: '10vw', y: '50vh' },
            { x: '50vw', y: '50vh' },
            { x: '90vw', y: '50vh' },

            { x: '10vw', y: '88vh' },
            { x: '50vw', y: '88vh' },
            { x: '90vw', y: '88vh' }
        ];

        let currentPoint = 0;
        let clickCount = 0;

        function updateTargetPosition() {
            if (currentPoint >= points.length) {
                overlay.remove();
                if (typeof onComplete === 'function') onComplete();
                return;
            }

            target.style.position = 'absolute';
            target.style.left = points[currentPoint].x;
            target.style.top = points[currentPoint].y;
            clickCount = 0;
            statusText.innerText = `Target ${currentPoint + 1} of ${points.length}: Click 3 times while staring at the dot.`;
        }

        target.addEventListener('click', (e) => {
            if (typeof webgazer !== 'undefined' && webgazer.recordScreenPosition) {
                webgazer.recordScreenPosition(e.clientX, e.clientY, 'click');
            }

            clickCount++;
            statusText.innerText = `Point ${currentPoint + 1} of 9: Click count ${clickCount}/3`;

            if (clickCount >= 3) {
                currentPoint++;
                updateTargetPosition();
            }
        });

        updateTargetPosition();
    }

    function startEyeTrackingLoop() {
        if (window.__gazeCalibrationStarted) return;
        window.__gazeCalibrationStarted = true;

        let activeTarget = null;
        let dwellStartedAt = 0;
        let stableSamples = 0;
        let pendingTarget = null;
        let pendingTargetStartedAt = 0;
        let missingTargetStartedAt = 0;
        let lastProcessedAt = 0;
        let lastMapRefreshAt = 0;
        let lastSelectedTarget = null;

        updateSpatialMap();

        const layoutObserver = new MutationObserver(() => {
            updateSpatialMap();
        });

        layoutObserver.observe(document.body, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['style']
        });

        window.addEventListener('resize', updateSpatialMap);
        window.addEventListener('scroll', updateSpatialMap, true);

        const checkInterval = setInterval(async () => {
            if (typeof webgazer === 'undefined') return;
            clearInterval(checkInterval);

            try {
                await webgazer.begin();
                webgazer.showVideoPreview(false);
                webgazer.showPredictionPoints(false);
                webgazer.showFaceOverlay(false);
                webgazer.applyKalmanFilter(true);

                webgazer.setGazeListener((data) => {
                    if (!data || !Number.isFinite(data.x) || !Number.isFinite(data.y)) return;

                    const now = performance.now();
                    if (now - lastProcessedAt < GAZE_TUNING.processingIntervalMs) return;
                    lastProcessedAt = now;

                    if (now - lastMapRefreshAt >= GAZE_TUNING.mapRefreshIntervalMs) {
                        updateSpatialMap();
                        lastMapRefreshAt = now;
                    }

                    if (smoothedGazeX === null || smoothedGazeY === null) {
                        smoothedGazeX = data.x;
                        smoothedGazeY = data.y;
                    } else {
                        smoothedGazeX += (data.x - smoothedGazeX) * GAZE_TUNING.smoothing;
                        smoothedGazeY += (data.y - smoothedGazeY) * GAZE_TUNING.smoothing;
                    }

                    const cursor = document.getElementById('gaze-cursor-sim');
                    if (cursor) {
                        cursor.style.left = `${smoothedGazeX}px`;
                        cursor.style.top = `${smoothedGazeY}px`;
                    }

                    const cell = findGazeCell(smoothedGazeX, smoothedGazeY);
                    const candidate = cell && cell.element && cell.element.isConnected ? cell.element : null;

                    if (lastSelectedTarget) {
                        if (candidate === lastSelectedTarget) return;
                        lastSelectedTarget = null;
                    }

                    if (!candidate) {
                        pendingTarget = null;
                        pendingTargetStartedAt = 0;

                        if (!missingTargetStartedAt) missingTargetStartedAt = now;

                        if (activeTarget && now - missingTargetStartedAt >= GAZE_TUNING.resetGraceMs) {
                            clearGazeHighlight(activeTarget);
                            activeTarget = null;
                            dwellStartedAt = 0;
                            stableSamples = 0;
                        }
                        return;
                    }

                    missingTargetStartedAt = 0;

                    if (candidate === activeTarget) {
                        stableSamples++;
                        if (
                            now - dwellStartedAt >= GAZE_TUNING.dwellMs &&
                            stableSamples >= GAZE_TUNING.minStableSamples
                        ) {
                            if (candidate.isConnected && !candidate.matches(':disabled')) {
                                triggerSelection(candidate);
                                lastSelectedTarget = candidate;
                            }

                            clearGazeHighlight(candidate);
                            activeTarget = null;
                            dwellStartedAt = 0;
                            stableSamples = 0;
                            pendingTarget = null;
                            pendingTargetStartedAt = 0;
                        }
                        return;
                    }

                    if (pendingTarget !== candidate) {
                        pendingTarget = candidate;
                        pendingTargetStartedAt = now;
                        return;
                    }

                    if (now - pendingTargetStartedAt < GAZE_TUNING.switchHysteresisMs) return;

                    clearGazeHighlight(activeTarget);
                    activeTarget = candidate;
                    dwellStartedAt = now;
                    stableSamples = 1;
                    pendingTarget = null;
                    pendingTargetStartedAt = 0;
                    setGazeHighlight(activeTarget);
                });
            } catch (err) {
                console.error("WebGazer init error:", err);
            }
        }, 200);
    }

    // Delayed startup so the app is ready and calibration is triggered once
    window.addEventListener('load', function () {
        if (window.__gazeCalibrationStarted) return;

        setTimeout(function () {
            if (typeof webgazer !== 'undefined' && !window.__gazeCalibrationStarted) {
                createCalibrationOverlay(function () {
                    startEyeTrackingLoop();
                });
            }
        }, 350);
    });
</script>
